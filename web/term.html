<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舰桥 · 终端</title>
<link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/web/icon.png">
<link href="/web/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/lib/xterm/css/xterm.css">
<link rel="stylesheet" href="/web/style.css">
<link rel="stylesheet" href="/web/texture.css">
<style>:root {
  --x-050a12: #050a12;
}

html, body { background: var(--x-050a12); }
.solo { position: fixed; inset: 0; display: flex; flex-direction: column; border: 0; color: var(--text); font-family: var(--body); }
</style>
</head>
<body>
<div class="pane solo active" id="pane">
<header class="term-head">
<div class="term-who"><b class="t-name">…</b><span class="t-state"></span><span class="t-ctx"></span><span class="term-cwd t-cwd"></span></div>
<div class="term-actions">
<button data-tkey="esc" title="打断当前操作">Esc</button>
<button data-tact="kill" class="danger" title="结束这个 Claude 进程">结束</button>
</div>
</header>
<div class="term-host" id="host"></div>
</div>
<script type="module" src="/web/term.js"></script>
</body>
</html>
