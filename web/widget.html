<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>舰桥 · 战况</title>
<link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/web/icon.png">
<link href="/web/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/web/style.css">
<link rel="stylesheet" href="/web/lamp.css">
<link rel="stylesheet" href="/web/fx.css">
<style>:root {
  --x-050a12: #050a12;
  --x-ff8fa3: #ff8fa3;
}

html, body { background: transparent; overflow: hidden; }
.w { width: 300px; color: var(--text); font-family: var(--body); background: color-mix(in srgb, var(--x-050a12) 96%, transparent); border: 1px solid var(--line-hi); box-shadow: 0 0 18px color-mix(in srgb, var(--cyan) 15%, transparent); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); user-select: none; }
.w-head { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.w-head .logo { font-family: var(--display); font-weight: 900; font-size: 11px; letter-spacing: 1.5px; color: var(--cyan); }
.w-head .chips { flex: 1; display: flex; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.w-head .chips b { font-family: var(--display); font-weight: 700; }
.w-head button { -webkit-app-region: no-drag; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); font-size: 14px; }
.w-head button:hover { color: var(--cyan); }
.w-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.w.folded .w-body > :not(.w-alert) { display: none; }
.w.folded .w-alert:empty { display: none; }
.lim { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.lim .seg { height: 6px; }
.lim-stale { font-size: 10px; color: var(--amber); text-align: right; margin-top: 2px; }
.lim .pct { font-family: var(--display); font-size: 11px; color: var(--text); text-align: right; }
.lim.active .pct { color: var(--amber); }
.lim.low .pct { color: var(--red); }
.w-alert { width: 100%; text-align: left; padding: 7px 9px; border: 1px solid var(--qc, var(--line)); background: color-mix(in srgb, var(--red) 8%, transparent); color: var(--text); font-family: var(--body); font-size: 12px; line-height: 1.45; }
.w-alert:empty { display: none; }
.w-alert b { color: var(--qc); }
.w-alert small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-units { display: flex; flex-direction: column; gap: 3px; }
.row { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; background: var(--panel); border: 1px solid transparent; border-left: 2px solid var(--c); color: var(--text); text-align: left; font-family: var(--body); }
.row:hover { border-color: var(--line-hi); border-left-color: var(--c); }
/* the status light (lamp.css) and its short word before the line; hover either for the details (tip.js) */
.row .lamp-at { display: flex; align-items: center; justify-content: center; width: 8px; height: 100%; }
.row .s .lw { color: var(--c); font-weight: 700; margin-right: 5px; }
.row .mid { min-width: 0; display: flex; flex-direction: column; }
.row .p { font-family: var(--name); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .p small { font-family: var(--body); font-size: 10px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 6px; } /* the project, after the name */
.row .p i { font-style: normal; font-family: var(--body); font-size: 10px; color: var(--bg); background: var(--green); padding: 0 4px; margin-left: 5px; letter-spacing: 0; }
.row .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-family: var(--display); font-size: 10px; color: var(--muted); }
.row .r .ctx { color: var(--kc); font-size: 11px; }
.w-menu { display: flex; flex-direction: column; padding: 4px; background: var(--x-050a12); border-bottom: 1px solid var(--line-hi); }
.w-menu[hidden] { display: none; }
.w-menu button { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; background: transparent; color: var(--soft); font-family: var(--body); font-size: 13px; text-align: left; }
.w-menu button::before { content: ''; width: 14px; flex: none; color: var(--cyan); }
.w-menu button[aria-checked="true"]::before { content: '✓'; }
.w-head .chips .awake { color: var(--amber); }
.w-menu button:disabled { opacity: .45; }
.w-menu button:hover, .w-menu button:focus-visible { background: color-mix(in srgb, var(--cyan) 10%, transparent); color: var(--text); outline: none; }
.w-menu .quit { color: var(--x-ff8fa3); border-top: 1px solid var(--line); }
.w-menu .quit:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }
.more, .empty-w { font-size: 11px; color: var(--muted); text-align: center; padding: 4px; }
</style>
</head>
<body>
<div class="w" id="w">
<header class="w-head" title="拖动移动 · 右键菜单">
<span class="logo">FLEET//BRIDGE</span>
<span class="chips" id="chips"></span>
<button id="w-main" title="打开指挥中心" aria-label="打开指挥中心">⤢</button>
<button id="w-fold" title="折叠 / 展开" aria-label="折叠或展开">▾</button>
<button id="w-tuck" title="最小化到托盘（点任务栏右下角的图标恢复）" aria-label="最小化到托盘">—</button>
<button id="w-menu-btn" title="菜单（也可以右键）" aria-label="菜单" aria-haspopup="menu" aria-expanded="false">☰</button>
</header>
<nav class="w-menu" id="w-menu" role="menu" hidden>
<button role="menuitem" data-act="open-main">打开指挥中心</button>
<button role="menuitemcheckbox" data-act="toggle-mute" id="m-mute">静音提醒</button>
<button role="menuitem" data-act="cycle-awake" id="m-awake" hidden>保持唤醒：有任务时</button>
<button role="menuitemcheckbox" data-act="toggle-awake-screen" id="m-screen" hidden>唤醒时屏幕也不熄灭</button>
<button role="menuitem" data-act="reset-pos">回到右下角</button>
<button role="menuitem" data-act="tuck-widget">最小化到托盘</button>
<button role="menuitemcheckbox" data-act="toggle-autostart" id="m-auto" hidden>开机自动启动</button>
<button role="menuitem" data-act="quit" class="quit">退出</button>
</nav>
<div class="w-body">
<div id="limits"></div>
<button class="w-alert" id="alert"></button>
<div class="w-units" id="units"></div>
</div>
</div>
<script type="module" src="/web/widget.js"></script>
</body>
</html>
