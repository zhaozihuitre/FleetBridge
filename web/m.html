<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#04060c">
<title>舰桥 · 手机</title>
<link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/web/icon.png">
<link href="/web/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/web/m.css">
<link rel="stylesheet" href="/web/texture.css">
<link rel="stylesheet" href="/web/lamp.css">
<link rel="stylesheet" href="/web/fx.css">
</head>
<body>
<header class="top">
<div class="brand">
<svg class="fleet-logo" width="34" height="26" viewBox="3 11 58 44" fill="none" aria-hidden="true"><ellipse cx="32" cy="39" rx="25" ry="10" fill="none" stroke="#1b6f80" stroke-width="1.6"/><g><animateMotion path="M57 39 A25 10 0 1 1 57 38.99" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".75;1;.75;.42;.75" keyTimes="0;.25;.5;.75;1" dur="12s" begin="0s" repeatCount="indefinite"/><g transform="scale(0.3)"><path class="fl" d="M-2.6 14 L2.6 14 L0 27 Z" fill="#ffb020"/><path d="M0 -18 L12 18 L0 11 L-12 18 Z" fill="#2fc6d6"/></g></g><g><animateMotion path="M57 39 A25 10 0 1 1 57 38.99" dur="12s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".75;1;.75;.42;.75" keyTimes="0;.25;.5;.75;1" dur="12s" begin="-4s" repeatCount="indefinite"/><g transform="scale(0.3)"><path class="fl" d="M-2.6 14 L2.6 14 L0 27 Z" fill="#ffb020"/><path d="M0 -18 L12 18 L0 11 L-12 18 Z" fill="#2fc6d6"/></g></g><g><animateMotion path="M57 39 A25 10 0 1 1 57 38.99" dur="12s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".75;1;.75;.42;.75" keyTimes="0;.25;.5;.75;1" dur="12s" begin="-8s" repeatCount="indefinite"/><g transform="scale(0.3)"><path class="fl" d="M-2.6 14 L2.6 14 L0 27 Z" fill="#ffb020"/><path d="M0 -18 L12 18 L0 11 L-12 18 Z" fill="#2fc6d6"/></g></g><g transform="translate(32 28)"><g transform="scale(0.74)"><path class="fl" d="M-2.6 14 L2.6 14 L0 27 Z" fill="#ffb020"/><path d="M0 -18 L12 18 L0 11 L-12 18 Z" fill="#3df5ff"/><path d="M0 -10 V7" stroke="#0a1120" stroke-width="2.70" stroke-linecap="round" opacity=".5"/></g></g></svg>
<b>FLEET<i>//</i>BRIDGE</b>
<span class="conn" id="conn"><i></i><span id="conn-text">连接中</span></span>
<button type="button" class="voice-btn" id="voice-btn" aria-pressed="false" title="在这台手机上朗读通知">🔈</button>
<button type="button" class="view-full" id="view-full" title="切到完整版指挥中心（这台设备记住这个选择）">完整版</button>
</div>
<div class="chips-row"><div class="chips" id="chips"></div><button type="button" class="lg-btn" id="lamp-legend-btn" aria-expanded="false" aria-controls="lamp-legend" title="状态灯图例">?</button></div>
<div class="psys" id="psys" hidden></div>
<div class="quota" id="quota"></div>
</header>
<div class="pend" id="pend" hidden></div>
<div class="list-tabs" role="tablist"><button type="button" role="tab" data-view="units" aria-selected="true"><span class="en">UNITS</span>部队</button><button type="button" role="tab" data-view="notices" aria-selected="false"><span class="en">NOTICES</span>通知<i class="nt-new" id="nt-new" hidden></i></button></div>
<main id="list" aria-live="polite"></main>
<div class="sheet" id="sheet" hidden>
<div class="sheet-head"><button type="button" id="sheet-close" class="back" aria-label="返回部队">‹</button><div class="sh-title"><b id="sheet-name"></b><span id="sheet-st"></span></div><button type="button" class="wrap" id="wrap" aria-pressed="true" title="长行折行显示（关掉后左右滑动看原样）">换行</button></div>
<div class="screen-wrap"><pre class="screen" id="screen"></pre></div>
<div class="menu" id="sheet-menu"></div>
<div class="keys" id="keys" role="group" aria-label="按键">
<button type="button" data-key="esc" class="k-esc">Esc</button><button type="button" data-key="up" aria-label="上">↑</button><button type="button" data-key="down" aria-label="下">↓</button><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="tab">Tab</button><button type="button" data-key="enter" class="k-enter" aria-label="回车">⏎</button>
</div>
<form class="input" id="input"><textarea id="text" rows="1" placeholder="输入…" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><button type="submit" id="send">发送</button></form>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/web/m.js"></script>
</body>
</html>
