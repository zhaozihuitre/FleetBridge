<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#04060c">
<title>舰桥 · 手机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/m.css">
</head>
<body>
<header class="top">
<div class="brand">
<svg width="26" height="26" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M17 2l13 7.5v15L17 32 4 24.5v-15z" stroke="#3DF5FF" stroke-width="1.6"/><path d="M9 17h4l2-5 4 10 2-5h4" stroke="#3DF5FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
<b>FLEET<i>//</i>BRIDGE</b>
<span class="conn" id="conn"><i></i><span id="conn-text">连接中</span></span>
</div>
<div class="chips" id="chips"></div>
<div class="quota" id="quota"></div>
</header>
<nav class="tabs" role="tablist">
<button role="tab" data-view="msgs" aria-selected="true"><span class="en">ALERTS</span>消息<span class="badge" id="n-msgs"></span></button>
<button role="tab" data-view="units" aria-selected="false"><span class="en">UNITS</span>部队<span class="badge" id="n-units"></span></button>
</nav>
<main id="list" aria-live="polite"></main>
<form class="composer" id="composer">
<div class="c-row"><label class="target"><span class="en">TO</span><select id="target" aria-label="发给"></select></label><button type="button" id="queue" aria-pressed="false">⏱ 排队</button></div>
<div class="c-row"><textarea id="text" rows="2" placeholder="输入指令…"></textarea><button type="submit" id="send"><span class="en">SEND</span>发送</button></div>
</form>
<div class="sheet" id="sheet" hidden>
<div class="sheet-head"><button type="button" id="sheet-close" class="back" aria-label="关闭">‹</button><div class="sh-title"><span class="en">TERMINAL</span><b id="sheet-name"></b></div><span class="live"><i></i>LIVE</span><button type="button" class="wrap" id="wrap" aria-pressed="true" title="长行折行显示（关掉后左右滑动看原样）">换行</button><button type="button" class="esc" data-key="esc" title="打断当前操作">Esc</button></div>
<div class="screen-wrap"><pre class="screen" id="screen"></pre></div>
<div class="menu" id="sheet-menu"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/web/m.js"></script>
</body>
</html>
