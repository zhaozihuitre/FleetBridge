<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舰桥 · Fleet Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lib/xterm/css/xterm.css">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="stage">
<div class="screen" id="screen">

<header class="hud">
<div class="brand box">
<svg width="32" height="32" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M17 2l13 7.5v15L17 32 4 24.5v-15z" stroke="#3DF5FF" stroke-width="1.5"/><path d="M9 17h4l2-5 4 10 2-5h4" stroke="#3DF5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div><b>FLEET//BRIDGE</b><small>舰桥 · 多项目指挥中心</small></div>
</div>
<div class="energy-row" id="energy"></div>
<div class="pilot box">
<div><small id="pilot">PILOT</small><b id="clock">--:--:--</b></div>
<button class="icon-btn" id="refresh" aria-label="立即刷新" title="立即刷新">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
</button>
<div class="win-ctl">
<button data-win="minimize" aria-label="最小化" title="最小化">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg>
</button>
<button data-win="maximize" aria-label="最大化或还原" title="最大化 / 还原（双击顶栏也可以）">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="5" width="14" height="14"/></svg>
</button>
<button data-win="close" class="close" aria-label="关闭指挥中心" title="关闭指挥中心（agent 和小窗继续运行）">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
</div>
</header>

<div class="main">
<section class="operator" id="operator" aria-label="总指令台">
<div class="op-tags"><span class="tag">COMMAND · 总指令台</span><span class="tag mood" id="op-mood">● 待命</span></div>
<div class="op-nova" id="op-nova"><div class="op-av" id="op-av" title="点她一下"></div><div class="op-say"><b id="op-say-tag">NOVA</b><p id="op-say">正在连接指挥网络…</p></div></div>
<div class="msg-box" id="msg-box" role="log" aria-label="消息"><div class="msg in"><div class="msg-text">正在连接指挥网络…</div></div></div>
<form class="cmd-form" id="cmd-form">
<label class="sr-only" for="cmd-text">指令</label>
<div class="cmd-input">
<textarea id="cmd-text" rows="4" placeholder="输入指令，Ctrl+Enter 发送。&#10;@名字 只发给指定的终端，不写 @ 就发给全部我方 agent。作战中的会排队执行。"></textarea>
<div class="cmd-suggest" id="cmd-suggest" role="listbox" hidden></div>
</div>
<div class="cmd-row"><span class="cmd-to" id="cmd-to"></span><span class="cmd-err" id="cmd-err" role="alert"></span><button type="submit" class="btn" id="cmd-send">▶ 发送</button></div>
</form>
</section>

<section class="command" aria-label="指挥面板">
<nav class="tabs" role="tablist">
<span class="key">Q</span>
<button class="tab" role="tab" data-tab="units"><span class="en">UNITS</span><span class="cn">部队</span><span class="n" id="n-units">0</span></button>
<button class="tab" role="tab" data-tab="quests"><span class="en">QUEST</span><span class="cn">任务</span><span class="n" id="n-quests">0</span></button>
<button class="tab" role="tab" data-tab="comms"><span class="en">COMMS</span><span class="cn">通讯</span><span class="n" id="n-comms">0</span></button>
<button class="tab" role="tab" data-tab="archive"><span class="en">ARCHIVE</span><span class="cn">存档</span><span class="n" id="n-archive">0</span></button>
<span class="key">E</span>
<span class="summary" id="summary"></span>
<button class="deploy-btn all" id="deploy-all" title="打开最近 4 个项目各自最新的会话，分屏排开">⚡ 全军出击</button>
<button class="deploy-btn" id="deploy-open" title="在指挥中心里启动一个新的 Claude Code（N）">＋ 出击</button>
</nav>
<div class="page" id="page"></div>
<div class="pager">
<button class="prev" id="prev">◀ 上一页 <kbd>[←]</kbd></button>
<div class="dots" id="dots"></div>
<button class="next" id="next">下一页 ▶ <kbd>[→]</kbd></button>
</div>

<section class="term-panel" id="term-panel" aria-label="部队终端" hidden>
<header class="term-bar">
<span class="mono">TERMINALS</span><span id="term-count"></span>
<span class="term-add" id="term-add"></span>
<button id="term-dyn" aria-pressed="true" title="动态分屏：当前 / 刚收到指令的终端变大，其他变小">⇔ 动态</button>
<button id="term-close-all" title="收起所有终端（agent 继续运行）">✕ 全部收起</button>
</header>
<div class="term-grid" id="term-grid"></div>
</section>
</section>
</div>

<footer class="keys">
<span class="conn" id="conn">● 连接中</span>
<span class="hint"><span><b>Q / E</b> 切换标签</span><span><b>← / →</b> 翻页</span><span><b>ENTER</b> 跳到终端</span><span><b>SPACE</b> 下一条提醒</span><span><b>S</b> 稍后提醒</span><span><b>N</b> 出击</span></span>
</footer>
</div>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog class="deploy" id="deploy">
<form method="dialog" id="deploy-form">
<h2><span class="mono">DEPLOY</span> 出击 · 启动新的 Claude Code</h2>
<label>作战地点（文件夹）<input id="dp-cwd" list="dp-folders" required autocomplete="off" placeholder="D:\projects\xxx"></label>
<datalist id="dp-folders"></datalist>
<div class="dp-mode" id="dp-mode" hidden>
<label><input type="radio" name="dp-mode" value="resume" checked> <span id="dp-latest"></span></label>
<label><input type="radio" name="dp-mode" value="new"> 开新会话</label>
</div>
<p class="dp-note" id="dp-note"></p>
<label>呼号（可选，会话名称）<input id="dp-name" maxlength="60" autocomplete="off" placeholder="例如 fix-login"></label>
<label>首个指令（可选，启动后自动发送）<textarea id="dp-prompt" rows="4" placeholder="例如：看一下 README，告诉我这个项目怎么跑起来"></textarea></label>
<p class="deploy-err" id="dp-err" role="alert"></p>
<div class="deploy-row"><button type="button" class="btn ghost" id="dp-cancel">取消</button><button type="submit" class="btn" id="dp-go">▶ 出击</button></div>
</form>
</dialog>
<script src="/web/nova.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
