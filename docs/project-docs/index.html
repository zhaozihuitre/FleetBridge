<script id="data" type="application/json">{"project": {"name": "Fleet Bridge · 舰桥", "description": "游戏风格的 Claude Code 多项目指挥舰桥：额度、会话状态、git、授权提醒，内嵌终端统一指挥多个 agent", "lang": "zh", "created": "2026-10-30 15:56", "todo_stale_days": 30, "hook": {"remind_on_edit": true, "min_edits": 1}}, "lang": "zh", "stale_days": 30, "generated": "2026-11-04 08:42", "types": {"change": "变更", "milestone": "里程碑", "issue": "常见问题", "todo": "TODO", "decision": "决策"}, "sections": [{"id": "overview", "file": "01-overview.md", "title": "项目概述", "empty": false, "updated": "2026-10-31 10:12", "html": "<h1 id=\"项目概述\">项目概述<\/h1>\n<h2 id=\"定位与背景\">定位与背景<\/h2>\n<p>同时开好几个 Claude Code 会话做不同项目时，很难知道：额度还剩多少、哪个会话做完了在等我、哪个卡在授权确认上、哪个上下文快满了、各项目 git 有没有忘提交。<\/p>\n<p><strong>Fleet Bridge（舰桥）<\/strong> 是一个只在本机运行的游戏风格「指挥中心」，把这些信息集中显示，并且可以在指挥中心里直接启动、分屏操作多个 Claude Code（称为「我方 agent」），用一个输入框统一下达指令。<\/p>\n<ul><li>用户：本机同时使用多个 Claude Code 会话的开发者（Windows）<\/li><li>只监听 <code>127.0.0.1<\/code>，数据里有账号邮箱和项目路径，不对外暴露<\/li><\/ul>\n<h2 id=\"核心能力\">核心能力<\/h2>\n<ul><li><strong>额度监控<\/strong>：5 小时 / 本周 / 按模型（如 Fable）的已用百分比与重置倒计时<\/li><li><strong>会话监控<\/strong>：每个会话的状态（作战中 / 待命 / 等授权）、记忆负载（context）、子 agent、各仓库 git 状态<\/li><li><strong>提醒<\/strong>：等你授权、做完了、负载过高、能量告急、git 改动搁置 → 指挥中心任务列表 + 战况小窗 + Windows 通知<\/li><li><strong>我方 agent<\/strong>：在指挥中心内嵌终端里启动真实的交互式 <code>claude<\/code>；最多 4 分屏、可弹出独立窗口；总指令台广播 / <code>@<\/code> 指定发送；全军出击；重启后自动恢复阵容<\/li><li><strong>存档<\/strong>：按项目文件夹列出所有历史会话，可「在此继续」或在外部终端继续<\/li><\/ul>\n<h2 id=\"技术栈\">技术栈<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>层<\/th><th>技术<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>桌面壳<\/td><td>Electron 45<\/td><td>战况小窗（置顶）、指挥中心（无边框）、弹出终端窗口<\/td><\/tr><tr><td>后端<\/td><td>Node.js（ESM，无框架）<\/td><td><code>http<\/code> + SSE 推送状态，<code>ws<\/code> 做终端通道<\/td><\/tr><tr><td>终端<\/td><td><code>@lydell/node-pty<\/code>（ConPTY）+ <code>@xterm/xterm<\/code>（WebGL 渲染）<\/td><td>伪终端里跑真实 <code>claude<\/code>，网页里显示<\/td><\/tr><tr><td>前端<\/td><td>原生 HTML / CSS / JS 模块<\/td><td>无构建步骤<\/td><\/tr><tr><td>打包<\/td><td>electron-builder（NSIS）<\/td><td>Windows 安装程序，按用户安装<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"目录结构\">目录结构<\/h2>\n<pre><code class=\"lang-\">FleetBridge/\n├── server/              后端：采集、状态计算、API、agent 管理\n│   ├── index.js         HTTP / SSE / WebSocket 入口、定时刷新\n│   ├── state.js         组装状态、任务（quest）、事件（comms）、领航员台词\n│   ├── agents.js        我方 agent：node-pty 启动 claude、输入输出\n│   ├── roster.js        阵容保存 / 重启恢复 / 孤儿进程清理\n│   ├── collectors/      usage / sessions / transcript / git / history / notifications\n│   ├── hook.js          Claude Code Notification hook 脚本（授权提醒）\n│   ├── focus.js         把外部会话的终端窗口切到前台\n│   ├── launch.js        在 Windows Terminal 里 claude --resume\n│   └── config.js demo.js probe.js\n├── web/                 前端页面\n│   ├── index.html app.js style.css   指挥中心\n│   ├── widget.html widget.js         战况小窗\n│   ├── term.html term.js terminal.js 终端（分屏 / 弹出窗口）\n│   └── ui.js                         主题确认框\n├── desktop/             Electron 主进程与 preload；icon.png 为窗口 / 任务栏图标\n├── build/icon.png       程序图标（安装包 / exe）\n├── build/installer.nsh  安装时清理旧版快捷方式\n└── docs/project-docs/   本文档<\/code><\/pre>\n<h2 id=\"快速开始\">快速开始<\/h2>\n<pre><code class=\"lang-bash\">npm install\nnpm run app        # 开发版：战况小窗 + 后端（端口 8787）\nnpm start          # 只开后端，浏览器访问 http://127.0.0.1:8787\nnpm run dist       # 打包 Windows 安装程序到 dist/<\/code><\/pre>", "text": " ## 定位与背景 同时开好几个 Claude Code 会话做不同项目时，很难知道：额度还剩多少、哪个会话做完了在等我、哪个卡在授权确认上、哪个上下文快满了、各项目 git 有没有忘提交。 **Fleet Bridge（舰桥）** 是一个只在本机运行的游戏风格「指挥中心」，把这些信息集中显示，并且可以在指挥中心里直接启动、分屏操作多个 Claude Code（称为「我方 agent」），用一个输入框统一下达指令。 - 用户：本机同时使用多个 Claude Code 会话的开发者（Windows） - 只监听 `127.0.0.1`，数据里有账号邮箱和项目路径，不对外暴露 ## 核心能力 - **额度监控**：5 小时 / 本周 / 按模型（如 Fable）的已用百分比与重置倒计时 - **会话监控**：每个会话的状态（作战中 / 待命 / 等授权）、记忆负载（context）、子 agent、各仓库 git 状态 - **提醒**：等你授权、做完了、负载过高、能量告急、git 改动搁置 → 指挥中心任务列表 + 战况小窗 + Windows 通知 - **我方 agent**：在指挥中心内嵌终端里启动真实的交互式 `claude`；最多 4 分屏、可弹出独立窗口；总指令台广播 / `@` 指定发送；全军出击；重启后自动恢复阵容 - **存档**：按项目文件夹列出所有历史会话，可「在此继续」或在外部终端继续 ## 技术栈 | 层 | 技术 | 说明 | |---|---|---| | 桌面壳 | Electron 45 | 战况小窗（置顶）、指挥中心（无边框）、弹出终端窗口 | | 后端 | Node.js（ESM，无框架） | `http` + SSE 推送状态，`ws` 做终端通道 | | 终端 | `@lydell/node-pty`（ConPTY）+ `@xterm/xterm`（WebGL 渲染） | 伪终端里跑真实 `claude`，网页里显示 | | 前端 | 原生 HTML / CSS / JS 模块 | 无构建步骤 | | 打包 | electron-builder（NSIS） | Windows 安装程序，按用户安装 | ## 目录结构 ``` FleetBridge/ ├── server/ 后端：采集、状态计算、API、agent 管理 │ ├── index.js HTTP / SSE / WebSocket 入口、定时刷新 │ ├── state.js 组装状态、任务（quest）、事件（comms）、领航员台词 │ ├── agents.js 我方 agent：node-pty 启动 claude、输入输出 │ ├── roster.js 阵容保存 / 重启恢复 / 孤儿进程清理 │ ├── collectors/ usage / sessions / transcript / git / history / notifications │ ├── hook.js Claude Code Notification hook 脚本（授权提醒） │ ├── focus.js 把外部会话的终端窗口切到前台 │ ├── launch.js 在 Windows Terminal 里 claude --resume │ └── config.js demo.js probe.js ├── web/ 前端页面 │ ├── index.html app.js style.css 指挥中心 │ ├── widget.html widget.js 战况小窗 │ ├── term.html term.js terminal.js 终端（分屏 / 弹出窗口） │ └── ui.js 主题确认框 ├── desktop/ Electron 主进程与 preload；icon.png 为窗口 / 任务栏图标 ├── build/icon.png 程序图标（安装包 / exe） ├── build/installer.nsh 安装时清理旧版快捷方式 └── docs/project-docs/ 本文档 ``` ## 快速开始 ```bash npm install npm run app # 开发版：战况小窗 + 后端（端口 8787） npm start # 只开后端，浏览器访问 http://127.0.0.1:8787 npm run dist # 打包 Windows 安装程序到 dist/ ``` "}, {"id": "features", "file": "02-features.md", "title": "功能说明", "empty": false, "updated": "2026-11-03 09:40", "html": "<h1 id=\"功能说明\">功能说明<\/h1>\n<h2 id=\"功能清单\">功能清单<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>功能<\/th><th>模块<\/th><th>状态<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>额度条<\/td><td>指挥中心顶栏 / 小窗<\/td><td>完成<\/td><td>按接口 <code>limits<\/code> 列表显示已用 % 和重置倒计时<\/td><\/tr><tr><td>部队（会话卡片）<\/td><td>指挥中心 · UNITS<\/td><td>完成<\/td><td>状态、负载、子 agent、git，按窗口宽度自动排列<\/td><\/tr><tr><td>活动终端<\/td><td>指挥中心 · AGENTS<\/td><td>完成<\/td><td>所有我方终端，单个打开或全部打开<\/td><\/tr><tr><td>通讯记录<\/td><td>指挥中心 · COMMS<\/td><td>完成<\/td><td>状态变化事件，持久化<\/td><\/tr><tr><td>存档<\/td><td>指挥中心 · ARCHIVE<\/td><td>完成<\/td><td>按文件夹分组的历史会话<\/td><\/tr><tr><td>我方 agent / 出击<\/td><td>指挥中心<\/td><td>完成<\/td><td>内嵌终端里启动真实 claude<\/td><\/tr><tr><td>分屏 / 弹出窗口<\/td><td>终端面板<\/td><td>完成<\/td><td>最多 4 分屏，⧉ 弹出<\/td><\/tr><tr><td>总指令台<\/td><td>指挥中心左侧<\/td><td>完成<\/td><td>消息框 + 输入框，广播或 <code>@<\/code> 指定<\/td><\/tr><tr><td>全军出击<\/td><td>指挥中心<\/td><td>完成<\/td><td>最近 4 个项目最新会话<\/td><\/tr><tr><td>恢复阵容<\/td><td>后端<\/td><td>完成<\/td><td>重启 / 升级 / 崩溃后接回 agent<\/td><\/tr><tr><td>战况小窗<\/td><td>桌面<\/td><td>完成<\/td><td>置顶、可折叠、主题菜单<\/td><\/tr><tr><td>授权提醒<\/td><td>hook + 后端<\/td><td>完成<\/td><td>会话弹出权限确认时最高优先级提醒<\/td><\/tr><tr><td>语言切换<\/td><td>指挥中心顶栏 🌐<\/td><td>完成<\/td><td>中文 / English / 日本語，所有窗口与服务端提醒同步<\/td><\/tr><tr><td>PR / CI 状态<\/td><td>—<\/td><td>未做<\/td><td>需要 <code>gh<\/code> 登录，见 T-001<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"额度\">额度<\/h2>\n<ul><li>数据来自 <code>api.anthropic.com/api/oauth/usage<\/code> 的 <code>limits<\/code> 列表：<code>session<\/code>（5 小时）、<code>weekly_all<\/code>（本周所有模型）、<code>weekly_scoped<\/code>（按模型，如 Fable）。新出现的额度项会自动显示。<\/li><li>显示<strong>已用<\/strong>百分比（和 <code>/usage<\/code> 一致）；当前起限制作用的一项标橙色，剩余 ≤ 10% 标红。<\/li><li><strong>消耗速度与预测<\/strong>：每次读额度都记下来（<code>~/.claude-ops/usage-history.json<\/code>，保留 8 天），在同一个重置周期内按最近的斜率算每小时用掉多少（5 小时额度看最近 1 小时，周额度看最近 6 小时，至少 10 分钟的数据）。额度条左下显示 <code>+12%/h<\/code>；照这个速度会在重置前用完时改为红色「约 19:52 用完」，若在 2 小时内用完还会出一条 A 级提醒。<\/li><li>测试实例请设 <code>MONITOR_USAGE=off<\/code>：额度接口按账号限流，多开实例一起轮询会让正式程序只能显示旧缓存（小窗与指挥中心都会标「缓存 HH:MM」）。<\/li><li><strong>额度的第二个来源：我方 agent 的状态栏<\/strong>。Claude Code 每次刷新状态栏都会把当前额度（<code>rate_limits<\/code>：5 小时、本周）传给状态栏命令；我方 agent 的状态栏是一个什么都不显示的小脚本（<code>~/.claude-ops/statusline.cmd<\/code> → <code>statusline.cjs<\/code>，用本程序自身以 Node 模式运行），把这份额度存到 <code>statusline-usage.json<\/code>。比接口读数新时就用它：只要有我方 agent 在干活，额度就是最新的，且不受接口限流影响。按模型的周额度（如 Fable）不在其中，仍取接口最后一次的值。状态栏在 Windows 上可能由 PowerShell 执行，所以命令只写 .cmd 路径。<\/li><li>接口被限流时显示最后一次缓存，并按 2、4、8…最长 30 分钟退避（见 I-001）。<\/li><\/ul>\n<h2 id=\"部队与状态\">部队与状态<\/h2>\n<ul><li><strong>部队页列出所有项目<\/strong>：先是正在运行的会话（作战中 / 待命 / 等你授权），后面是没有运行的项目，每个项目一张卡、用它最新的会话，按最后活动时间倒序（最多 16 个；跳过 <code>AppData<\/code> 临时目录和用户主目录）。<\/li><li>未运行的卡片标 <code>OFFLINE · 未出击<\/code>，样式同运行中的卡片：负载、模型、最后汇报（没有就显示最后指令）、仓库与推送目标；计时器是距最后一次活动的时间。按钮「▶ 出击」在指挥中心里继续这个会话，「外部终端」在 Windows Terminal 里继续。<\/li><li>未运行项目的 git 每 2 分钟扫描一次（运行中的仍是 30 秒），控制开销。<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>状态<\/th><th>判定<\/th><th>颜色<\/th><\/tr><\/thead><tbody><tr><td>作战中<\/td><td>状态文件 <code>status = busy<\/code><\/td><td>青<\/td><\/tr><tr><td>待命（做完了，等你指令）<\/td><td><code>idle<\/code>，且空闲不超过 30 分钟<\/td><td>橙<\/td><\/tr><tr><td>休眠<\/td><td><code>idle<\/code> 超过 30 分钟<\/td><td>灰<\/td><\/tr><tr><td>等你授权<\/td><td>收到授权 hook 通知，且会话还没继续往下走<\/td><td>红（闪烁）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>记忆负载<\/strong> = 最后一条 assistant 消息的 input + cache_read + cache_creation token；窗口大小按模型推断（opus-5 系列 1M，其余 200K），≥ 85% 标红。<\/li><li><strong>git<\/strong>：会话目录下 2 层内的每个仓库：分支、上游、↑↓、未提交文件数与增删行、最早改动搁置时长、stash、merge/rebase 中途、Claude 最后改动时间。<\/li><li><strong>远程仓库（推送目标）<\/strong>：每个仓库显示 <code>git push<\/code> 会推到哪里——上游分支所属的远程，没有上游时用 <code>origin<\/code>，只有一个远程时用它。显示为 <code>origin  github.com/owner/repo<\/code>，点击打开仓库页面；有多个远程时标出「另有 upstream」，没有远程时橙色提示「只在本地」。URL 里带的用户名 / 令牌在后端就去掉，不会显示。<\/li><li><strong>审查改动<\/strong>：有未提交改动或未推送提交的仓库行上有「审查改动」按钮，打开审查窗口：顶部是推送目标（远程名、仓库地址、领先几个提交），左侧改动文件（状态、增删行数），右侧该文件相对 HEAD 的彩色差异（新文件对空）；底部写提交说明后「提交」（<code>git add -A<\/code> + <code>git commit<\/code>）、「提交并推送」或单独「推送」（没有上游时推到 origin 并设上游）。后端只接受 git 采集已发现的仓库路径（<code>/api/git/changes|diff|commit|push<\/code>）。<\/li><li><strong>终端标题栏的仓库标签<\/strong>：<code>⎇ owner/repo · 分支<\/code>，取 Claude 最后改动的仓库（文件夹下只有一个仓库时就是它），悬停列出该文件夹下所有仓库的远程。<\/li><li>外部终端里的会话只能监控和「跳过去」（把它的终端窗口切到前台）。<\/li><\/ul>\n<h2 id=\"活动终端-agents\">活动终端（AGENTS）<\/h2>\n<ul><li>第二个标签：列出所有正在运行的我方终端，每行显示状态（作战中 / 待命 / 等你授权 / 启动中）、项目、名字、最后汇报、记忆负载，以及是否已在分屏里。<\/li><li>每行「▶ 打开」把它加入分屏并切过去（已在分屏的显示「切过去」）；顶部「⧉ 全部打开」一次打开全部（分屏最多 4 个，多出的会提示）。<\/li><li>顶部「■ 全部结束」：确认后让所有我方终端退出（会话记录保留，可在部队页或存档里继续）。只收起不结束用终端区顶栏的「✕ 全部收起」。<\/li><li>原来的「任务」页已去掉：各类提醒（授权、做完了、负载、git、额度）都在总指令台的消息框里，可跳转、稍后、直接回应授权。<\/li><\/ul>\n<h2 id=\"我方-agent\">我方 agent<\/h2>\n<ul><li><strong>出击（N）<\/strong>：选文件夹。该文件夹有历史会话时<strong>默认继续最新会话<\/strong>；也可以选「开新会话」并起呼号、写首个指令（启动后自动发送）。最新会话正在外部终端运行时不能接管，自动改为开新会话。<\/li><li><strong>全军出击<\/strong>：取最近活跃的 4 个项目文件夹（跳过主目录和 <code>AppData<\/code> 临时目录），接管各自最新会话并分屏（动态分屏下一个居中、其余在左侧竖排）；在外部终端运行的跳过并顺延。<\/li><li><strong>在此继续<\/strong>：存档里接管已结束的会话。同一会话不会被接管两次（见 I-007）。<\/li><li>我方 agent 启动时不显示用户的 claude-hud 状态栏（通过 <code>--settings<\/code> 关掉），负载显示在终端标题栏。<\/li><li>我方 agent 用 Claude Code 的 <code>dark-ansi<\/code> 主题启动（同样通过 <code>--settings<\/code>，不影响你自己终端里的主题）：它只用终端的 16 色，<code>web/terminal.js<\/code> 把这 16 色映射成指挥中心的配色（青为主色，琥珀、红、绿，及配套的蓝、紫）；Claude 的品牌强调色（logo 等，ANSI 亮红）映射为青色。正文为柔和的薄荷绿（<code>#a6e8c0<\/code>），次要文字灰绿，强调为带绿的白（手机「看屏幕」同一套）。已在运行的 agent 下次启动时生效。<\/li><li>退出程序会结束我方 agent；阵容会被保存，下次启动自动恢复。<\/li><\/ul>\n<h2 id=\"手机访问\">手机访问<\/h2>\n<ul><li>顶栏手机图标 → 「开启手机访问」：另开一个只给手机的服务（端口 = 主端口 + 2，安装版为 8789），监听局域网；电脑上的主服务仍只在 127.0.0.1。默认关闭，设置存 <code>~/.claude-ops/mobile.json<\/code>。<\/li><li><strong>配对<\/strong>：对话框里的二维码带一次性密钥，手机扫码后得到有效期 1 年的 HttpOnly Cookie，之后直接打开 <code>http://&lt;电脑IP&gt;:8789/m<\/code>。没有 Cookie 的请求一律拒绝（401），错误密钥 403。「重新生成密钥」让所有已配对的手机失效。装了 Tailscale 时也会列出 Tailscale 地址，可在外面用。<\/li><li><strong>手机页面<\/strong>（<code>web/m.html<\/code>）：额度（含用完预测）、消息（授权请求可直接回应）、部队列表、我方 agent 的当前屏幕（只读，2 秒刷新，可发 Esc）、底部输入框（选发给谁、⏱ 排队、发送）。<\/li><li><strong>看屏幕<\/strong>：彩色显示（后台 <code>server/screenhtml.js<\/code> 按终端同一套配色把屏幕转成 HTML），代码、差异的颜色与电脑上一致。屏幕上有编号菜单（选择题、模型选择等，以当前项光标 ❯ 或 &gt; 识别）时，下方列出为按钮，点一下即选；标题栏有 Esc 按钮可打断。其他输入直接在底部输入框里打字发送。<\/li><li><strong>能做的只有<\/strong>：看状态、看屏幕、发指令 / 排队、回应授权与菜单、Esc。不能启动或结束 agent、不能提交代码、不能改设置。<\/li><li>局域网内是明文 HTTP：在公共 Wi-Fi 上不要开；在外面用请走 Tailscale（加密）。首次开启时 Windows 防火墙会询问，需允许「专用网络」。<\/li><\/ul>\n<h2 id=\"手机推送-ntfy\">手机推送（ntfy）<\/h2>\n<ul><li>目的：不看屏幕也知道该做什么。手机装 ntfy（安卓：Google Play / F-Droid，免费），在「手机访问」对话框里开启「推送通知」，扫码订阅（二维码是 <code>ntfy://ntfy.sh/&lt;频道&gt;<\/code> 深链接，扫后直接在 App 里订阅）。<\/li><li>推送什么：等你授权（立即，最高优先级）、做完了（空闲满 20 秒）、额度告急、记忆负载过高（每会话每小时最多一次）；启动时已经在等的不推。无论指挥中心是否开着都推。<\/li><li>推送内容只有「哪个项目、什么事」，不带命令、代码或回复；消息经过 ntfy.sh 服务器。频道名是随机长串（<code>~/.claude-ops/push.json<\/code>），「换一个频道」可作废旧订阅。手机访问开着时，点通知直接打开手机页。<\/li><li>实现：<code>server/push.js<\/code>，按 ntfy 的 JSON 发布格式 POST 到 <code>https://ntfy.sh<\/code>；<code>/api/push<\/code>（开关、换频道）、<code>/api/push/test<\/code>。<\/li><\/ul>\n<h2 id=\"全文搜索\">全文搜索<\/h2>\n<ul><li>标签栏右侧的搜索框：在所有历史会话（存档里的最近 300 个）中搜你写的指令和 Claude 的回复（不搜工具输出），回车后在存档页显示结果：每个会话最多两段命中片段（标出 YOU / CLAUDE，关键词高亮），可以直接「在此继续」。点左侧文件夹、按 Esc 或 ✕ 退出搜索。<\/li><li>实现：<code>server/search.js<\/code> 在 worker 线程里扫描会话记录（约 500 MB 需 2–3 秒，不阻塞推送），<code>GET /api/search?q=<\/code>。<\/li><\/ul>\n<h2 id=\"终端面板\">终端面板<\/h2>\n<ul><li>部队卡片「▶ 终端」、小窗点击我方行、存档「▶ 终端」都会把终端加入分屏，最多 4 个，满了替换当前（青框）那一个。<\/li><li>顶栏列出未打开的我方 agent，一键加入。<\/li><li><strong>动态分屏<\/strong>（顶栏「⇔ 动态」，默认开，记在本机）：当前终端（点击或输入的那个）在左边占满整个高度、约 3/4 宽；其他终端在右侧一列从上到下排列（按打开顺序），字号略小、稍暗。总指令台只发给一个 agent（含 <code>@<\/code> 单个）时，它自动成为当前终端；发给多个时它们的边框闪一下。关掉后恢复等分，按钮显示「▦ 等分」（开着时显示「⇔ 动态」），一眼能看出当前模式。终端在动画结束后才重新计算尺寸，避免 Claude 反复重绘。<\/li><li>每个终端标题栏：名字、状态、负载条与 token、Esc、⧉ 弹出、结束、收起。<\/li><li>标题栏在名字旁用橙色显示<strong>项目文件夹名<\/strong>；没有起呼号的 agent 直接以项目名作名字。动态分屏左侧的小终端只保留名字、项目、状态和收起按钮，保证名字看得清；悬停显示完整路径。<\/li><\/ul>\n<h2 id=\"总指令台\">总指令台<\/h2>\n<ul><li>位于指挥中心最左侧。<\/li><li><strong>顶部是今日概况<\/strong>（4 格）：今日 token（含输出量、涉及会话数，悬停看输入 / 缓存读写 / 输出明细）、缓存命中率（≥80% 绿、≥50% 橙）、今日指令数（你输入的，不含工具结果和斜杠命令）、等你的会话数（待命未休眠 + 等授权）与最久等待时长。<ul><li>统计范围：今天（本地 0 点起）写过的所有会话记录，包括已结束的会话和子 agent；同一条回复的多行记录按消息 id 去重。每 30 秒更新。<\/li><\/ul><\/li><li><strong>上方是消息框<\/strong>：所有提醒（等你授权、做完了、负载过高、git…）以消息形式列出，最急的在最上面；每条带「▶ 跳到终端」「稍后」。点一条选中它，Enter 跳转、Space 下一条、S 稍后。发出的指令以右侧气泡显示在「已发送」下面。<\/li><li>每条消息占满消息框宽度；提醒消息标题栏右侧显示发生时间（超过一天带日期，悬停看完整时间）。<\/li><li><strong>下方是输入框和发送<\/strong>：<code>Ctrl+Enter<\/code> 发送。写 <code>@名字<\/code> 只发给被点名的 agent（<code>@<\/code> 后可写前缀或项目文件夹名，打 <code>@<\/code> 有补全），不写 <code>@<\/code> 就发给全部我方 agent。<\/li><li>发给忙碌中的 agent 时，Claude Code 会排队，做完当前任务再执行。<\/li><li><strong>在消息框里直接回应授权<\/strong>（我方 agent）：后台用 <code>@xterm/headless<\/code> 保留每个 agent 的屏幕副本，弹出权限对话框时读出要做的事（工具、文件或命令、预览）和编号选项，显示在 PERMIT 消息里，点「1. Yes」等选项或「拒绝（Esc）」直接回应，不用切到终端。只认第一个选项是 Yes 的对话框。即使授权 hook 没触发（hook 失败或被关掉），从屏幕识别到对话框也会产生「等你授权」提醒。外部终端里的会话仍需切过去处理。<\/li><li>要打断单个 agent，用它终端标题栏的 Esc。<\/li><li><strong>⏱ 排队<\/strong>（输入框下方，开关记在本机）：开着时发出的指令进入各 agent 的队列，agent 每做完一轮、空闲满 5 秒（且没有等授权）就自动发下一条；排队中的指令在消息框「排队中」下列出，可 ✕ 移除。队列存在 <code>~/.claude-ops/queues.json<\/code>，重启后继续。与 Claude Code 自己的排队不同：它会把排队的消息合并成一次，这里是一轮一条。<\/li><li><strong>☰ 常用<\/strong>：保存常用指令（<code>~/.claude-ops/prompts.json<\/code>），点一条填入输入框，「＋ 保存当前输入」添加，✕ 删除。<\/li><\/ul>\n<h2 id=\"战况小窗\">战况小窗<\/h2>\n<ul><li>置顶，右下角为锚点向上生长；指挥中心显示时自动隐藏。<\/li><li>标题栏「—」最小化到托盘（任务栏右下角通知区域）：点托盘图标显示 / 隐藏小窗，右键托盘可打开指挥中心或退出。最小化状态会记住，重启后仍隐藏。<\/li><li>额度条、最急的一条任务、所有部队（点一行：我方 → 打开终端，外部 → 切到其窗口）。<\/li><li>☰ / 右键：打开指挥中心、静音提醒、回到右下角、开机自动启动（仅安装版）、退出。<\/li><li>Windows 通知（静音时不弹；指挥中心在屏幕上时不弹，它已经显示了一切）：<ul><li>「等你授权」：立即通知。<\/li><li>「做完了」：会话空闲满 20 秒才通知，轮次之间的短暂停顿不算。<\/li><li>「负载过高」：每个会话每小时最多一次。<\/li><\/ul><\/li><\/ul>\n<h2 id=\"语言\">语言<\/h2>\n<ul><li>顶栏的地球按钮：中文 / English / 日本語。选择保存在本机（<code>localStorage<\/code>），小窗、弹出终端跟着切换；同时告诉后台（<code>POST /api/lang<\/code>，存 <code>~/.claude-ops/settings.json<\/code>），提醒、领航员台词、通讯记录、额度名称、错误提示也用同一种语言生成。<\/li><li>不翻译的内容：会话里你和 Claude 写的文字（指令、汇报、标题），以及切换前已经写下的通讯记录。<\/li><li>实现：前端 <code>web/i18n.js<\/code>，代码里写中文，<code>L(&#x27;还有 {0} 个仓库…&#x27;, n)<\/code> 按当前语言的词典（<code>EN<\/code>、<code>JA<\/code>，键都是中文原文）取译文；静态 HTML 在加载时由 <code>translateDom()<\/code> 翻译。后端 <code>server/i18n.js<\/code>，<code>L(&#x27;中文&#x27;, &#x27;English&#x27;, &#x27;日本語&#x27;)<\/code> 就地写三种文本。新加界面文字时，两本词典都要补。<\/li><\/ul>\n<h2 id=\"窗口\">窗口<\/h2>\n<ul><li>指挥中心是无边框窗口，右上角自带按钮：<strong>全屏<\/strong>（盖住任务栏，按钮图标随状态切换）、最小化、最大化 / 还原、关闭（只是收起，agent 和小窗继续运行）。<\/li><li><strong>F11<\/strong> 随时切换全屏，输入时也有效。<\/li><\/ul>\n<h2 id=\"快捷键-指挥中心\">快捷键（指挥中心）<\/h2>\n<p>界面上不再显示快捷键提示（底栏只在连接断开时出现），快捷键照常可用：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>键<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>Q / E<\/td><td>切换标签<\/td><\/tr><tr><td>← / →<\/td><td>翻页；存档页 ↑ / ↓ 切换文件夹<\/td><\/tr><tr><td>Enter<\/td><td>跳到当前提醒的终端<\/td><\/tr><tr><td>Space / S<\/td><td>下一条提醒 / 稍后提醒<\/td><\/tr><tr><td>N<\/td><td>出击<\/td><\/tr><tr><td>Esc<\/td><td>收起所有终端<\/td><\/tr><\/tbody><\/table><\/div>", "text": " ## 功能清单 | 功能 | 模块 | 状态 | 说明 | |---|---|---|---| | 额度条 | 指挥中心顶栏 / 小窗 | 完成 | 按接口 `limits` 列表显示已用 % 和重置倒计时 | | 部队（会话卡片） | 指挥中心 · UNITS | 完成 | 状态、负载、子 agent、git，按窗口宽度自动排列 | | 活动终端 | 指挥中心 · AGENTS | 完成 | 所有我方终端，单个打开或全部打开 | | 通讯记录 | 指挥中心 · COMMS | 完成 | 状态变化事件，持久化 | | 存档 | 指挥中心 · ARCHIVE | 完成 | 按文件夹分组的历史会话 | | 我方 agent / 出击 | 指挥中心 | 完成 | 内嵌终端里启动真实 claude | | 分屏 / 弹出窗口 | 终端面板 | 完成 | 最多 4 分屏，⧉ 弹出 | | 总指令台 | 指挥中心左侧 | 完成 | 消息框 + 输入框，广播或 `@` 指定 | | 全军出击 | 指挥中心 | 完成 | 最近 4 个项目最新会话 | | 恢复阵容 | 后端 | 完成 | 重启 / 升级 / 崩溃后接回 agent | | 战况小窗 | 桌面 | 完成 | 置顶、可折叠、主题菜单 | | 授权提醒 | hook + 后端 | 完成 | 会话弹出权限确认时最高优先级提醒 | | 语言切换 | 指挥中心顶栏 🌐 | 完成 | 中文 / English / 日本語，所有窗口与服务端提醒同步 | | PR / CI 状态 | — | 未做 | 需要 `gh` 登录，见 T-001 | ## 额度 - 数据来自 `api.anthropic.com/api/oauth/usage` 的 `limits` 列表：`session`（5 小时）、`weekly_all`（本周所有模型）、`weekly_scoped`（按模型，如 Fable）。新出现的额度项会自动显示。 - 显示**已用**百分比（和 `/usage` 一致）；当前起限制作用的一项标橙色，剩余 ≤ 10% 标红。 - **消耗速度与预测**：每次读额度都记下来（`~/.claude-ops/usage-history.json`，保留 8 天），在同一个重置周期内按最近的斜率算每小时用掉多少（5 小时额度看最近 1 小时，周额度看最近 6 小时，至少 10 分钟的数据）。额度条左下显示 `+12%/h`；照这个速度会在重置前用完时改为红色「约 19:52 用完」，若在 2 小时内用完还会出一条 A 级提醒。 - 测试实例请设 `MONITOR_USAGE=off`：额度接口按账号限流，多开实例一起轮询会让正式程序只能显示旧缓存（小窗与指挥中心都会标「缓存 HH:MM」）。 - **额度的第二个来源：我方 agent 的状态栏**。Claude Code 每次刷新状态栏都会把当前额度（`rate_limits`：5 小时、本周）传给状态栏命令；我方 agent 的状态栏是一个什么都不显示的小脚本（`~/.claude-ops/statusline.cmd` → `statusline.cjs`，用本程序自身以 Node 模式运行），把这份额度存到 `statusline-usage.json`。比接口读数新时就用它：只要有我方 agent 在干活，额度就是最新的，且不受接口限流影响。按模型的周额度（如 Fable）不在其中，仍取接口最后一次的值。状态栏在 Windows 上可能由 PowerShell 执行，所以命令只写 .cmd 路径。 - 接口被限流时显示最后一次缓存，并按 2、4、8…最长 30 分钟退避（见 I-001）。 ## 部队与状态 - **部队页列出所有项目**：先是正在运行的会话（作战中 / 待命 / 等你授权），后面是没有运行的项目，每个项目一张卡、用它最新的会话，按最后活动时间倒序（最多 16 个；跳过 `AppData` 临时目录和用户主目录）。 - 未运行的卡片标 `OFFLINE · 未出击`，样式同运行中的卡片：负载、模型、最后汇报（没有就显示最后指令）、仓库与推送目标；计时器是距最后一次活动的时间。按钮「▶ 出击」在指挥中心里继续这个会话，「外部终端」在 Windows Terminal 里继续。 - 未运行项目的 git 每 2 分钟扫描一次（运行中的仍是 30 秒），控制开销。 | 状态 | 判定 | 颜色 | |---|---|---| | 作战中 | 状态文件 `status = busy` | 青 | | 待命（做完了，等你指令） | `idle`，且空闲不超过 30 分钟 | 橙 | | 休眠 | `idle` 超过 30 分钟 | 灰 | | 等你授权 | 收到授权 hook 通知，且会话还没继续往下走 | 红（闪烁） | - **记忆负载** = 最后一条 assistant 消息的 input + cache_read + cache_creation token；窗口大小按模型推断（opus-5 系列 1M，其余 200K），≥ 85% 标红。 - **git**：会话目录下 2 层内的每个仓库：分支、上游、↑↓、未提交文件数与增删行、最早改动搁置时长、stash、merge/rebase 中途、Claude 最后改动时间。 - **远程仓库（推送目标）**：每个仓库显示 `git push` 会推到哪里——上游分支所属的远程，没有上游时用 `origin`，只有一个远程时用它。显示为 `origin github.com/owner/repo`，点击打开仓库页面；有多个远程时标出「另有 upstream」，没有远程时橙色提示「只在本地」。URL 里带的用户名 / 令牌在后端就去掉，不会显示。 - **审查改动**：有未提交改动或未推送提交的仓库行上有「审查改动」按钮，打开审查窗口：顶部是推送目标（远程名、仓库地址、领先几个提交），左侧改动文件（状态、增删行数），右侧该文件相对 HEAD 的彩色差异（新文件对空）；底部写提交说明后「提交」（`git add -A` + `git commit`）、「提交并推送」或单独「推送」（没有上游时推到 origin 并设上游）。后端只接受 git 采集已发现的仓库路径（`/api/git/changes|diff|commit|push`）。 - **终端标题栏的仓库标签**：`⎇ owner/repo · 分支`，取 Claude 最后改动的仓库（文件夹下只有一个仓库时就是它），悬停列出该文件夹下所有仓库的远程。 - 外部终端里的会话只能监控和「跳过去」（把它的终端窗口切到前台）。 ## 活动终端（AGENTS） - 第二个标签：列出所有正在运行的我方终端，每行显示状态（作战中 / 待命 / 等你授权 / 启动中）、项目、名字、最后汇报、记忆负载，以及是否已在分屏里。 - 每行「▶ 打开」把它加入分屏并切过去（已在分屏的显示「切过去」）；顶部「⧉ 全部打开」一次打开全部（分屏最多 4 个，多出的会提示）。 - 顶部「■ 全部结束」：确认后让所有我方终端退出（会话记录保留，可在部队页或存档里继续）。只收起不结束用终端区顶栏的「✕ 全部收起」。 - 原来的「任务」页已去掉：各类提醒（授权、做完了、负载、git、额度）都在总指令台的消息框里，可跳转、稍后、直接回应授权。 ## 我方 agent - **出击（N）**：选文件夹。该文件夹有历史会话时**默认继续最新会话**；也可以选「开新会话」并起呼号、写首个指令（启动后自动发送）。最新会话正在外部终端运行时不能接管，自动改为开新会话。 - **全军出击**：取最近活跃的 4 个项目文件夹（跳过主目录和 `AppData` 临时目录），接管各自最新会话并分屏（动态分屏下一个居中、其余在左侧竖排）；在外部终端运行的跳过并顺延。 - **在此继续**：存档里接管已结束的会话。同一会话不会被接管两次（见 I-007）。 - 我方 agent 启动时不显示用户的 claude-hud 状态栏（通过 `--settings` 关掉），负载显示在终端标题栏。 - 我方 agent 用 Claude Code 的 `dark-ansi` 主题启动（同样通过 `--settings`，不影响你自己终端里的主题）：它只用终端的 16 色，`web/terminal.js` 把这 16 色映射成指挥中心的配色（青为主色，琥珀、红、绿，及配套的蓝、紫）；Claude 的品牌强调色（logo 等，ANSI 亮红）映射为青色。正文为柔和的薄荷绿（`#a6e8c0`），次要文字灰绿，强调为带绿的白（手机「看屏幕」同一套）。已在运行的 agent 下次启动时生效。 - 退出程序会结束我方 agent；阵容会被保存，下次启动自动恢复。 ## 手机访问 - 顶栏手机图标 → 「开启手机访问」：另开一个只给手机的服务（端口 = 主端口 + 2，安装版为 8789），监听局域网；电脑上的主服务仍只在 127.0.0.1。默认关闭，设置存 `~/.claude-ops/mobile.json`。 - **配对**：对话框里的二维码带一次性密钥，手机扫码后得到有效期 1 年的 HttpOnly Cookie，之后直接打开 `http://<电脑IP>:8789/m`。没有 Cookie 的请求一律拒绝（401），错误密钥 403。「重新生成密钥」让所有已配对的手机失效。装了 Tailscale 时也"}, {"id": "architecture", "file": "03-architecture.md", "title": "架构与模块", "empty": false, "updated": "2026-11-01 16:47", "html": "<h1 id=\"架构与模块\">架构与模块<\/h1>\n<h2 id=\"整体架构\">整体架构<\/h2>\n<pre class=\"mermaid\">flowchart LR\n  subgraph Electron[\"Electron（desktop/main.cjs）\"]\n    W[战况小窗 widget.html]\n    M[指挥中心 index.html]\n    P[弹出终端 term.html]\n    S[后端 server/index.js]\n  end\n  CC[(~/.claude&lt;br/&gt;sessions / projects / credentials)] --&gt; S\n  API[api.anthropic.com&lt;br/&gt;oauth/usage &amp; profile] --&gt; S\n  GIT[git 仓库] --&gt; S\n  HOOK[Notification hook&lt;br/&gt;~/.claude-ops/hook.js] --&gt; DATA[(~/.claude-ops)]\n  DATA --&gt; S\n  S -- SSE /api/stream --&gt; W &amp; M &amp; P\n  M &amp; P -- WebSocket /ws/agents --&gt; S\n  S -- node-pty --&gt; A[我方 claude 进程]\n  OUT[外部终端里的 claude] -. 写状态文件 .-&gt; CC\n  A -. 写状态文件 .-&gt; CC<\/pre>\n<p>后端在 Electron 主进程内启动（也可 <code>npm start<\/code> 单独运行，此时 Electron 发现端口被占用就直接复用）。所有页面都通过 <code>http://127.0.0.1:8787<\/code> 访问后端。<\/p>\n<h2 id=\"模块说明\">模块说明<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>模块<\/th><th>路径<\/th><th>职责<\/th><th>依赖<\/th><\/tr><\/thead><tbody><tr><td>入口<\/td><td><code>server/index.js<\/code><\/td><td>定时刷新、组装状态、SSE 推送、REST API、终端 WebSocket、恢复阵容<\/td><td>全部 collectors、state、agents、roster<\/td><\/tr><tr><td>状态<\/td><td><code>server/state.js<\/code><\/td><td>部队 / 任务 / 事件 / 领航员台词；事件写 <code>comms.jsonl<\/code><\/td><td>config<\/td><\/tr><tr><td>额度<\/td><td><code>server/collectors/usage.js<\/code><\/td><td>读令牌调用 usage / profile；限流退避；本地缓存<\/td><td>—<\/td><\/tr><tr><td>会话<\/td><td><code>server/collectors/sessions.js<\/code><\/td><td>读 <code>~/.claude/sessions/*.json<\/code>，判断进程存活，合并 transcript、子 agent、授权通知<\/td><td>transcript、notifications<\/td><\/tr><tr><td>会话记录<\/td><td><code>server/collectors/transcript.js<\/code><\/td><td>增量读取 <code>.jsonl<\/code>：负载、最后汇报 / 指令、编辑过的文件<\/td><td>—<\/td><\/tr><tr><td>git<\/td><td><code>server/collectors/git.js<\/code><\/td><td>找仓库、<code>status --porcelain=v2 -z<\/code>、log、diff、stash<\/td><td>git 命令<\/td><\/tr><tr><td>存档<\/td><td><code>server/collectors/history.js<\/code><\/td><td>扫描所有会话记录头尾，取 cwd / 标题 / 最后指令<\/td><td>—<\/td><\/tr><tr><td>今日统计<\/td><td><code>server/collectors/today.js<\/code><\/td><td>增量读今天写过的会话记录（含子 agent）：token、缓存命中、指令数；每 30 秒随 git 刷新<\/td><td>—<\/td><\/tr><tr><td>授权通知<\/td><td><code>server/collectors/notifications.js<\/code><\/td><td>增量读 hook 写的 <code>notifications.jsonl<\/code><\/td><td>—<\/td><\/tr><tr><td>我方 agent<\/td><td><code>server/agents.js<\/code><\/td><td>node-pty 启动 <code>claude<\/code>，屏幕缓冲、输入、按 pid 绑定会话<\/td><td>node-pty<\/td><\/tr><tr><td>阵容<\/td><td><code>server/roster.js<\/code><\/td><td>保存 / 读取 <code>roster.json<\/code>；判断孤儿进程<\/td><td>PowerShell<\/td><\/tr><tr><td>桌面壳<\/td><td><code>desktop/main.cjs<\/code><\/td><td>小窗、指挥中心窗口、通知、菜单动作、退出确认<\/td><td>Electron<\/td><\/tr><tr><td>指挥中心<\/td><td><code>web/app.js<\/code><\/td><td>渲染各页、分屏、总指令台、出击<\/td><td>terminal.js、ui.js<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"关键设计\">关键设计<\/h2>\n<ul><li><strong>只读外部状态<\/strong>：从不刷新 OAuth 令牌，git 用 <code>GIT_OPTIONAL_LOCKS=0<\/code>，不给外部会话写入任何东西（D-001）。<\/li><li><strong>授权提醒用 hook<\/strong>：会话状态文件里没有「等待授权」状态，只能靠 Notification hook（D-002）。<\/li><li><strong>指挥中心自己发起 agent<\/strong>：外部程序无法向运行中的终端会话输入，所以可控制的 agent 必须由我们启动（D-003）。<\/li><li><strong>我方 agent 按进程识别<\/strong>：<code>/clear<\/code>、恢复会话都可能换会话 ID，进程不变（D-004）。<\/li><li>**数据目录在 <code>~/.claude-ops<\/code>**：安装版程序目录只读；开发版与安装版共用（D-006）。<\/li><li><strong>阵容随时保存、启动时恢复<\/strong>：退出时冻结阵容不被清空，崩溃后靠「父进程已不存在」识别孤儿（见 I-003）。<\/li><li><strong>只监听 127.0.0.1<\/strong>，API 检查 <code>Origin<\/code>，WebSocket 同样校验；接管 / 恢复只接受自己扫描到的会话 ID。<\/li><\/ul>", "text": " ## 整体架构 ```mermaid flowchart LR subgraph Electron[\"Electron（desktop/main.cjs）\"] W[战况小窗 widget.html] M[指挥中心 index.html] P[弹出终端 term.html] S[后端 server/index.js] end CC[(~/.claude<br/>sessions / projects / credentials)] --> S API[api.anthropic.com<br/>oauth/usage & profile] --> S GIT[git 仓库] --> S HOOK[Notification hook<br/>~/.claude-ops/hook.js] --> DATA[(~/.claude-ops)] DATA --> S S -- SSE /api/stream --> W & M & P M & P -- WebSocket /ws/agents --> S S -- node-pty --> A[我方 claude 进程] OUT[外部终端里的 claude] -. 写状态文件 .-> CC A -. 写状态文件 .-> CC ``` 后端在 Electron 主进程内启动（也可 `npm start` 单独运行，此时 Electron 发现端口被占用就直接复用）。所有页面都通过 `http://127.0.0.1:8787` 访问后端。 ## 模块说明 | 模块 | 路径 | 职责 | 依赖 | |---|---|---|---| | 入口 | `server/index.js` | 定时刷新、组装状态、SSE 推送、REST API、终端 WebSocket、恢复阵容 | 全部 collectors、state、agents、roster | | 状态 | `server/state.js` | 部队 / 任务 / 事件 / 领航员台词；事件写 `comms.jsonl` | config | | 额度 | `server/collectors/usage.js` | 读令牌调用 usage / profile；限流退避；本地缓存 | — | | 会话 | `server/collectors/sessions.js` | 读 `~/.claude/sessions/*.json`，判断进程存活，合并 transcript、子 agent、授权通知 | transcript、notifications | | 会话记录 | `server/collectors/transcript.js` | 增量读取 `.jsonl`：负载、最后汇报 / 指令、编辑过的文件 | — | | git | `server/collectors/git.js` | 找仓库、`status --porcelain=v2 -z`、log、diff、stash | git 命令 | | 存档 | `server/collectors/history.js` | 扫描所有会话记录头尾，取 cwd / 标题 / 最后指令 | — | | 今日统计 | `server/collectors/today.js` | 增量读今天写过的会话记录（含子 agent）：token、缓存命中、指令数；每 30 秒随 git 刷新 | — | | 授权通知 | `server/collectors/notifications.js` | 增量读 hook 写的 `notifications.jsonl` | — | | 我方 agent | `server/agents.js` | node-pty 启动 `claude`，屏幕缓冲、输入、按 pid 绑定会话 | node-pty | | 阵容 | `server/roster.js` | 保存 / 读取 `roster.json`；判断孤儿进程 | PowerShell | | 桌面壳 | `desktop/main.cjs` | 小窗、指挥中心窗口、通知、菜单动作、退出确认 | Electron | | 指挥中心 | `web/app.js` | 渲染各页、分屏、总指令台、出击 | terminal.js、ui.js | ## 关键设计 - **只读外部状态**：从不刷新 OAuth 令牌，git 用 `GIT_OPTIONAL_LOCKS=0`，不给外部会话写入任何东西（D-001）。 - **授权提醒用 hook**：会话状态文件里没有「等待授权」状态，只能靠 Notification hook（D-002）。 - **指挥中心自己发起 agent**：外部程序无法向运行中的终端会话输入，所以可控制的 agent 必须由我们启动（D-003）。 - **我方 agent 按进程识别**：`/clear`、恢复会话都可能换会话 ID，进程不变（D-004）。 - **数据目录在 `~/.claude-ops`**：安装版程序目录只读；开发版与安装版共用（D-006）。 - **阵容随时保存、启动时恢复**：退出时冻结阵容不被清空，崩溃后靠「父进程已不存在」识别孤儿（见 I-003）。 - **只监听 127.0.0.1**，API 检查 `Origin`，WebSocket 同样校验；接管 / 恢复只接受自己扫描到的会话 ID。 "}, {"id": "flows", "file": "04-flows.md", "title": "核心流程", "empty": false, "updated": "2026-10-30 15:58", "html": "<h1 id=\"核心流程\">核心流程<\/h1>\n<h2 id=\"1-状态刷新与推送\">1. 状态刷新与推送<\/h2>\n<p>触发：定时器。会话每 3 秒，额度每 3 分钟，git 与存档每 30 秒。<\/p>\n<pre class=\"mermaid\">sequenceDiagram\n  participant T as 定时器\n  participant I as server/index.js\n  participant C as collectors\n  participant St as state.js\n  participant UI as 页面（SSE）\n  T-&gt;&gt;I: publish()（3s）\n  I-&gt;&gt;C: collectSessions()（状态文件 + transcript 增量 + 授权通知）\n  I-&gt;&gt;I: bindAgents()：按 pid 关联我方 agent，saveRoster()\n  I-&gt;&gt;St: buildState(sessions, git, usage)\n  St-&gt;&gt;St: 对比上一次 → 事件写 comms.jsonl\n  St--&gt;&gt;I: units / quests / operator / comms\n  I-&gt;&gt;I: 与上次 JSON 相同则不推\n  I--&gt;&gt;UI: data: {...}<\/pre>\n<p>异常分支：<\/p>\n<ul><li>额度接口 401 → 显示「登录过期，打开一次 Claude Code」；429 → 退避并显示缓存（I-001）。<\/li><li>会话状态文件存在但进程已不在 → 跳过（不显示）。<\/li><li>首次刷新不产生事件（避免启动时刷屏）。<\/li><\/ul>\n<h2 id=\"2-授权提醒\">2. 授权提醒<\/h2>\n<pre class=\"mermaid\">sequenceDiagram\n  participant CC as Claude Code 会话\n  participant H as ~/.claude-ops/hook.js\n  participant F as notifications.jsonl\n  participant S as 后端\n  participant W as 小窗 / 指挥中心\n  CC-&gt;&gt;H: Notification hook（permission_prompt，stdin JSON）\n  H-&gt;&gt;F: 追加 {at, sessionId, message}\n  S-&gt;&gt;F: 每 3s 增量读取\n  S-&gt;&gt;S: 该会话 transcript 在 at 之后没有新行 且 状态非 idle 且 &lt; 30 分钟 → 等授权\n  S--&gt;&gt;W: PERMIT 任务（最高优先级）+ Windows 通知\n  CC-&gt;&gt;CC: 用户批准 / 拒绝 → 写入工具结果\n  S-&gt;&gt;S: transcript 有新行 → 提醒自动消失<\/pre>\n<h2 id=\"3-出击-接管-下指令\">3. 出击 / 接管 / 下指令<\/h2>\n<pre class=\"mermaid\">sequenceDiagram\n  participant UI as 指挥中心\n  participant S as 后端\n  participant P as node-pty\n  participant C as claude\n  UI-&gt;&gt;S: POST /api/agents {cwd} 或 {resume}\n  S-&gt;&gt;S: resume 已被我方接管？→ 返回已有 agent（不再起第二个进程）\n  S-&gt;&gt;P: spawn claude --session-id/--resume [--name] --settings agent-settings.json（清掉继承的会话环境变量）\n  P-&gt;&gt;C: 启动\n  S--&gt;&gt;UI: {id}\n  UI-&gt;&gt;S: WebSocket /ws/agents/{id}\n  S--&gt;&gt;UI: 回放屏幕缓冲 + 实时输出\n  UI-&gt;&gt;S: 键盘输入 / 窗口大小\n  Note over UI,S: 总指令台：POST /api/agents/action {id:[...], action:\"text\"}&lt;br/&gt;后端以 bracketed paste 写入后回车<\/pre>\n<h2 id=\"4-恢复阵容\">4. 恢复阵容<\/h2>\n<pre class=\"mermaid\">flowchart TD\n  A[每次 publish] --&gt; B[saveRoster：我方存活 agent 的当前 sessionId / cwd / name]\n  Q[退出程序] --&gt; R[freezeRoster 后 killAll，名单不被清空]\n  S[启动 start] --&gt; L[loadRoster]\n  L --&gt; X{该会话还有进程在跑?}\n  X -- 否 --&gt; Y[resume 接管]\n  X -- 是，父进程已不在 --&gt; K[孤儿：结束它] --&gt; Y\n  X -- 是，父进程还在 --&gt; Z[正被外部终端使用：跳过]<\/pre>\n<h2 id=\"5-全军出击\">5. 全军出击<\/h2>\n<ol><li>存档按文件夹分组，按最近活动排序。<\/li><li>跳过主目录和 <code>AppData<\/code> 目录；每个文件夹取最新会话：我方 → 直接打开；外部运行中 → 跳过并顺延；否则 → 接管。<\/li><li>主题确认框列出要打开的 4 个，确认后收起现有分屏并依次打开。<\/li><\/ol>", "text": " ## 1. 状态刷新与推送 触发：定时器。会话每 3 秒，额度每 3 分钟，git 与存档每 30 秒。 ```mermaid sequenceDiagram participant T as 定时器 participant I as server/index.js participant C as collectors participant St as state.js participant UI as 页面（SSE） T->>I: publish()（3s） I->>C: collectSessions()（状态文件 + transcript 增量 + 授权通知） I->>I: bindAgents()：按 pid 关联我方 agent，saveRoster() I->>St: buildState(sessions, git, usage) St->>St: 对比上一次 → 事件写 comms.jsonl St-->>I: units / quests / operator / comms I->>I: 与上次 JSON 相同则不推 I-->>UI: data: {...} ``` 异常分支： - 额度接口 401 → 显示「登录过期，打开一次 Claude Code」；429 → 退避并显示缓存（I-001）。 - 会话状态文件存在但进程已不在 → 跳过（不显示）。 - 首次刷新不产生事件（避免启动时刷屏）。 ## 2. 授权提醒 ```mermaid sequenceDiagram participant CC as Claude Code 会话 participant H as ~/.claude-ops/hook.js participant F as notifications.jsonl participant S as 后端 participant W as 小窗 / 指挥中心 CC->>H: Notification hook（permission_prompt，stdin JSON） H->>F: 追加 {at, sessionId, message} S->>F: 每 3s 增量读取 S->>S: 该会话 transcript 在 at 之后没有新行 且 状态非 idle 且 < 30 分钟 → 等授权 S-->>W: PERMIT 任务（最高优先级）+ Windows 通知 CC->>CC: 用户批准 / 拒绝 → 写入工具结果 S->>S: transcript 有新行 → 提醒自动消失 ``` ## 3. 出击 / 接管 / 下指令 ```mermaid sequenceDiagram participant UI as 指挥中心 participant S as 后端 participant P as node-pty participant C as claude UI->>S: POST /api/agents {cwd} 或 {resume} S->>S: resume 已被我方接管？→ 返回已有 agent（不再起第二个进程） S->>P: spawn claude --session-id/--resume [--name] --settings agent-settings.json（清掉继承的会话环境变量） P->>C: 启动 S-->>UI: {id} UI->>S: WebSocket /ws/agents/{id} S-->>UI: 回放屏幕缓冲 + 实时输出 UI->>S: 键盘输入 / 窗口大小 Note over UI,S: 总指令台：POST /api/agents/action {id:[...], action:\"text\"}<br/>后端以 bracketed paste 写入后回车 ``` ## 4. 恢复阵容 ```mermaid flowchart TD A[每次 publish] --> B[saveRoster：我方存活 agent 的当前 sessionId / cwd / name] Q[退出程序] --> R[freezeRoster 后 killAll，名单不被清空] S[启动 start] --> L[loadRoster] L --> X{该会话还有进程在跑?} X -- 否 --> Y[resume 接管] X -- 是，父进程已不在 --> K[孤儿：结束它] --> Y X -- 是，父进程还在 --> Z[正被外部终端使用：跳过] ``` ## 5. 全军出击 1. 存档按文件夹分组，按最近活动排序。 2. 跳过主目录和 `AppData` 目录；每个文件夹取最新会话：我方 → 直接打开；外部运行中 → 跳过并顺延；否则 → 接管。 3. 主题确认框列出要打开的 4 个，确认后收起现有分屏并依次打开。 "}, {"id": "api", "file": "05-api.md", "title": "API 说明", "empty": false, "updated": "2026-10-30 16:54", "html": "<h1 id=\"api-说明\">API 说明<\/h1>\n<p>后端只监听 <code>127.0.0.1:8787<\/code>（<code>MONITOR_PORT<\/code> 可改）。带 <code>Origin<\/code> 头的请求必须来自同源页面，否则 403。<\/p>\n<h2 id=\"接口总览\">接口总览<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方法<\/th><th>路径<\/th><th>说明<\/th><th>鉴权<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td><code>/api/state<\/code><\/td><td>当前完整状态<\/td><td>同源<\/td><\/tr><tr><td>GET<\/td><td><code>/api/stream<\/code><\/td><td>SSE，状态变化时推送完整状态<\/td><td>同源<\/td><\/tr><tr><td>POST<\/td><td><code>/api/refresh<\/code><\/td><td>立即刷新额度（忽略退避）与 git<\/td><td>同源<\/td><\/tr><tr><td>POST<\/td><td><code>/api/focus<\/code><\/td><td>把外部会话的终端窗口切到前台<\/td><td>同源<\/td><\/tr><tr><td>POST<\/td><td><code>/api/resume<\/code><\/td><td>在 Windows Terminal 里 <code>claude --resume<\/code><\/td><td>同源<\/td><\/tr><tr><td>POST<\/td><td><code>/api/snooze<\/code><\/td><td>某任务稍后提醒<\/td><td>同源<\/td><\/tr><tr><td>POST<\/td><td><code>/api/agents<\/code><\/td><td>出击 / 接管我方 agent<\/td><td>同源<\/td><\/tr><tr><td>POST<\/td><td><code>/api/agents/action<\/code><\/td><td>给一个或多个我方 agent 发指令、按键、结束、移除<\/td><td>同源<\/td><\/tr><tr><td>WS<\/td><td><code>/ws/agents/{id}<\/code><\/td><td>我方 agent 的终端通道<\/td><td>同源<\/td><\/tr><tr><td>GET<\/td><td><code>/<\/code>、<code>/widget<\/code>、<code>/term<\/code><\/td><td>指挥中心、战况小窗、弹出终端页面<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"post-api-agents\">POST /api/agents<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>参数<\/th><th>类型<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><code>cwd<\/code><\/td><td>string<\/td><td>新会话的文件夹（必须存在）<\/td><\/tr><tr><td><code>name<\/code><\/td><td>string?<\/td><td>呼号（会话名，<code>--name<\/code>）<\/td><\/tr><tr><td><code>prompt<\/code><\/td><td>string?<\/td><td>启动后自动发送的首个指令<\/td><\/tr><tr><td><code>resume<\/code><\/td><td>string?<\/td><td>接管的会话 ID，必须来自后端自己扫描的存档；给了 <code>resume<\/code> 就忽略 <code>cwd<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>返回 <code>{ ok: true, id }<\/code>。错误：<code>400 {error}<\/code>（文件夹不存在、未知会话、终端组件不可用），<code>409<\/code>（该会话正在外部终端运行）。<\/p>\n<h2 id=\"post-api-agents-action\">POST /api/agents/action<\/h2>\n<pre><code class=\"lang-json\">{ \"id\": [\"&lt;agentId&gt;\", \"...\"], \"action\": \"text\", \"text\": \"跑一下测试\" }<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>action<\/th><th>额外参数<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td><code>text<\/code><\/td><td><code>text<\/code><\/td><td>以 bracketed paste 输入后回车<\/td><\/tr><tr><td><code>key<\/code><\/td><td><code>key<\/code>: <code>esc<\/code> / <code>ctrl-c<\/code> / <code>enter<\/code><\/td><td>发送按键<\/td><\/tr><tr><td><code>kill<\/code><\/td><td>—<\/td><td>结束进程<\/td><\/tr><tr><td><code>remove<\/code><\/td><td>—<\/td><td>从列表移除已退出的 agent<\/td><\/tr><\/tbody><\/table><\/div>\n<p>返回 <code>{ ok, results: [bool...] }<\/code>（与 <code>id<\/code> 顺序对应）。<\/p>\n<h2 id=\"ws-ws-agents-id\">WS /ws/agents/{id}<\/h2>\n<ul><li>服务端 → 客户端：原始终端输出（字符串）；连接时先回放最多 512KB 屏幕缓冲。<\/li><li>客户端 → 服务端：<code>{&quot;type&quot;:&quot;input&quot;,&quot;data&quot;:&quot;...&quot;}<\/code>、<code>{&quot;type&quot;:&quot;resize&quot;,&quot;cols&quot;:120,&quot;rows&quot;:32}<\/code>。<\/li><\/ul>\n<h2 id=\"get-api-state-主要字段\">GET /api/state 主要字段<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>字段<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><code>usage<\/code><\/td><td><code>{ ok, error, fetchedAt, retryAt, limits:[{key,label,usedPct,resetsAt,active}], account }<\/code><\/td><\/tr><tr><td><code>units[]<\/code><\/td><td>运行中的会话：<code>pid, sessionId, project, cwd, status, permission, contextPct, contextTokens, agents[], repos[], owned, agentId<\/code><\/td><\/tr><tr><td><code>units[].repos[]<\/code><\/td><td><code>name, path, branch, upstream, ahead, behind, changedCount, …, remote: {name, host, slug, web}, remotes[]<\/code>（不含原始 URL）<\/td><\/tr><tr><td><code>quests[]<\/code><\/td><td>任务：<code>key, kind, lv, title, goal, since, unit<\/code><\/td><\/tr><tr><td><code>comms[]<\/code><\/td><td>最近 60 条事件<\/td><\/tr><tr><td><code>operator<\/code><\/td><td>领航员 <code>mood<\/code> 与 <code>lines[]<\/code><\/td><\/tr><tr><td><code>history[]<\/code><\/td><td>存档会话：<code>sessionId, cwd, project, title, lastPrompt, updatedAt, pid, owned, agentId<\/code><\/td><\/tr><tr><td><code>agents[]<\/code><\/td><td>我方 agent：<code>id, sessionId, pid, name, cwd, alive, exitCode, startedAt<\/code><\/td><\/tr><tr><td><code>agentSupport<\/code><\/td><td><code>{ ok, error }<\/code>：node-pty 与 <code>claude<\/code> 是否可用<\/td><\/tr><tr><td><code>thresholds<\/code><\/td><td>阈值配置<\/td><\/tr><\/tbody><\/table><\/div>", "text": " 后端只监听 `127.0.0.1:8787`（`MONITOR_PORT` 可改）。带 `Origin` 头的请求必须来自同源页面，否则 403。 ## 接口总览 | 方法 | 路径 | 说明 | 鉴权 | |---|---|---|---| | GET | `/api/state` | 当前完整状态 | 同源 | | GET | `/api/stream` | SSE，状态变化时推送完整状态 | 同源 | | POST | `/api/refresh` | 立即刷新额度（忽略退避）与 git | 同源 | | POST | `/api/focus` | 把外部会话的终端窗口切到前台 | 同源 | | POST | `/api/resume` | 在 Windows Terminal 里 `claude --resume` | 同源 | | POST | `/api/snooze` | 某任务稍后提醒 | 同源 | | POST | `/api/agents` | 出击 / 接管我方 agent | 同源 | | POST | `/api/agents/action` | 给一个或多个我方 agent 发指令、按键、结束、移除 | 同源 | | WS | `/ws/agents/{id}` | 我方 agent 的终端通道 | 同源 | | GET | `/`、`/widget`、`/term` | 指挥中心、战况小窗、弹出终端页面 | — | ## POST /api/agents | 参数 | 类型 | 说明 | |---|---|---| | `cwd` | string | 新会话的文件夹（必须存在） | | `name` | string? | 呼号（会话名，`--name`） | | `prompt` | string? | 启动后自动发送的首个指令 | | `resume` | string? | 接管的会话 ID，必须来自后端自己扫描的存档；给了 `resume` 就忽略 `cwd` | 返回 `{ ok: true, id }`。错误：`400 {error}`（文件夹不存在、未知会话、终端组件不可用），`409`（该会话正在外部终端运行）。 ## POST /api/agents/action ```json { \"id\": [\"<agentId>\", \"...\"], \"action\": \"text\", \"text\": \"跑一下测试\" } ``` | action | 额外参数 | 作用 | |---|---|---| | `text` | `text` | 以 bracketed paste 输入后回车 | | `key` | `key`: `esc` / `ctrl-c` / `enter` | 发送按键 | | `kill` | — | 结束进程 | | `remove` | — | 从列表移除已退出的 agent | 返回 `{ ok, results: [bool...] }`（与 `id` 顺序对应）。 ## WS /ws/agents/{id} - 服务端 → 客户端：原始终端输出（字符串）；连接时先回放最多 512KB 屏幕缓冲。 - 客户端 → 服务端：`{\"type\":\"input\",\"data\":\"...\"}`、`{\"type\":\"resize\",\"cols\":120,\"rows\":32}`。 ## GET /api/state 主要字段 | 字段 | 说明 | |---|---| | `usage` | `{ ok, error, fetchedAt, retryAt, limits:[{key,label,usedPct,resetsAt,active}], account }` | | `units[]` | 运行中的会话：`pid, sessionId, project, cwd, status, permission, contextPct, contextTokens, agents[], repos[], owned, agentId` | | `units[].repos[]` | `name, path, branch, upstream, ahead, behind, changedCount, …, remote: {name, host, slug, web}, remotes[]`（不含原始 URL） | | `quests[]` | 任务：`key, kind, lv, title, goal, since, unit` | | `comms[]` | 最近 60 条事件 | | `operator` | 领航员 `mood` 与 `lines[]` | | `history[]` | 存档会话：`sessionId, cwd, project, title, lastPrompt, updatedAt, pid, owned, agentId` | | `agents[]` | 我方 agent：`id, sessionId, pid, name, cwd, alive, exitCode, startedAt` | | `agentSupport` | `{ ok, error }`：node-pty 与 `claude` 是否可用 | | `thresholds` | 阈值配置 | "}, {"id": "data", "file": "06-data.md", "title": "数据模型", "empty": false, "updated": "2026-10-30 16:06", "html": "<h1 id=\"数据模型\">数据模型<\/h1>\n<h2 id=\"读取的外部数据-只读\">读取的外部数据（只读）<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>来源<\/th><th>路径<\/th><th>用到的内容<\/th><\/tr><\/thead><tbody><tr><td>会话状态文件<\/td><td><code>~/.claude/sessions/&lt;pid&gt;.json<\/code><\/td><td><code>pid, sessionId, cwd, name, status(busy/idle), statusUpdatedAt, startedAt<\/code><\/td><\/tr><tr><td>会话记录<\/td><td><code>~/.claude/projects/&lt;cwd 编码&gt;/&lt;sessionId&gt;.jsonl<\/code><\/td><td>assistant <code>usage<\/code>（负载）、<code>model<\/code>、文本、Edit/Write 的 <code>file_path<\/code>、<code>ai-title<\/code>、<code>last-prompt<\/code><\/td><\/tr><tr><td>子 agent<\/td><td><code>&lt;sessionId&gt;/subagents/*.meta.json<\/code><\/td><td><code>agentType, description, finished<\/code><\/td><\/tr><tr><td>令牌<\/td><td><code>~/.claude/.credentials.json<\/code><\/td><td><code>claudeAiOauth.accessToken<\/code>、<code>rateLimitTier<\/code>（只读，不刷新）<\/td><\/tr><tr><td>额度接口<\/td><td><code>GET /api/oauth/usage<\/code><\/td><td><code>limits[]<\/code>（<code>kind, percent, resets_at, scope.model, is_active<\/code>）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>cwd 编码<\/code>：把路径里所有非字母数字字符换成 <code>-<\/code>，例如 <code>D:\\work\\my-app<\/code> → <code>D--work-my-app<\/code>。<\/p>\n<p>记忆负载 = <code>input_tokens + cache_read_input_tokens + cache_creation_input_tokens<\/code>，跳过 <code>model = &lt;synthetic&gt;<\/code> 的占位消息（I-008）与 <code>isSidechain<\/code> 消息。<\/p>\n<h2 id=\"程序自己的数据-claude-ops\">程序自己的数据：<code>~/.claude-ops/<\/code><\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>文件<\/th><th>格式<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><code>comms.jsonl<\/code><\/td><td>每行 <code>{t, kind, msg, unit}<\/code><\/td><td>通讯记录（保留最近 200 条）<\/td><\/tr><tr><td><code>usage-cache.json<\/code><\/td><td>JSON<\/td><td>最后一次成功的额度数据 + <code>retryAt<\/code> / <code>backoffMs<\/code><\/td><\/tr><tr><td><code>notifications.jsonl<\/code><\/td><td>每行 <code>{at, sessionId, cwd, type, message}<\/code><\/td><td>授权 hook 写入<\/td><\/tr><tr><td><code>roster.json<\/code><\/td><td><code>[{sessionId, cwd, name}]<\/code><\/td><td>我方阵容（每个会话一条）<\/td><\/tr><tr><td><code>hook.js<\/code><\/td><td>脚本<\/td><td>程序启动时从 <code>server/hook.js<\/code> 复制过来<\/td><\/tr><tr><td><code>agent-settings.json<\/code><\/td><td>JSON<\/td><td>我方 agent 的 <code>--settings<\/code>（关掉状态栏）<\/td><\/tr><tr><td><code>config.json<\/code><\/td><td>JSON（可选）<\/td><td>覆盖默认配置<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Electron 自己的窗口偏好（小窗位置、静音）在 <code>%APPDATA%/&lt;应用名&gt;/widget.json<\/code>。<\/p>\n<h2 id=\"核心对象关系\">核心对象关系<\/h2>\n<pre class=\"mermaid\">erDiagram\n  SESSION ||--o| AGENT : \"被我方接管(按 pid)\"\n  SESSION ||--o{ REPO : \"cwd 下 2 层内\"\n  SESSION ||--o{ SUBAGENT : \"派出\"\n  SESSION ||--o{ QUEST : \"产生\"\n  AGENT }o--|| ROSTER_ENTRY : \"保存为\"\n  SESSION {\n    int pid\n    string sessionId\n    string cwd\n    string status\n  }\n  AGENT {\n    string id \"首次启动时的会话 ID，终端通道用它\"\n    string sessionId \"当前会话 ID（/clear 后会变）\"\n    int pid\n  }<\/pre>", "text": " ## 读取的外部数据（只读） | 来源 | 路径 | 用到的内容 | |---|---|---| | 会话状态文件 | `~/.claude/sessions/<pid>.json` | `pid, sessionId, cwd, name, status(busy/idle), statusUpdatedAt, startedAt` | | 会话记录 | `~/.claude/projects/<cwd 编码>/<sessionId>.jsonl` | assistant `usage`（负载）、`model`、文本、Edit/Write 的 `file_path`、`ai-title`、`last-prompt` | | 子 agent | `<sessionId>/subagents/*.meta.json` | `agentType, description, finished` | | 令牌 | `~/.claude/.credentials.json` | `claudeAiOauth.accessToken`、`rateLimitTier`（只读，不刷新） | | 额度接口 | `GET /api/oauth/usage` | `limits[]`（`kind, percent, resets_at, scope.model, is_active`） | `cwd 编码`：把路径里所有非字母数字字符换成 `-`，例如 `D:\\work\\my-app` → `D--work-my-app`。 记忆负载 = `input_tokens + cache_read_input_tokens + cache_creation_input_tokens`，跳过 `model = <synthetic>` 的占位消息（I-008）与 `isSidechain` 消息。 ## 程序自己的数据：`~/.claude-ops/` | 文件 | 格式 | 内容 | |---|---|---| | `comms.jsonl` | 每行 `{t, kind, msg, unit}` | 通讯记录（保留最近 200 条） | | `usage-cache.json` | JSON | 最后一次成功的额度数据 + `retryAt` / `backoffMs` | | `notifications.jsonl` | 每行 `{at, sessionId, cwd, type, message}` | 授权 hook 写入 | | `roster.json` | `[{sessionId, cwd, name}]` | 我方阵容（每个会话一条） | | `hook.js` | 脚本 | 程序启动时从 `server/hook.js` 复制过来 | | `agent-settings.json` | JSON | 我方 agent 的 `--settings`（关掉状态栏） | | `config.json` | JSON（可选） | 覆盖默认配置 | Electron 自己的窗口偏好（小窗位置、静音）在 `%APPDATA%/<应用名>/widget.json`。 ## 核心对象关系 ```mermaid erDiagram SESSION ||--o| AGENT : \"被我方接管(按 pid)\" SESSION ||--o{ REPO : \"cwd 下 2 层内\" SESSION ||--o{ SUBAGENT : \"派出\" SESSION ||--o{ QUEST : \"产生\" AGENT }o--|| ROSTER_ENTRY : \"保存为\" SESSION { int pid string sessionId string cwd string status } AGENT { string id \"首次启动时的会话 ID，终端通道用它\" string sessionId \"当前会话 ID（/clear 后会变）\" int pid } ``` "}, {"id": "config-deploy", "file": "07-config-deploy.md", "title": "配置与部署", "empty": false, "updated": "2026-10-30 16:06", "html": "<h1 id=\"配置与部署\">配置与部署<\/h1>\n<h2 id=\"配置项\">配置项<\/h2>\n<p><code>~/.claude-ops/config.json<\/code>（或项目根目录 <code>config.json<\/code>）覆盖 <code>server/config.js<\/code> 里的默认值：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>名称<\/th><th>默认值<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><code>port<\/code><\/td><td><code>8787<\/code><\/td><td>也可用环境变量 <code>MONITOR_PORT<\/code><\/td><\/tr><tr><td><code>intervals.usage<\/code><\/td><td><code>180000<\/code><\/td><td>额度刷新间隔（ms）。接口与状态栏共享限流，不要调太低<\/td><\/tr><tr><td><code>intervals.sessions<\/code><\/td><td><code>3000<\/code><\/td><td>会话刷新与推送<\/td><\/tr><tr><td><code>intervals.git<\/code><\/td><td><code>30000<\/code><\/td><td>git 与存档扫描<\/td><\/tr><tr><td><code>contextWindows<\/code><\/td><td>opus-5 → 1M，其余 200K<\/td><td>按模型 id 推断窗口大小<\/td><\/tr><tr><td><code>thresholds.contextWarnPct<\/code><\/td><td><code>85<\/code><\/td><td>负载告警<\/td><\/tr><tr><td><code>thresholds.energyLowPct<\/code><\/td><td><code>10<\/code><\/td><td>额度剩余告警<\/td><\/tr><tr><td><code>thresholds.staleDirtyDays<\/code><\/td><td><code>3<\/code><\/td><td>未提交改动搁置天数<\/td><\/tr><tr><td><code>thresholds.standbyMinutes<\/code><\/td><td><code>30<\/code><\/td><td>待命多久算休眠<\/td><\/tr><tr><td><code>git.scanDepth<\/code><\/td><td><code>2<\/code><\/td><td>会话目录下找仓库的深度<\/td><\/tr><tr><td><code>git.autoFetch<\/code><\/td><td><code>false<\/code><\/td><td>是否自动 fetch（默认不联网，见 T-002）<\/td><\/tr><tr><td><code>operator.name<\/code><\/td><td><code>NOVA<\/code><\/td><td>领航员名字<\/td><\/tr><\/tbody><\/table><\/div>\n<p>环境变量：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>变量<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td><code>MONITOR_PORT<\/code><\/td><td>端口<\/td><\/tr><tr><td><code>MONITOR_DATA_DIR<\/code><\/td><td>数据目录（默认 <code>~/.claude-ops<\/code>），测试版隔离时用<\/td><\/tr><tr><td><code>MONITOR_DEMO<\/code><\/td><td><code>1<\/code> 假会话；<code>empty<\/code> 无会话（预览存档）<\/td><\/tr><tr><td><code>CLAUDE_CONFIG_DIR<\/code><\/td><td>Claude 配置目录（默认 <code>~/.claude<\/code>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"授权提醒-hook\">授权提醒 hook<\/h2>\n<p><code>~/.claude/settings.json<\/code> 中：<\/p>\n<pre><code class=\"lang-json\">\"hooks\": { \"Notification\": [ { \"matcher\": \"permission_prompt\", \"hooks\": [ {\n  \"type\": \"command\",\n  \"command\": \"C:/path/to/node.exe\",\n  \"args\": [\"C:/Users/&lt;你&gt;/.claude-ops/hook.js\"],\n  \"async\": true, \"timeout\": 10 } ] } ] }<\/code><\/pre>\n<p>已打开的会话要执行一次 <code>/hooks<\/code> 或重启才会加载。hook 依赖本机 Node 路径（T-004）。<\/p>\n<h2 id=\"部署-打包安装程序\">部署（打包安装程序）<\/h2>\n<pre><code class=\"lang-bash\">npm run dist     # 输出到 dist/FleetBridge-Setup-&lt;version&gt;.exe<\/code><\/pre>\n<ul><li>electron-builder NSIS，按用户安装（无需管理员），可选安装目录，建桌面 / 开始菜单快捷方式。<\/li><li><code>node_modules/@lydell/**<\/code>（node-pty 原生模块与 ConPTY）通过 <code>asarUnpack<\/code> 放在 asar 外。<\/li><li>没有代码签名，首次运行会有 SmartScreen 提示（T-005）。<\/li><li><strong>D 盘只有 15GB<\/strong>，一次打包临时占约 500MB；出新版后删掉旧安装包（I-004）。<\/li><\/ul>\n<p>升级时安装程序会关闭正在运行的版本：我方 agent 被结束，新版本启动后按 <code>roster.json<\/code> 自动恢复。<\/p>\n<h2 id=\"测试版与安装版同时运行\">测试版与安装版同时运行<\/h2>\n<p>开发版要和安装版隔离，避免抢端口与单实例锁：<\/p>\n<pre><code class=\"lang-bash\">MONITOR_PORT=8790 MONITOR_DATA_DIR=&lt;临时目录&gt; npx electron . --user-data-dir=&lt;临时目录&gt;<\/code><\/pre>", "text": " ## 配置项 `~/.claude-ops/config.json`（或项目根目录 `config.json`）覆盖 `server/config.js` 里的默认值： | 名称 | 默认值 | 说明 | |---|---|---| | `port` | `8787` | 也可用环境变量 `MONITOR_PORT` | | `intervals.usage` | `180000` | 额度刷新间隔（ms）。接口与状态栏共享限流，不要调太低 | | `intervals.sessions` | `3000` | 会话刷新与推送 | | `intervals.git` | `30000` | git 与存档扫描 | | `contextWindows` | opus-5 → 1M，其余 200K | 按模型 id 推断窗口大小 | | `thresholds.contextWarnPct` | `85` | 负载告警 | | `thresholds.energyLowPct` | `10` | 额度剩余告警 | | `thresholds.staleDirtyDays` | `3` | 未提交改动搁置天数 | | `thresholds.standbyMinutes` | `30` | 待命多久算休眠 | | `git.scanDepth` | `2` | 会话目录下找仓库的深度 | | `git.autoFetch` | `false` | 是否自动 fetch（默认不联网，见 T-002） | | `operator.name` | `NOVA` | 领航员名字 | 环境变量： | 变量 | 作用 | |---|---| | `MONITOR_PORT` | 端口 | | `MONITOR_DATA_DIR` | 数据目录（默认 `~/.claude-ops`），测试版隔离时用 | | `MONITOR_DEMO` | `1` 假会话；`empty` 无会话（预览存档） | | `CLAUDE_CONFIG_DIR` | Claude 配置目录（默认 `~/.claude`） | ## 授权提醒 hook `~/.claude/settings.json` 中： ```json \"hooks\": { \"Notification\": [ { \"matcher\": \"permission_prompt\", \"hooks\": [ { \"type\": \"command\", \"command\": \"C:/path/to/node.exe\", \"args\": [\"C:/Users/<你>/.claude-ops/hook.js\"], \"async\": true, \"timeout\": 10 } ] } ] } ``` 已打开的会话要执行一次 `/hooks` 或重启才会加载。hook 依赖本机 Node 路径（T-004）。 ## 部署（打包安装程序） ```bash npm run dist # 输出到 dist/FleetBridge-Setup-<version>.exe ``` - electron-builder NSIS，按用户安装（无需管理员），可选安装目录，建桌面 / 开始菜单快捷方式。 - `node_modules/@lydell/**`（node-pty 原生模块与 ConPTY）通过 `asarUnpack` 放在 asar 外。 - 没有代码签名，首次运行会有 SmartScreen 提示（T-005）。 - **D 盘只有 15GB**，一次打包临时占约 500MB；出新版后删掉旧安装包（I-004）。 升级时安装程序会关闭正在运行的版本：我方 agent 被结束，新版本启动后按 `roster.json` 自动恢复。 ## 测试版与安装版同时运行 开发版要和安装版隔离，避免抢端口与单实例锁： ```bash MONITOR_PORT=8790 MONITOR_DATA_DIR=<临时目录> npx electron . --user-data-dir=<临时目录> ``` "}, {"id": "dev-guide", "file": "08-dev-guide.md", "title": "开发约定", "empty": false, "updated": "2026-11-01 17:39", "html": "<h1 id=\"开发约定\">开发约定<\/h1>\n<h2 id=\"代码风格\">代码风格<\/h2>\n<ul><li>后端 ESM，无框架；前端原生模块，无构建步骤。改完前端刷新页面（<code>Ctrl+R<\/code>）即可生效，改 <code>server/<\/code> 或 <code>desktop/<\/code> 要重启程序。<\/li><li>注释写「为什么」，不写「做了什么」；用户可见文字在代码里写中文，前端用 <code>L()<\/code> 包起来并在 <code>web/i18n.js<\/code> 的 <code>EN<\/code>、<code>JA<\/code> 词典里补译文，后端用 <code>L(中文, English, 日本語)<\/code>。<\/li><li>页面样式统一用 <code>web/style.css<\/code> 里的 CSS 变量；<strong>不要用浏览器默认控件外观<\/strong>：确认框用 <code>web/ui.js<\/code> 的 <code>ask()<\/code>，不用 <code>confirm()<\/code>；滚动条、菜单都已主题化。<\/li><li>状态推送是完整 JSON，前端每次重绘；会打断交互的部分（总指令台消息框、分屏顶栏）只在内容变化时重建。<\/li><\/ul>\n<h2 id=\"调试\">调试<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>命令<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td><code>npm run probe<\/code><\/td><td>命令行打印一次采集结果（额度、会话、git、任务）<\/td><\/tr><tr><td><code>npm run demo<\/code><\/td><td>假会话 + 真实 git，端口 8788<\/td><\/tr><tr><td><code>MONITOR_DEMO=empty<\/code><\/td><td>无会话，预览存档 / 空状态<\/td><\/tr><tr><td><code>http://127.0.0.1:8787/#quests<\/code><\/td><td>直接打开某个标签；<code>#term=&lt;agentId&gt;<\/code> 打开某个终端<\/td><\/tr><\/tbody><\/table><\/div>\n<p>桌面版本地验证：开发版用独立的配置目录（<code>%APPDATA%/fleet-bridge-dev<\/code>），可以和安装版同时运行，配合 <code>MONITOR_PORT=8790 MONITOR_DATA_DIR=&lt;测试目录&gt; npx electron . --remote-debugging-port=9333<\/code>，再用 DevTools 协议对窗口截图（<code>Page.captureScreenshot<\/code>）。不要动安装版进程。<\/p>\n<p>截图检查界面：<code>chrome --headless=new --screenshot ... --timeout=8000<\/code>（页面有 SSE 长连接，用 <code>--timeout<\/code> 而不是 <code>--virtual-time-budget<\/code>）。<\/p>\n<h2 id=\"容易踩的坑\">容易踩的坑<\/h2>\n<ul><li><strong>重启开发版会结束我方 agent<\/strong>：先确认阵容已保存（<code>~/.claude-ops/roster.json<\/code>），或用隔离端口跑测试版。正在用的安装版里可能跑着当前对话本身，<strong>不要结束安装版进程<\/strong>。<\/li><li>**在 Claude 会话里启动的程序会继承 <code>CLAUDE_CODE_*<\/code> 环境变量**，子 <code>claude<\/code> 会当自己是嵌套会话（I-002）。<code>agents.js<\/code> 已清理。<\/li><li><strong>强制结束 Electron 会留下孤儿 claude 进程<\/strong>：正常退出走 <code>before-quit → shutdown()<\/code>；崩溃靠下次启动清理（I-003）。<\/li><li><strong>额度接口限流<\/strong>：频繁重启会触发 429，退避状态已持久化（I-001）。<\/li><li>Windows 上 bash heredoc 会吞掉 <code>\\\\<\/code>，测试 JSON 里的路径用正斜杠。<\/li><li><code>git status<\/code> 必须带 <code>GIT_OPTIONAL_LOCKS=0<\/code>，否则可能和用户的 git 操作抢 index 锁。<\/li><\/ul>\n<h2 id=\"打包体积\">打包体积<\/h2>\n<ul><li><code>electronLanguages<\/code> 只保留 zh-CN / en-US / ja 三个 Chromium 语言包（原来 55 个，约 47 MB）。<\/li><li><code>files<\/code> 里排除依赖的 <code>*.map<\/code>、<code>*.d.ts<\/code>、<code>src/<\/code> 等运行用不到的文件（app.asar 8.2 MB → 1.5 MB）。<\/li><li>Electron 本体（exe 238 MB、显卡相关 dll）无法再减。<\/li><\/ul>", "text": " ## 代码风格 - 后端 ESM，无框架；前端原生模块，无构建步骤。改完前端刷新页面（`Ctrl+R`）即可生效，改 `server/` 或 `desktop/` 要重启程序。 - 注释写「为什么」，不写「做了什么」；用户可见文字在代码里写中文，前端用 `L()` 包起来并在 `web/i18n.js` 的 `EN`、`JA` 词典里补译文，后端用 `L(中文, English, 日本語)`。 - 页面样式统一用 `web/style.css` 里的 CSS 变量；**不要用浏览器默认控件外观**：确认框用 `web/ui.js` 的 `ask()`，不用 `confirm()`；滚动条、菜单都已主题化。 - 状态推送是完整 JSON，前端每次重绘；会打断交互的部分（总指令台消息框、分屏顶栏）只在内容变化时重建。 ## 调试 | 命令 | 用途 | |---|---| | `npm run probe` | 命令行打印一次采集结果（额度、会话、git、任务） | | `npm run demo` | 假会话 + 真实 git，端口 8788 | | `MONITOR_DEMO=empty` | 无会话，预览存档 / 空状态 | | `http://127.0.0.1:8787/#quests` | 直接打开某个标签；`#term=<agentId>` 打开某个终端 | 桌面版本地验证：开发版用独立的配置目录（`%APPDATA%/fleet-bridge-dev`），可以和安装版同时运行，配合 `MONITOR_PORT=8790 MONITOR_DATA_DIR=<测试目录> npx electron . --remote-debugging-port=9333`，再用 DevTools 协议对窗口截图（`Page.captureScreenshot`）。不要动安装版进程。 截图检查界面：`chrome --headless=new --screenshot ... --timeout=8000`（页面有 SSE 长连接，用 `--timeout` 而不是 `--virtual-time-budget`）。 ## 容易踩的坑 - **重启开发版会结束我方 agent**：先确认阵容已保存（`~/.claude-ops/roster.json`），或用隔离端口跑测试版。正在用的安装版里可能跑着当前对话本身，**不要结束安装版进程**。 - **在 Claude 会话里启动的程序会继承 `CLAUDE_CODE_*` 环境变量**，子 `claude` 会当自己是嵌套会话（I-002）。`agents.js` 已清理。 - **强制结束 Electron 会留下孤儿 claude 进程**：正常退出走 `before-quit → shutdown()`；崩溃靠下次启动清理（I-003）。 - **额度接口限流**：频繁重启会触发 429，退避状态已持久化（I-001）。 - Windows 上 bash heredoc 会吞掉 `\\\\`，测试 JSON 里的路径用正斜杠。 - `git status` 必须带 `GIT_OPTIONAL_LOCKS=0`，否则可能和用户的 git 操作抢 index 锁。 ## 打包体积 - `electronLanguages` 只保留 zh-CN / en-US / ja 三个 Chromium 语言包（原来 55 个，约 47 MB）。 - `files` 里排除依赖的 `*.map`、`*.d.ts`、`src/` 等运行用不到的文件（app.asar 8.2 MB → 1.5 MB）。 - Electron 本体（exe 238 MB、显卡相关 dll）无法再减。 "}], "entries": [{"id": "D-001", "type": "decision", "title": "额度用 OAuth usage 接口，会话用本地状态文件", "summary": "额度只有官方接口有；会话、负载、子 agent 全部来自 ~/.claude 下的本地文件", "detail": "**问题**：额度、重置时间、各会话状态从哪里拿，才能准确又不打扰 Claude Code。\n**候选方案**：\n- 解析 `/usage` 输出：要交互，不可行\n- 状态栏输入里的 `rate_limits`：准确，但只有挂了状态栏的会话才有，且只到 5h/周两项\n- `api/oauth/usage`：包含全部 limits（含按模型的周额度），但非公开接口、有限流\n**结论**：额度用 `api/oauth/usage`（只读令牌、不刷新）；会话用 `~/.claude/sessions/*.json` + transcript 增量读取；git 用只读命令。\n**理由**：与 `/usage` 和状态栏交叉验证一致；本地文件零网络开销。限流问题用退避 + 缓存解决（I-001）。", "status": "accepted", "files": ["server/collectors/usage.js", "server/collectors/sessions.js", "server/collectors/transcript.js"], "tags": ["额度", "会话"], "sections": ["architecture", "data"], "refs": [], "created": "2026-10-30 10:30", "updated": "2026-10-30 10:30", "notes": [], "detail_html": "<p><strong>问题<\/strong>：额度、重置时间、各会话状态从哪里拿，才能准确又不打扰 Claude Code。<br><strong>候选方案<\/strong>：<\/p>\n<ul><li>解析 <code>/usage<\/code> 输出：要交互，不可行<\/li><li>状态栏输入里的 <code>rate_limits<\/code>：准确，但只有挂了状态栏的会话才有，且只到 5h/周两项<\/li><li><code>api/oauth/usage<\/code>：包含全部 limits（含按模型的周额度），但非公开接口、有限流<\/li><\/ul>\n<p><strong>结论<\/strong>：额度用 <code>api/oauth/usage<\/code>（只读令牌、不刷新）；会话用 <code>~/.claude/sessions/*.json<\/code> + transcript 增量读取；git 用只读命令。<br><strong>理由<\/strong>：与 <code>/usage<\/code> 和状态栏交叉验证一致；本地文件零网络开销。限流问题用退避 + 缓存解决（I-001）。<\/p>", "notes_html": []}, {"id": "D-002", "type": "decision", "title": "授权提醒用 Notification hook 写本地文件", "summary": "状态文件没有「等待授权」状态，只能靠 permission_prompt hook", "detail": "**问题**：会话卡在权限确认上时要提醒，但 `sessions/*.json` 只有 busy/idle。\n**候选方案**：HTTP hook 直接推后端（后端没开时丢失）；hook 写文件，后端增量读（后端没开也不丢）。\n**结论**：全局 `~/.claude/settings.json` 加 Notification(permission_prompt) hook，脚本 `~/.claude-ops/hook.js` 追加 `notifications.jsonl`；后端判断 transcript 在通知之后有没有新行来决定是否仍在等待。\n**理由**：不依赖后端在线；hook 异步执行、出错静默，不影响 Claude Code。", "status": "accepted", "files": ["server/hook.js", "server/collectors/notifications.js"], "tags": ["授权", "hook"], "sections": ["flows", "config-deploy"], "refs": [], "created": "2026-10-30 12:20", "updated": "2026-10-30 12:20", "notes": [], "detail_html": "<p><strong>问题<\/strong>：会话卡在权限确认上时要提醒，但 <code>sessions/*.json<\/code> 只有 busy/idle。<br><strong>候选方案<\/strong>：HTTP hook 直接推后端（后端没开时丢失）；hook 写文件，后端增量读（后端没开也不丢）。<br><strong>结论<\/strong>：全局 <code>~/.claude/settings.json<\/code> 加 Notification(permission_prompt) hook，脚本 <code>~/.claude-ops/hook.js<\/code> 追加 <code>notifications.jsonl<\/code>；后端判断 transcript 在通知之后有没有新行来决定是否仍在等待。<br><strong>理由<\/strong>：不依赖后端在线；hook 异步执行、出错静默，不影响 Claude Code。<\/p>", "notes_html": []}, {"id": "D-003", "type": "decision", "title": "可控制的 agent 由指挥中心用 PTY 发起", "summary": "外部程序无法向运行中的终端会话输入；由我们启动真实的交互式 claude 才能完整控制", "detail": "**问题**：用户要从指挥中心给会话下指令。\n**候选方案**：\n- 会话间收件箱（messagingSocketPath）：消息被当作「其他会话发来」，可能需审批，格式无文档\n- Agent SDK / `claude -p`：可控但不是交互式界面\n- node-pty + xterm.js 跑真实 `claude`：完整交互式体验，输入就是键盘输入\n**结论**：采用 PTY 方案；外部终端里的会话只监控、「跳过去」。\n**理由**：官方支持的交互式 CLI，授权确认等都在内嵌终端里原样操作。代价：agent 寿命跟随程序（用恢复阵容弥补）。", "status": "accepted", "files": ["server/agents.js", "web/terminal.js"], "tags": ["agent", "终端"], "sections": ["architecture", "features"], "refs": [], "created": "2026-10-30 13:20", "updated": "2026-10-30 13:20", "notes": [], "detail_html": "<p><strong>问题<\/strong>：用户要从指挥中心给会话下指令。<br><strong>候选方案<\/strong>：<\/p>\n<ul><li>会话间收件箱（messagingSocketPath）：消息被当作「其他会话发来」，可能需审批，格式无文档<\/li><li>Agent SDK / <code>claude -p<\/code>：可控但不是交互式界面<\/li><li>node-pty + xterm.js 跑真实 <code>claude<\/code>：完整交互式体验，输入就是键盘输入<\/li><\/ul>\n<p><strong>结论<\/strong>：采用 PTY 方案；外部终端里的会话只监控、「跳过去」。<br><strong>理由<\/strong>：官方支持的交互式 CLI，授权确认等都在内嵌终端里原样操作。代价：agent 寿命跟随程序（用恢复阵容弥补）。<\/p>", "notes_html": []}, {"id": "D-004", "type": "decision", "title": "我方 agent 按进程识别，不按会话 ID", "summary": "/clear 和恢复会话会换会话 ID，进程 pid 不变", "detail": "**问题**：卡片 / 小窗要知道哪个会话是我方的，才能打开内嵌终端而不是切窗口。\n**候选方案**：按 sessionId 匹配（/clear、resume 后失效）；按 pid 匹配（node-pty 在 Windows 返回 pid 0）。\n**结论**：启动后把该文件夹里第一个新出现的状态文件的 pid 绑定给 agent，之后一直按 pid 跟随，并同步当前 sessionId。\n**理由**：修复「点跳转只回到窗口不回到对话」。", "status": "accepted", "files": ["server/agents.js", "server/index.js"], "tags": ["agent"], "sections": ["architecture"], "refs": [], "created": "2026-10-30 14:00", "updated": "2026-10-30 14:00", "notes": [], "detail_html": "<p><strong>问题<\/strong>：卡片 / 小窗要知道哪个会话是我方的，才能打开内嵌终端而不是切窗口。<br><strong>候选方案<\/strong>：按 sessionId 匹配（/clear、resume 后失效）；按 pid 匹配（node-pty 在 Windows 返回 pid 0）。<br><strong>结论<\/strong>：启动后把该文件夹里第一个新出现的状态文件的 pid 绑定给 agent，之后一直按 pid 跟随，并同步当前 sessionId。<br><strong>理由<\/strong>：修复「点跳转只回到窗口不回到对话」。<\/p>", "notes_html": []}, {"id": "D-005", "type": "decision", "title": "去掉 Live2D，桌宠换成战况小窗", "summary": "Live2D 持续占 GPU、信息量少，用户要求换成更有用的信息展示", "detail": "**问题**：Live2D 角色（官方样本 Rice）作为领航员和桌宠，性能和实用性都不理想。\n**结论**：桌宠换成置顶的「战况」小窗（额度、最急任务、部队列表）；指挥中心左侧先换成概览，后改为总指令台。删除 live2d.js、模型与 CDN 依赖。\n**理由**：用户明确要求；顺带去掉了 Live2D 样本模型的再分发授权问题。", "status": "accepted", "files": ["web/widget.html", "web/widget.js", "web/index.html"], "tags": ["界面"], "sections": ["features"], "refs": [], "created": "2026-10-30 14:30", "updated": "2026-10-30 14:30", "notes": [], "detail_html": "<p><strong>问题<\/strong>：Live2D 角色（官方样本 Rice）作为领航员和桌宠，性能和实用性都不理想。<br><strong>结论<\/strong>：桌宠换成置顶的「战况」小窗（额度、最急任务、部队列表）；指挥中心左侧先换成概览，后改为总指令台。删除 live2d.js、模型与 CDN 依赖。<br><strong>理由<\/strong>：用户明确要求；顺带去掉了 Live2D 样本模型的再分发授权问题。<\/p>", "notes_html": []}, {"id": "D-006", "type": "decision", "title": "程序数据统一放 ~/.claude-ops", "summary": "安装版程序目录只读；开发版与安装版共用一份数据", "detail": "**问题**：最初数据写在项目 `data/`，安装后程序目录只读，hook 脚本也依赖源码路径。\n**结论**：通讯记录、额度缓存、授权通知、阵容、配置、hook 脚本都放 `~/.claude-ops/`；`MONITOR_DATA_DIR` 可覆盖（测试版隔离用）。\n**理由**：删掉源码目录也不影响提醒；升级后数据延续。", "status": "accepted", "files": ["server/config.js", "desktop/main.cjs"], "tags": ["部署"], "sections": ["data", "config-deploy"], "refs": [], "created": "2026-10-30 13:03", "updated": "2026-10-30 13:03", "notes": [], "detail_html": "<p><strong>问题<\/strong>：最初数据写在项目 <code>data/<\/code>，安装后程序目录只读，hook 脚本也依赖源码路径。<br><strong>结论<\/strong>：通讯记录、额度缓存、授权通知、阵容、配置、hook 脚本都放 <code>~/.claude-ops/<\/code>；<code>MONITOR_DATA_DIR<\/code> 可覆盖（测试版隔离用）。<br><strong>理由<\/strong>：删掉源码目录也不影响提醒；升级后数据延续。<\/p>", "notes_html": []}, {"id": "I-001", "type": "issue", "title": "OAuth 用量接口频繁 429 限流", "summary": "反复重启导致每次启动都立即请求；状态栏插件也在调用同一接口", "detail": "**现象**：顶栏显示「读取失败：http_429 / rate_limited」，持续数十分钟。\n**根因**：每次启动立即请求一次 + 1 分钟轮询；退避状态没有持久化，重启后又立刻请求；claude-hud 状态栏也调用该接口。\n**解决**：429 时 2、4、8…最长 30 分钟退避，退避状态与最后一次成功数据写 `usage-cache.json`；两次请求至少间隔 1 分钟（重启也算）；轮询改为 3 分钟。\n**如何避免**：调试时少重启；用 `npm run probe` 或隔离端口测试。", "status": "resolved", "files": ["server/collectors/usage.js"], "tags": ["额度"], "sections": ["features"], "refs": [], "created": "2026-10-30 11:30", "updated": "2026-10-30 16:00", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：顶栏显示「读取失败：http_429 / rate_limited」，持续数十分钟。<br><strong>根因<\/strong>：每次启动立即请求一次 + 1 分钟轮询；退避状态没有持久化，重启后又立刻请求；claude-hud 状态栏也调用该接口。<br><strong>解决<\/strong>：429 时 2、4、8…最长 30 分钟退避，退避状态与最后一次成功数据写 <code>usage-cache.json<\/code>；两次请求至少间隔 1 分钟（重启也算）；轮询改为 3 分钟。<br><strong>如何避免<\/strong>：调试时少重启；用 <code>npm run probe<\/code> 或隔离端口测试。<\/p>", "notes_html": []}, {"id": "I-002", "type": "issue", "title": "从 Claude 会话里启动的 agent 不注册状态文件", "summary": "继承了 CLAUDE_CODE_CHILD_SESSION 等变量，子 claude 当自己是嵌套会话", "detail": "**现象**：PTY 启动的 claude 能正常交互，但 `~/.claude/sessions/` 下没有它的状态文件，部队卡片里看不到。\n**根因**：开发时程序是从一个 Claude 会话的终端里启动的，环境里有 `CLAUDECODE`、`CLAUDE_CODE_CHILD_SESSION`、`CLAUDE_CODE_SESSION_ID`、消息令牌等。\n**解决**：`agents.js` 的 `agentEnv()` 启动前删除这些会话级变量，保留 `ANTHROPIC_*` 等用户配置。", "status": "resolved", "files": ["server/agents.js"], "tags": ["agent", "环境"], "sections": ["dev-guide"], "refs": [], "created": "2026-10-30 13:25", "updated": "2026-10-30 16:00", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：PTY 启动的 claude 能正常交互，但 <code>~/.claude/sessions/<\/code> 下没有它的状态文件，部队卡片里看不到。<br><strong>根因<\/strong>：开发时程序是从一个 Claude 会话的终端里启动的，环境里有 <code>CLAUDECODE<\/code>、<code>CLAUDE_CODE_CHILD_SESSION<\/code>、<code>CLAUDE_CODE_SESSION_ID<\/code>、消息令牌等。<br><strong>解决<\/strong>：<code>agents.js<\/code> 的 <code>agentEnv()<\/code> 启动前删除这些会话级变量，保留 <code>ANTHROPIC_*<\/code> 等用户配置。<\/p>", "notes_html": []}, {"id": "I-003", "type": "issue", "title": "强制结束程序后 agent 成为孤儿进程", "summary": "Stop-Process / 崩溃不会走 before-quit，ConPTY 下的 claude 可能继续运行", "detail": "**现象**：强制结束 Electron 后，有的 claude 进程还在（父进程已不存在）。\n**根因**：只有正常退出才会 `shutdown()` 结束 agent。\n**解决**：恢复阵容时，对仍在运行的同会话进程检查父进程：父进程不在 → 孤儿，结束后再接管；父进程在 → 正被外部终端使用，跳过。\n**如何避免**：用小窗菜单「退出」。", "status": "resolved", "files": ["server/roster.js"], "tags": ["agent", "进程"], "sections": ["flows", "dev-guide"], "refs": [], "created": "2026-10-30 15:05", "updated": "2026-10-30 16:00", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：强制结束 Electron 后，有的 claude 进程还在（父进程已不存在）。<br><strong>根因<\/strong>：只有正常退出才会 <code>shutdown()<\/code> 结束 agent。<br><strong>解决<\/strong>：恢复阵容时，对仍在运行的同会话进程检查父进程：父进程不在 → 孤儿，结束后再接管；父进程在 → 正被外部终端使用，跳过。<br><strong>如何避免<\/strong>：用小窗菜单「退出」。<\/p>", "notes_html": []}, {"id": "I-004", "type": "issue", "title": "D 盘空间不足导致打包失败", "summary": "D 盘只有 15GB，旧安装包和解包目录占满", "detail": "**现象**：`ENOSPC: no space left on device, write`\n**根因**：每个版本安装包约 120MB、解包目录约 365MB，累计多个版本。\n**解决**：删除被取代的旧安装包；输出保持在项目 `dist/`。\n**如何避免**：每出一个新版本就删掉旧安装包；必要时清理 D 盘。", "status": "resolved", "files": ["package.json"], "tags": ["部署"], "sections": ["config-deploy"], "refs": [], "created": "2026-10-30 15:30", "updated": "2026-10-30 16:00", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：<code>ENOSPC: no space left on device, write<\/code><br><strong>根因<\/strong>：每个版本安装包约 120MB、解包目录约 365MB，累计多个版本。<br><strong>解决<\/strong>：删除被取代的旧安装包；输出保持在项目 <code>dist/<\/code>。<br><strong>如何避免<\/strong>：每出一个新版本就删掉旧安装包；必要时清理 D 盘。<\/p>", "notes_html": []}, {"id": "I-005", "type": "issue", "title": "终端里出现 SessionStart hook error（乱码）", "summary": "来自 Warp 插件的启动脚本在 Windows 上执行失败，与本项目无关", "detail": "**现象**：`SessionStart:startup hook error / Failed with non-blocking status code: ...27`\n**根因**：`warp` 与 `oz-harness-support` 插件的 SessionStart hook 运行 `.sh` 脚本，在 Windows 上失败；乱码是日文系统错误信息的编码。外部终端的会话里同样存在。\n**解决**：不影响使用；不需要可禁用这两个插件。", "status": "resolved", "files": [], "tags": ["环境"], "sections": ["dev-guide"], "refs": [], "created": "2026-10-30 13:35", "updated": "2026-10-30 13:35", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：<code>SessionStart:startup hook error / Failed with non-blocking status code: ...27<\/code><br><strong>根因<\/strong>：<code>warp<\/code> 与 <code>oz-harness-support<\/code> 插件的 SessionStart hook 运行 <code>.sh<\/code> 脚本，在 Windows 上失败；乱码是日文系统错误信息的编码。外部终端的会话里同样存在。<br><strong>解决<\/strong>：不影响使用；不需要可禁用这两个插件。<\/p>", "notes_html": []}, {"id": "I-006", "type": "issue", "title": "Live2D 持续重绘占用大量 GPU / 内存", "summary": "60fps 不停渲染，程序约 1GB，GPU 进程 5 分钟 59 秒 CPU", "detail": "**现象**：电脑卡顿，Electron 约 1GB，GPU 进程 375MB。\n**根因**：Live2D 两个画面（桌宠 + 主界面）以 60fps 持续渲染，窗口不可见也不停。\n**解决**：限帧 24/30fps、不可见时停止渲染、关闭抗锯齿与高 DPR；内存降到约 540MB，GPU CPU 4%。之后 Live2D 整体移除（D-005）。", "status": "resolved", "files": ["web/live2d.js"], "tags": ["性能"], "sections": ["dev-guide"], "refs": [], "created": "2026-10-30 12:45", "updated": "2026-10-30 16:00", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：电脑卡顿，Electron 约 1GB，GPU 进程 375MB。<br><strong>根因<\/strong>：Live2D 两个画面（桌宠 + 主界面）以 60fps 持续渲染，窗口不可见也不停。<br><strong>解决<\/strong>：限帧 24/30fps、不可见时停止渲染、关闭抗锯齿与高 DPR；内存降到约 540MB，GPU CPU 4%。之后 Live2D 整体移除（D-005）。<\/p>", "notes_html": []}, {"id": "I-007", "type": "issue", "title": "同一会话被接管两次，两个进程写同一记录", "summary": "全军出击与「在此继续」各接管了一次同一个会话", "detail": "**现象**：两个我方终端的状态文件都是同一个 sessionId。\n**根因**：接管时只按 agent 初始 id 去重，没有按当前 sessionId 判断。\n**解决**：`spawnAgent` 接管前检查所有存活 agent 的 id 与当前 sessionId，已存在就返回原 agent；阵容按 sessionId 去重。", "status": "resolved", "files": ["server/agents.js", "server/roster.js"], "tags": ["agent"], "sections": ["features"], "refs": [], "created": "2026-10-30 15:35", "updated": "2026-10-30 16:00", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：两个我方终端的状态文件都是同一个 sessionId。<br><strong>根因<\/strong>：接管时只按 agent 初始 id 去重，没有按当前 sessionId 判断。<br><strong>解决<\/strong>：<code>spawnAgent<\/code> 接管前检查所有存活 agent 的 id 与当前 sessionId，已存在就返回原 agent；阵容按 sessionId 去重。<\/p>", "notes_html": []}, {"id": "I-008", "type": "issue", "title": "<synthetic> 占位消息导致负载读数为 0", "summary": "中断 / 出错时会写入 usage 全 0 的 assistant 消息", "detail": "**现象**：会话被打断后负载显示 0。\n**根因**：`model = <synthetic>` 的占位消息 usage 全为 0。\n**解决**：计算负载时跳过这类消息和 sidechain 消息。", "status": "resolved", "files": ["server/collectors/transcript.js"], "tags": ["会话"], "sections": ["data"], "refs": [], "created": "2026-10-30 10:35", "updated": "2026-10-30 16:00", "notes": [], "count": 1, "detail_html": "<p><strong>现象<\/strong>：会话被打断后负载显示 0。<br><strong>根因<\/strong>：<code>model = &lt;synthetic&gt;<\/code> 的占位消息 usage 全为 0。<br><strong>解决<\/strong>：计算负载时跳过这类消息和 sidechain 消息。<\/p>", "notes_html": []}, {"id": "T-001", "type": "todo", "title": "显示分支的 PR / CI 状态", "summary": "需要 gh 登录（当前未登录，GitHub MCP 也连接失败）", "detail": "**要做什么**：在仓库行显示 PR 链接、CI 是否通过。\n**为什么暂缓**：`gh auth status` 未登录。\n**触发条件**：用户执行 `gh auth login` 后。\n**相关位置**：`server/collectors/git.js`", "status": "open", "files": [], "tags": ["git"], "sections": ["features"], "refs": [], "created": "2026-10-30 11:40", "updated": "2026-10-30 11:40", "notes": [], "priority": "P2", "detail_html": "<p><strong>要做什么<\/strong>：在仓库行显示 PR 链接、CI 是否通过。<br><strong>为什么暂缓<\/strong>：<code>gh auth status<\/code> 未登录。<br><strong>触发条件<\/strong>：用户执行 <code>gh auth login<\/code> 后。<br><strong>相关位置<\/strong>：<code>server/collectors/git.js<\/code><\/p>", "notes_html": []}, {"id": "T-002", "type": "todo", "title": "可选的后台 git fetch", "summary": "领先/落后数依赖上次 fetch，可能过期；默认不联网", "detail": "**要做什么**：每 10-15 分钟后台 fetch，让 ↑↓ 准确。\n**为什么暂缓**：会访问网络、需要仓库凭证，用户未确认。\n**相关位置**：`config.git.autoFetch`、`server/collectors/git.js`", "status": "open", "files": [], "tags": ["git"], "sections": ["config-deploy"], "refs": [], "created": "2026-10-30 11:40", "updated": "2026-10-30 11:40", "notes": [], "priority": "P2", "detail_html": "<p><strong>要做什么<\/strong>：每 10-15 分钟后台 fetch，让 ↑↓ 准确。<br><strong>为什么暂缓<\/strong>：会访问网络、需要仓库凭证，用户未确认。<br><strong>相关位置<\/strong>：<code>config.git.autoFetch<\/code>、<code>server/collectors/git.js<\/code><\/p>", "notes_html": []}, {"id": "T-003", "type": "todo", "title": "「跳过去」只能切到窗口，选不中终端标签页", "summary": "Windows Terminal 不支持外部选中标签页", "detail": "**要做什么**：外部会话「跳过去」时定位到具体标签页。\n**为什么暂缓**：没有公开接口；只能切到父窗口。\n**相关位置**：`server/focus.js`", "status": "open", "files": [], "tags": ["会话"], "sections": ["features"], "refs": [], "created": "2026-10-30 11:35", "updated": "2026-10-30 11:35", "notes": [], "priority": "P2", "detail_html": "<p><strong>要做什么<\/strong>：外部会话「跳过去」时定位到具体标签页。<br><strong>为什么暂缓<\/strong>：没有公开接口；只能切到父窗口。<br><strong>相关位置<\/strong>：<code>server/focus.js<\/code><\/p>", "notes_html": []}, {"id": "T-004", "type": "todo", "title": "授权 hook 依赖本机 Node 路径", "summary": "settings.json 里写死了本机 Node 的绝对路径", "detail": "**要做什么**：换台电脑或 Node 路径变化时 hook 会失效；可改为用程序自带的运行时或安装时写入。\n**为什么暂缓**：目前只在本机使用。\n**相关位置**：`~/.claude/settings.json`、`server/hook.js`", "status": "open", "files": [], "tags": ["hook", "部署"], "sections": ["config-deploy"], "refs": [], "created": "2026-10-30 13:05", "updated": "2026-10-30 13:05", "notes": [], "priority": "P2", "detail_html": "<p><strong>要做什么<\/strong>：换台电脑或 Node 路径变化时 hook 会失效；可改为用程序自带的运行时或安装时写入。<br><strong>为什么暂缓<\/strong>：目前只在本机使用。<br><strong>相关位置<\/strong>：<code>~/.claude/settings.json<\/code>、<code>server/hook.js<\/code><\/p>", "notes_html": []}, {"id": "T-005", "type": "todo", "title": "安装程序代码签名", "summary": "未签名，首次运行有 SmartScreen 提示", "detail": "**要做什么**：申请代码签名证书并配置 electron-builder。\n**为什么暂缓**：内部自用。", "status": "open", "files": [], "tags": ["部署"], "sections": ["config-deploy"], "refs": [], "created": "2026-10-30 13:06", "updated": "2026-10-30 13:06", "notes": [], "priority": "P2", "detail_html": "<p><strong>要做什么<\/strong>：申请代码签名证书并配置 electron-builder。<br><strong>为什么暂缓<\/strong>：内部自用。<\/p>", "notes_html": []}, {"id": "T-006", "type": "todo", "title": "实测 0.4.2 升级时的阵容恢复", "summary": "恢复阵容在隔离测试中验证过，真实升级（安装程序关闭旧版）还没实测", "detail": "**要做什么**：从 0.4.0 升级到 0.4.2，确认 4 个 agent（含当前对话）被接回、孤儿被清理。\n**为什么暂缓**：当前对话运行在安装版里，升级会中断。\n**触发条件**：用户下次方便时升级。\n**相关位置**：`server/roster.js`、`~/.claude-ops/roster.json`", "status": "open", "files": [], "tags": ["agent", "部署"], "sections": ["flows"], "refs": [], "created": "2026-10-30 15:45", "updated": "2026-10-30 15:45", "notes": [], "priority": "P1", "detail_html": "<p><strong>要做什么<\/strong>：从 0.4.0 升级到 0.4.2，确认 4 个 agent（含当前对话）被接回、孤儿被清理。<br><strong>为什么暂缓<\/strong>：当前对话运行在安装版里，升级会中断。<br><strong>触发条件<\/strong>：用户下次方便时升级。<br><strong>相关位置<\/strong>：<code>server/roster.js<\/code>、<code>~/.claude-ops/roster.json<\/code><\/p>", "notes_html": []}, {"id": "T-007", "type": "todo", "title": "项目还不是 git 仓库", "summary": "项目目录还没有版本管理", "detail": "**要做什么**：`git init` 并提交，之后记录可以填 `--ref`。\n**为什么暂缓**：用户未要求。", "status": "done", "files": [], "tags": ["开发"], "sections": ["dev-guide"], "refs": ["ce1080b", "v0.4.2"], "created": "2026-10-30 15:50", "updated": "2026-10-30 16:01", "notes": [{"time": "2026-10-30 16:01", "text": "已初始化 git（main 分支），首次提交 ce1080b 并打 tag v0.4.2"}], "priority": "P2", "detail_html": "<p><strong>要做什么<\/strong>：<code>git init<\/code> 并提交，之后记录可以填 <code>--ref<\/code>。<br><strong>为什么暂缓<\/strong>：用户未要求。<\/p>", "notes_html": [{"time": "2026-10-30 16:01", "html": "<p>已初始化 git（main 分支），首次提交 ce1080b 并打 tag v0.4.2<\/p>"}]}, {"id": "C-001", "type": "change", "title": "额度改为按接口 limits 列表显示「已用」", "summary": "与 /usage 一致；新增 Fable 等按模型周额度", "detail": "**背景**：只显示 5h / 周两项且显示的是「剩余」，与 `/usage` 对不上。\n**改动内容**：读取 `limits[]`，逐项显示已用 % 与重置倒计时，当前起作用的一项标橙。\n**影响范围**：顶栏、小窗、任务（额度告急）、事件（回充）。", "status": "done", "files": ["server/collectors/usage.js", "web/app.js", "web/widget.js"], "tags": ["额度"], "sections": ["features"], "refs": [], "created": "2026-10-30 13:00", "updated": "2026-10-30 13:00", "notes": [], "detail_html": "<p><strong>背景<\/strong>：只显示 5h / 周两项且显示的是「剩余」，与 <code>/usage<\/code> 对不上。<br><strong>改动内容<\/strong>：读取 <code>limits[]<\/code>，逐项显示已用 % 与重置倒计时，当前起作用的一项标橙。<br><strong>影响范围<\/strong>：顶栏、小窗、任务（额度告急）、事件（回充）。<\/p>", "notes_html": []}, {"id": "C-002", "type": "change", "title": "指挥中心改为无边框、铺满桌面、自适应布局", "summary": "不再固定 1440x900 缩放；每页条数按可用空间计算", "detail": "**改动内容**：窗口 `frame:false` 并最大化，HUD 顶栏可拖动、自带最小化/最大化/关闭；部队卡片按宽度、任务/存档/通讯按高度计算每页数量。\n**影响范围**：`web/style.css`、`web/app.js` 的 `pageSize()`、`desktop/main.cjs`。", "status": "done", "files": ["web/app.js", "web/style.css", "desktop/main.cjs"], "tags": ["界面"], "sections": ["features"], "refs": [], "created": "2026-10-30 15:00", "updated": "2026-10-30 15:00", "notes": [], "detail_html": "<p><strong>改动内容<\/strong>：窗口 <code>frame:false<\/code> 并最大化，HUD 顶栏可拖动、自带最小化/最大化/关闭；部队卡片按宽度、任务/存档/通讯按高度计算每页数量。<br><strong>影响范围<\/strong>：<code>web/style.css<\/code>、<code>web/app.js<\/code> 的 <code>pageSize()<\/code>、<code>desktop/main.cjs<\/code>。<\/p>", "notes_html": []}, {"id": "C-003", "type": "change", "title": "出击默认继续文件夹最新会话", "summary": "选了有历史的文件夹时默认接管最新会话，可切换为新会话", "detail": "**改动内容**：出击对话框显示「继续最新会话：标题 · 多久前」；已是我方则直接打开；外部运行中则只能开新会话。\n**影响范围**：`web/app.js` 出击对话框。", "status": "done", "files": ["web/app.js", "web/index.html"], "tags": ["agent"], "sections": ["features"], "refs": [], "created": "2026-10-30 15:25", "updated": "2026-10-30 15:25", "notes": [], "detail_html": "<p><strong>改动内容<\/strong>：出击对话框显示「继续最新会话：标题 · 多久前」；已是我方则直接打开；外部运行中则只能开新会话。<br><strong>影响范围<\/strong>：<code>web/app.js<\/code> 出击对话框。<\/p>", "notes_html": []}, {"id": "C-004", "type": "change", "title": "移除终端与总指令台的快捷命令按钮", "summary": "/compact、/clear、负载高的压缩不再显示，只保留 Esc 与结束", "detail": "**原因**：用户不需要；指令直接在终端 -006）。", "status": "done", "files": [], "tags": ["里程碑"], "sections": ["flows"], "refs": ["ce1080b", "v0.4.2"], "created": "2026-10-30 15:42", "updated": "2026-10-30 16:01", "notes": [], "detail_html": "<p><strong>关键产出<\/strong>：<code>server/roster.js<\/code>、<code>web/ui.js<\/code>。<br><strong>下一步<\/strong>：实测升级恢复（T-006）。<\/p>", "notes_html": []}, {"id": "M-008", "type": "milestone", "title": "建立项目文档", "summary": "补齐 8 个章节，补录当天的决策、问题、TODO、变更与里程碑", "detail": "", "status": "done", "files": [], "tags": ["里程碑"], "sections": ["overview"], "refs": [], "created": "2026-10-30 16:00", "updated": "2026-10-30 16:00", "notes": [], "detail_html": "", "notes_html": []}, {"id": "D-007", "type": "decision", "title": "产品更名为 Fleet Bridge · 舰桥", "summary": "可见名称全部改为舰桥；appId 与 ~/.claude-ops 保持不变以便平滑升级（通知 ID 后来在 0.5.6 改为与 appId 一致，见 I-009）", "detail": "**问题**：「CLAUDE//OPS」是临时名，且直接用了 Claude 商标做产品名。\n**候选方案**：Claude Command / Fleet Bridge（舰桥）/ Squadron / Overwatch Deck / Nexus。\n**结论**：Fleet Bridge · 舰桥。窗口标题、Logo、小窗、安装包（`FleetBridge-Setup-<版本>.exe`）、快捷方式、`package.json` 名称都已改。\n**保持不变**：`appId`（`local.claude-ops.monitor`，让新安装包自动替换旧的 CLAUDE OPS）、通知 ID（`claude-ops-monitor`）、数据目录 `~/.claude-ops`（全局 hook 路径指向这里）。\n**理由**：与「部队 / 出击 / 僚机」的舰队用语一致；不以商标作产品名；内部标识不动，升级无需迁移。\n**注意**：程序名变了，安装目录与窗口偏好（小窗位置、静音）会重置；之前勾选过的「开机自动启动」需要重新勾选。\n", "status": "accepted", "files": ["package.json", "web/index.html", "web/widget.html", "desktop/main.cjs", "README.md"], "tags": ["命名", "部署"], "sections": ["overview", "config-deploy"], "refs": [], "created": "2026-10-30 16:03", "updated": "2026-10-31 10:12", "notes": [{"time": "2026-10-31 10:12", "text": "2026-10-31：通知 / 任务栏 ID（AppUserModelId）已改为与 appId 一致的 local.claude-ops.monitor，旧 ID 会匹配到已失效的 CLAUDE OPS 快捷方式，见 I-009。appId 与 ~/.claude-ops 仍不变。"}], "detail_html": "<p><strong>问题<\/strong>：「CLAUDE//OPS」是临时名，且直接用了 Claude 商标做产品名。<br><strong>候选方案<\/strong>：Claude Command / Fleet Bridge（舰桥）/ Squadron / Overwatch Deck / Nexus。<br><strong>结论<\/strong>：Fleet Bridge · 舰桥。窗口标题、Logo、小窗、安装包（<code>FleetBridge-Setup-&lt;版本&gt;.exe<\/code>）、快捷方式、<code>package.json<\/code> 名称都已改。<br><strong>保持不变<\/strong>：<code>appId<\/code>（<code>local.claude-ops.monitor<\/code>，让新安装包自动替换旧的 CLAUDE OPS）、通知 ID（<code>claude-ops-monitor<\/code>）、数据目录 <code>~/.claude-ops<\/code>（全局 hook 路径指向这里）。<br><strong>理由<\/strong>：与「部队 / 出击 / 僚机」的舰队用语一致；不以商标作产品名；内部标识不动，升级无需迁移。<br><strong>注意<\/strong>：程序名变了，安装目录与窗口偏好（小窗位置、静音）会重置；之前勾选过的「开机自动启动」需要重新勾选。<\/p>", "notes_html": [{"time": "2026-10-31 10:12", "html": "<p>2026-10-31：通知 / 任务栏 ID（AppUserModelId）已改为与 appId 一致的 local.claude-ops.monitor，旧 ID 会匹配到已失效的 CLAUDE OPS 快捷方式，见 I-009。appId 与 ~/.claude-ops 仍不变。<\/p>"}]}, {"id": "M-009", "type": "milestone", "title": "发布 0.5.0（Fleet Bridge · 舰桥）", "summary": "更名后的首个版本，安装包发布到 GitHub Release", "detail": "**完成了什么**：以新名字 Fleet Bridge · 舰桥打包 `FleetBridge-Setup-0.5.0.exe`，发布到 https://github.com/zhaozihuitre/FleetBridge/releases\n**关键产出**：安装包会自动替换旧的 CLAUDE OPS（appId 不变），升级后按 roster.json 恢复阵容。\n**下一步**：实测升级恢复（T-006）。\n", "status": "done", "files": [], "tags": ["里程碑", "部署"], "sections": ["config-deploy"], "refs": ["v0.5.0"], "created": "2026-10-30 16:12", "updated": "2026-10-30 16:12", "notes": [], "detail_html": "<p><strong>完成了什么<\/strong>：以新名字 Fleet Bridge · 舰桥打包 <code>FleetBridge-Setup-0.5.0.exe<\/code>，发布到 https://github.com/zhaozihuitre/FleetBridge/releases<br><strong>关键产出<\/strong>：安装包会自动替换旧的 CLAUDE OPS（appId 不变），升级后按 roster.json 恢复阵容。<br><strong>下一步<\/strong>：实测升级恢复（T-006）。<\/p>", "notes_html": []}, {"id": "C-006", "type": "change", "title": "每个仓库显示推送目标远程", "summary": "仓库行与终端标题栏显示 git push 会推到哪个远程仓库，避免提交到错误的仓库", "detail": "**背景**：同一个项目文件夹下有个人仓库（zhaozihuitre/AiPacer）也有公司仓库（retail-ai-inc/…），看不出推送目标容易提交错。\n**改动内容**：git 采集新增 `remote`（上游所属远程 → origin → 唯一远程）与 `remotes[]`；仓库行显示 `origin  github.com/owner/repo`（可点开），多个远程标「另有 …」，无远程橙色提示；终端标题栏显示 `⎇ owner/repo · 分支`。\n**注意事项**：URL 中的用户名 / 令牌在后端去掉，前端只拿到 host 与 owner/repo。桌面版点击仓库链接用默认浏览器打开（仅 https）。\n", "status": "done", "files": ["server/collectors/git.js", "web/app.js", "web/term.js", "desktop/main.cjs"], "tags": ["git"], "sections": ["features", "api"], "refs": [], "created": "2026-10-30 16:54", "updated": "2026-10-30 16:54", "notes": [], "detail_html": "<p><strong>背景<\/strong>：同一个项目文件夹下有个人仓库（zhaozihuitre/AiPacer）也有公司仓库（retail-ai-inc/…），看不出推送目标容易提交错。<br><strong>改动内容<\/strong>：git 采集新增 <code>remote<\/code>（上游所属远程 → origin → 唯一远程）与 <code>remotes[]<\/code>；仓库行显示 <code>origin  github.com/owner/repo<\/code>（可点开），多个远程标「另有 …」，无远程橙色提示；终端标题栏显示 <code>⎇ owner/repo · 分支<\/code>。<br><strong>注意事项<\/strong>：URL 中的用户名 / 令牌在后端去掉，前端只拿到 host 与 owner/repo。桌面版点击仓库链接用默认浏览器打开（仅 https）。<\/p>", "notes_html": []}, {"id": "M-010", "type": "milestone", "title": "发布 0.5.1（显示推送目标远程）", "summary": "每个仓库显示 git push 的目标仓库，终端标题栏显示当前仓库", "detail": "", "status": "done", "files": [], "tags": ["里程碑", "部署"], "sections": ["config-deploy"], "refs": ["v0.5.1"], "created": "2026-10-30 17:04", "updated": "2026-10-30 17:04", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-007", "type": "change", "title": "动态分屏：当前 / 收到指令的终端变大", "summary": "分屏随焦点和下令动态调整大小，可在终端顶栏关闭", "detail": "**改动内容**：活动终端用 grid 的 2fr / 1fr 权重放大（两屏：列；四宫格：行和列），其他终端缩小、字号 11、透明度 .78；总指令台发送后 `spotlight()`：单个接收者成为活动终端，多个接收者边框闪烁；顶栏「⇔ 动态」开关（localStorage）。深链接支持 `#term=id1,id2,…` 一次打开多个终端。\n**注意事项**：终端 ResizeObserver 改为停止变化 120ms 后再 fit，避免动画期间反复向 PTY 发送尺寸导致 TUI 重绘。\n", "status": "done", "files": ["web/app.js", "web/terminal.js", "web/style.css", "web/index.html"], "tags": ["界面", "终端"], "sections": ["features"], "refs": [], "created": "2026-10-30 17:07", "updated": "2026-10-30 17:07", "notes": [], "detail_html": "<p><strong>改动内容<\/strong>：活动终端用 grid 的 2fr / 1fr 权重放大（两屏：列；四宫格：行和列），其他终端缩小、字号 11、透明度 .78；总指令台发送后 <code>spotlight()<\/code>：单个接收者成为活动终端，多个接收者边框闪烁；顶栏「⇔ 动态」开关（localStorage）。深链接支持 <code>#term=id1,id2,…<\/code> 一次打开多个终端。<br><strong>注意事项<\/strong>：终端 ResizeObserver 改为停止变化 120ms 后再 fit，避免动画期间反复向 PTY 发送尺寸导致 TUI 重绘。<\/p>", "notes_html": []}, {"id": "M-011", "type": "milestone", "title": "打包 0.5.2（动态分屏）", "summary": "当前 / 收到指令的终端自动变大；已推送（Release 未发布）", "detail": "", "status": "done", "files": [], "tags": ["里程碑", "部署"], "sections": ["config-deploy"], "refs": ["v0.5.2"], "created": "2026-10-30 17:11", "updated": "2026-10-31 10:12", "notes": [{"time": "2026-10-31 10:12", "text": "2026-10-31：v0.5.1–v0.5.6 的代码与标签已推送到 GitHub；GitHub Release 目前只发布了 0.5.0。"}], "detail_html": "", "notes_html": [{"time": "2026-10-31 10:12", "html": "<p>2026-10-31：v0.5.1–v0.5.6 的代码与标签已推送到 GitHub；GitHub Release 目前只发布了 0.5.0。<\/p>"}]}, {"id": "C-008", "type": "change", "title": "收紧 Windows 通知（0.5.4）", "summary": "同时开多个会话时通知刷屏：每个会话每做完一轮就弹「做完了」。改为：指挥中心在屏幕上时不弹；「做完了」空闲满 20 秒才弹；「负载过高」每会话每小时最多一次；「等你授权」仍立即弹。", "detail": "", "status": "done", "files": ["web/widget.js", "desktop/main.cjs"], "tags": ["通知", "小窗"], "sections": ["02-features"], "refs": [], "created": "2026-10-30 17:29", "updated": "2026-10-30 17:29", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-009", "type": "change", "title": "终端改用 WebGL 渲染，动态分屏当前终端占 3/4（0.5.5）", "summary": "输入卡顿：xterm 默认 DOM 渲染在多个终端同时重绘时很慢，改用 @xterm/addon-webgl（不可用或上下文丢失时退回 DOM）。动态分屏当前终端由 2/3 加大到约 3/4。", "detail": "", "status": "done", "files": ["web/terminal.js", "web/app.js", "server/index.js", "package.json"], "tags": ["终端", "性能"], "sections": ["02-features"], "refs": [], "created": "2026-10-31 08:57", "updated": "2026-10-31 08:57", "notes": [], "detail_html": "", "notes_html": []}, {"id": "I-009", "type": "issue", "title": "任务栏图标显示为白色", "summary": "程序的 AppUserModelId 是 claude-ops-monitor，Windows 按它找到旧的 CLAUDE OPS 开始菜单快捷方式，而那个 exe 升级后已不存在，于是任务栏图标空白。改为与安装器写入快捷方式的 appId（local.claude-ops.monitor）一致；窗口显式设置 icon；安装时删除旧的 CLAUDE OPS / Fleet Bridge 快捷方式（0.5.6）。", "detail": "", "status": "resolved", "files": ["desktop/main.cjs", "desktop/icon.png", "build/installer.nsh", "package.json"], "tags": ["打包", "Windows"], "sections": [], "refs": [], "created": "2026-10-31 09:40", "updated": "2026-10-31 09:40", "notes": [], "count": 1, "detail_html": "", "no
