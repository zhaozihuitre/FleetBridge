<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Bridge · 舰桥</title>
<style>
:root{
  --bg:#f6f6f3;--panel:#ffffff;--side:#efeee9;--text:#1c1f24;--muted:#6a6f78;--faint:#9a9ea6;--line:#e2e1dc;--line-2:#ecebe6;
  --accent:#2b63d9;--accent-soft:#e7eefc;--code:#f2f1ed;--hover:rgba(0,0,0,.045);
  --c-change:#2b63d9;--c-milestone:#7c4ddb;--c-issue:#d24b47;--c-todo:#c98010;--c-decision:#178a5c;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 14px rgba(20,20,20,.04);
  --topbar:rgba(246,246,243,.86);--mono:"JetBrains Mono",Consolas,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141619;--panel:#1b1e22;--side:#17191c;--text:#e4e5e7;--muted:#9ba0a8;--faint:#6f747c;--line:#2a2e34;--line-2:#23262b;
  --accent:#72a2ff;--accent-soft:#1f2c47;--code:#212429;--hover:rgba(255,255,255,.05);
  --c-change:#72a2ff;--c-milestone:#a88bff;--c-issue:#f07470;--c-todo:#eeb04c;--c-decision:#4cc896;
  --shadow:none;--topbar:rgba(20,22,25,.86);}}
:root[data-theme="dark"]{
  --bg:#141619;--panel:#1b1e22;--side:#17191c;--text:#e4e5e7;--muted:#9ba0a8;--faint:#6f747c;--line:#2a2e34;--line-2:#23262b;
  --accent:#72a2ff;--accent-soft:#1f2c47;--code:#212429;--hover:rgba(255,255,255,.05);
  --c-change:#72a2ff;--c-milestone:#a88bff;--c-issue:#f07470;--c-todo:#eeb04c;--c-decision:#4cc896;
  --shadow:none;--topbar:rgba(20,22,25,.86);}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.72 -apple-system,"Segoe UI","PingFang SC","Hiragino Sans","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:13px;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--faint)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:18px 12px 14px}
.brand{display:flex;gap:10px;align-items:flex-start;padding:2px 8px 0}
.logo{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.brand-t span{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}
.search-w{position:relative;margin:16px 0 6px}
.search{width:100%;height:36px;padding:0 34px 0 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:inherit;font-size:13.5px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kbd{position:absolute;right:8px;top:8px;font:11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:18px;background:var(--side)}
.nav{flex:1}
.nav-h{font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--faint);margin:18px 10px 5px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;color:var(--text);font-size:14px;line-height:1.45}
.nav a:hover{background:var(--hover);text-decoration:none}
.nav a.on{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:var(--shadow);outline:1px solid var(--line)}
.nav a.empty{color:var(--faint)}
.nav .num{font:11px var(--mono);color:var(--faint);width:18px;flex:none}
.nav a.on .num{color:var(--accent)}
.nav .lbl{min-width:0;overflow-wrap:anywhere}
.nav .cnt{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nav .pend{margin-left:auto;font-size:10.5px;color:var(--faint);border:1px dashed var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.side-foot{color:var(--faint);font-size:11.5px;padding:14px 10px 0;border-top:1px solid var(--line);margin-top:14px}

.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--topbar);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line-2)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumb b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--faint)}
#menuBtn{display:none}
main{padding:30px 40px 90px;min-width:0}
.wrap{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:44px}
.wrap.full{grid-template-columns:minmax(0,1fr);max-width:1080px}
.wrap>div{min-width:0}

/* ---------- toc ---------- */
.toc{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:12.5px;padding-left:2px}
.toc b{display:block;margin:0 0 8px 12px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.toc a{display:block;color:var(--muted);padding:3px 0 3px 12px;border-left:2px solid var(--line);line-height:1.5;overflow-wrap:anywhere}
.toc a.l3{padding-left:24px;font-size:12px}
.toc a:hover{color:var(--text);text-decoration:none}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}

/* ---------- doc body ---------- */
.meta{color:var(--muted);font-size:12.5px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.doc{overflow-wrap:break-word}
.doc h1{font-size:28px;line-height:1.3;margin:0 0 8px;letter-spacing:-.01em}
.doc h2{font-size:20.5px;line-height:1.4;margin:38px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc h3{font-size:16.5px;margin:26px 0 8px}
.doc h4{font-size:15px;margin:20px 0 6px}
.doc h2,.doc h3,.doc h4{scroll-margin-top:72px}
.doc p{margin:9px 0}
.doc ul,.doc ol{padding-left:22px}
.doc li{margin:3px 0}
.doc code{background:var(--code);padding:1.5px 5px;border-radius:5px;font:12.8px/1.5 var(--mono);overflow-wrap:anywhere}
.codeblock{position:relative;margin:12px 0}
.codeblock .lang{position:absolute;left:12px;top:7px;font:10.5px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.codeblock .copy{position:absolute;right:8px;top:6px;height:26px;padding:0 9px;font-size:12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
.codeblock:hover .copy,.codeblock .copy:focus{opacity:1}
.codeblock .copy.ok{color:var(--c-decision);border-color:var(--c-decision);opacity:1}
.doc pre{background:var(--code);padding:14px 16px;border-radius:10px;overflow:auto;margin:12px 0;font-size:12.8px;line-height:1.6}
.codeblock pre{margin:0;padding-top:28px}
.doc pre code{background:none;padding:0;overflow-wrap:normal}
.doc pre.mermaid{position:relative;background:var(--panel);border:1px solid var(--line);text-align:center;padding:16px;font:12.5px var(--mono);white-space:pre;text-align:left}
.doc pre.mermaid.mm-ok{white-space:normal;text-align:center;cursor:zoom-in}
.doc pre.mermaid.mm-ok svg{max-width:100%;height:auto}
.doc pre.mermaid.mm-ok::after{content:attr(data-hint);position:absolute;right:10px;top:8px;font:11.5px/1 -apple-system,"Segoe UI",sans-serif;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;opacity:0;transition:opacity .15s}
.doc pre.mermaid.mm-ok:hover::after{opacity:1}
.mm-err{margin:12px 0 -12px;padding:7px 12px;border-radius:10px 10px 0 0;background:var(--c-issue);color:#fff;font-size:12.5px;position:relative;z-index:1}
.doc blockquote{margin:12px 0;padding:6px 16px;border-left:3px solid var(--accent);color:var(--muted);background:var(--accent-soft);border-radius:0 8px 8px 0}
.table-wrap{overflow:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc th,.doc td{border-bottom:1px solid var(--line-2);padding:8px 12px;text-align:left;vertical-align:top}
.doc th+th,.doc td+td{border-left:1px solid var(--line-2)}
.doc tr:last-child td{border-bottom:0}
.doc th{background:var(--code);font-weight:600;white-space:nowrap}
.doc tbody tr:hover td{background:var(--hover)}
.doc li.task{list-style:none;margin-left:-20px}
.doc img{max-width:100%;border-radius:8px}
.doc hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.empty-tip{padding:16px 18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);margin:16px 0;background:var(--panel)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:48px}
.pager a{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--panel);color:var(--text);min-width:0}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager span{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager .next{text-align:right;grid-column:2}

/* ---------- cards ---------- */
.hero{margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0 26px}
.stat{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;box-shadow:var(--shadow);overflow:hidden;color:var(--text)}
a.stat:hover{text-decoration:none;border-color:var(--sc,var(--accent))}
.stat::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--sc,var(--line))}
.stat b{font-size:26px;display:block;line-height:1.15;color:var(--sc,var(--text));font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.stat .p0{color:var(--c-issue);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.box{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.box h3{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.box h3 a{margin-left:auto;font-size:12px;font-weight:400}
.mini{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px;min-width:0}
.mini:last-child{border:0}
.mini .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .d{color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini .badge,.mini .prio,.mini .hits{flex:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px;align-items:center}
.filters .gap{width:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.entry{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:12px;padding:13px 18px;margin-bottom:12px;box-shadow:var(--shadow);min-width:0}
.entry.done-todo{opacity:.62}
.e-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;color:#fff;background:var(--tc);font-weight:600;white-space:nowrap}
.eid{font:12px var(--mono);color:var(--faint)}
a.eid:hover{color:var(--accent)}
.e-title{font-weight:650;font-size:15px;min-width:0;overflow-wrap:anywhere}
.status{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);white-space:nowrap}
.status.open,.status.doing{color:var(--c-todo);border-color:var(--c-todo)}
.e-time{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.e-sum{margin:6px 0 2px;color:var(--text)}
.e-foot{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px;font-size:12px;align-items:center}
.e-foot:empty{display:none}
.tag{background:var(--code);border-radius:5px;padding:0 7px;color:var(--muted)}
.file{font-family:var(--mono);color:var(--muted);overflow-wrap:anywhere}
.hits{color:var(--c-issue);font-weight:600;font-size:12px}
details{margin-top:6px}details summary{cursor:pointer;color:var(--accent);font-size:13px;user-select:none}
details .doc{margin-top:6px}
.note{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
.note .d{color:var(--faint);font-size:12px}
.timeline{position:relative;margin:14px 0 0 8px;padding-left:24px;border-left:2px solid var(--line)}
.tl{position:relative;margin-bottom:18px}
.tl::before{content:"";position:absolute;left:-32px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--c-milestone);border:3px solid var(--bg)}
.tl .d{color:var(--muted);font-size:12px;margin-bottom:4px}
.hl{background:#ffe58f;color:#000;border-radius:2px}
.prio{font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);white-space:nowrap}
.prio.P0{background:var(--c-issue);border-color:var(--c-issue);color:#fff}
.prio.P1{color:var(--c-todo);border-color:var(--c-todo)}
.stale{font-size:11.5px;color:var(--c-issue);white-space:nowrap}
.ref{font:11.5px var(--mono);background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 6px}
a.eref{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);border-radius:5px;padding:0 5px}
a.eref.missing{background:none;color:var(--c-issue);text-decoration:line-through;cursor:help}
.group-h{display:flex;align-items:center;gap:8px;margin:26px 0 10px;font-weight:650;font-size:14px}
.group-h .cnt{color:var(--faint);font-weight:400;font-size:12.5px}
.meta-sm{color:var(--muted);font-size:13px}

/* ---------- lightbox (diagram zoom) ---------- */
.lb{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
.lb.open{display:flex}
.lb-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.lb-bar .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bar .pct{font:12px var(--mono);color:var(--muted);min-width:48px;text-align:center}
.lb-stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none;background:
  radial-gradient(circle,var(--line) 1px,transparent 1px) 0 0/18px 18px}
.lb-stage.drag{cursor:grabbing}
.lb-inner{position:absolute;left:0;top:0;transform-origin:0 0}
.lb-inner svg{display:block;background:var(--panel);border-radius:10px;box-shadow:var(--shadow)}
.lb-help{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}

.to-top{position:fixed;right:22px;bottom:22px;z-index:15;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow)}
.to-top.show{opacity:1;pointer-events:auto}
.scrim{display:none}

@media (max-width:1180px){
  .wrap{grid-template-columns:minmax(0,1fr)}.toc{display:none}
}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:60;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.nav-open aside{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  body.nav-open{overflow:hidden}
  #menuBtn{display:inline-flex}
  .topbar{padding:0 12px;height:52px}
  #themeBtn .txt{display:none}
  main{padding:20px 16px 70px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .doc h1{font-size:23px}
  .entry{padding:12px 14px}
  .e-time{margin-left:0;width:100%;order:9}
  .pager{grid-template-columns:minmax(0,1fr)}.pager .next{grid-column:1}
  .kbd{display:none}
}
@media print{
  aside,.topbar,.to-top,.scrim{display:none!important}
  .layout{display:block}main{padding:0}
  .entry,.box,.stat{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="layout">
  <aside id="side">
    <div class="brand" id="brand"></div>
    <div class="search-w"><input class="search" id="q" autocomplete="off"><span class="kbd">/</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="menu">☰</button>
      <div class="crumb" id="crumb"></div>
      <button class="icon-btn" id="themeBtn"><span class="ico">◐</span><span class="txt"></span></button>
    </header>
    <main><div class="wrap" id="view"></div></main>
  </div>
</div>
<button class="icon-btn to-top" id="toTop" aria-label="top">↑</button>
<div class="lb" id="lb">
  <div class="lb-bar">
    <span class="t" id="lbTitle"></span>
    <button class="icon-btn" data-z="-">−</button>
    <span class="pct" id="lbPct">100%</span>
    <button class="icon-btn" data-z="+">＋</button>
    <button class="icon-btn" data-z="fit" id="lbFit"></button>
    <button class="icon-btn" data-z="1">1:1</button>
    <button class="icon-btn" data-z="x" id="lbClose">✕</button>
  </div>
