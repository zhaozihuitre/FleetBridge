 "sections": [], "refs": [], "created": "2026-11-01 20:20", "updated": "2026-11-01 20:20", "notes": [], "count": 1, "detail_html": "", "notes_html": []}, {"id": "C-032", "type": "change", "title": "手机推送通知（ntfy）（0.8.0）", "summary": "新增 server/push.js：等你授权 / 做完了 / 额度告急 / 负载过高推送到手机通知栏（安卓 ntfy App），扫 ntfy:// 码订阅，点通知打开手机页；内容只含项目与事件。实测：测试通知与测试 agent 完成后的「Monitor 做完了」都送达频道。", "detail": "", "status": "done", "files": ["server/push.js", "server/mobile.js", "server/index.js", "web/index.html", "web/app.js", "web/style.css", "web/i18n.js"], "tags": ["手机", "通知"], "sections": ["02-features"], "refs": [], "created": "2026-11-01 20:28", "updated": "2026-11-01 20:28", "notes": [], "detail_html": "", "notes_html": []}, {"id": "D-012", "type": "decision", "title": "手机系统通知用 ntfy", "summary": "手机网页在 http 下不能发系统通知；Web Push 需 HTTPS 与 PWA，开发量大。ntfy 免费、安卓有官方 App、支持深链接订阅与点击跳转，只需服务端 POST。内容最小化以减少经第三方的信息。", "detail": "", "status": "accepted", "files": [], "tags": ["通知"], "sections": [], "refs": [], "created": "2026-11-01 20:28", "updated": "2026-11-01 20:28", "notes": [], "detail_html": "", "notes_html": []}, {"id": "M-017", "type": "milestone", "title": "发布 0.8.0（手机网页版、手机推送、全屏）", "summary": "main 与 v0.7.1–v0.8.0 标签已推送，GitHub Release 0.8.0 已发布并上传安装包（约 109 MB）。手机推送已在用户安卓手机实测收到。", "detail": "", "status": "done", "files": [], "tags": ["发布"], "sections": [], "refs": ["v0.8.0"], "created": "2026-11-01 20:36", "updated": "2026-11-01 20:36", "notes": [], "detail_html": "", "notes_html": []}, {"id": "I-017", "type": "issue", "title": "额度一直不更新：接口令牌过期后又持续限流", "summary": "安装版额度停在 11/1 18:14：先是令牌过期（Claude Code 早上已刷新），之后接口持续 429（用户终端的状态栏插件也在用同一账号）。改为从我方 agent 的状态栏输入里取额度（Claude Code 自带 rate_limits），不再依赖接口。踩坑：Claude Code 不关闭状态栏 stdin，需边收边解析；Windows 上状态栏由 PowerShell 执行，改用 .cmd 启动器。实测读到 5 小时 5%、本周 14%。", "detail": "", "status": "resolved", "files": ["server/agents.js", "server/collectors/usage.js", "server/index.js"], "tags": ["额度"], "sections": ["02-features"], "refs": [], "created": "2026-11-02 08:38", "updated": "2026-11-02 08:38", "notes": [], "count": 1, "detail_html": "", "notes_html": []}, {"id": "C-033", "type": "change", "title": "小窗最小化到托盘（0.8.1）", "summary": "小窗标题栏「—」与菜单项「最小化到托盘」；系统托盘图标：单击显示 / 隐藏小窗，右键打开指挥中心或退出；状态记在 widget.json。", "detail": "", "status": "done", "files": ["desktop/main.cjs", "web/widget.html", "web/widget.js", "web/i18n.js"], "tags": ["小窗"], "sections": ["02-features"], "refs": [], "created": "2026-11-02 08:39", "updated": "2026-11-02 08:39", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-034", "type": "change", "title": "终端正文改为薄荷绿（0.8.2）", "summary": "用户希望普通字体用绿色、对眼睛更友好：正文 #a6e8c0，次要文字 #86b89c，强调 #dcf8e8；电脑终端与手机屏幕视图（screenhtml）一致。差异里新增行仍是更亮的 #4dffa6，可区分。", "detail": "", "status": "done", "files": ["web/terminal.js", "server/screenhtml.js", "web/m.css"], "tags": ["终端", "配色"], "sections": ["02-features"], "refs": [], "created": "2026-11-02 16:18", "updated": "2026-11-02 16:18", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-035", "type": "change", "title": "布局：总指令台移到最左，大终端在左、小终端在右（0.8.3）", "summary": "从左到右：总指令台 → 当前终端（3/4 宽、全高）→ 其他终端竖排。", "detail": "", "status": "done", "files": ["web/style.css", "web/app.js"], "tags": ["UI", "终端"], "sections": ["02-features"], "refs": [], "created": "2026-11-02 16:23", "updated": "2026-11-02 16:23", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-036", "type": "change", "title": "「任务」标签改为「活动终端」（0.8.4）", "summary": "第二个标签列出所有我方终端（状态、项目、汇报、负载、是否在分屏），单个「▶ 打开」或「⧉ 全部打开」；提醒已全部在消息框，去掉任务页。标签栏收紧间距，计数不再被截断。实测 3 个终端一键全部打开。", "detail": "", "status": "done", "files": ["web/app.js", "web/index.html", "web/style.css", "web/i18n.js"], "tags": ["UI", "终端"], "sections": ["02-features"], "refs": [], "created": "2026-11-03 09:28", "updated": "2026-11-03 09:28", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-037", "type": "change", "title": "活动终端页加「全部结束」（0.8.5）", "summary": "确认框列出将结束的终端，确认后对全部我方 agent 执行 kill；会话保留可继续。曾尝试在该页放「全部关闭（收起）」，但终端打开时此页被终端区覆盖、点不到，改由用户选择为「全部结束」。", "detail": "", "status": "done", "files": ["web/app.js", "web/style.css", "web/i18n.js"], "tags": ["终端"], "sections": ["02-features"], "refs": [], "created": "2026-11-03 09:40", "updated": "2026-11-03 09:40", "notes": [], "detail_html": "", "notes_html": []}, {"id": "I-018", "type": "issue", "title": "输入卡顿：后台服务线程被 git 扫描和同步读文件阻塞", "summary": "终端按键经后台服务转发，服务每 3 秒刷新、每 30 秒扫描 git/历史/今日用量时同步阻塞，最长 3.5 秒。git 移到 worker 线程，扫描改异步，每次刷新的读取做缓存，稳定后停顿约 0.1 秒。", "detail": "排查：echo 延迟正常（32ms），前端无长任务；对 /api/lang 连续探测发现服务端周期性停顿 0.3-3.5s。CPU profile：spawn（git，每仓库 6 个命令，一次 ~140 个进程）、today.js 同步读当日全部 transcript（首读 3.7s）、history.js 同步 stat + 解析、todaysFiles 的同步 stat、sessions.js 每 3s 重读子 agent meta、buildOffline 每 3s stat 16 个 transcript。修复：git 通过 eval 的 worker_threads 启动（兼容 asar，最多并发 4）；today/history/oldestChange 改 fs.promises 并逐块让出事件循环；已完成子 agent meta、离线卡片（30s 或集合变化时重建）、网卡地址（30s）缓存；history 只解析需要的行，cwd 存在性缓存 5 分钟。", "status": "resolved", "files": ["server/collectors/git.js", "server/collectors/today.js", "server/collectors/history.js", "server/collectors/sessions.js", "server/index.js", "server/mobile.js"], "tags": ["性能", "输入"], "sections": [], "refs": [], "created": "2026-11-03 10:38", "updated": "2026-11-03 10:38", "notes": [], "count": 1, "detail_html": "<p>排查：echo 延迟正常（32ms），前端无长任务；对 /api/lang 连续探测发现服务端周期性停顿 0.3-3.5s。CPU profile：spawn（git，每仓库 6 个命令，一次 ~140 个进程）、today.js 同步读当日全部 transcript（首读 3.7s）、history.js 同步 stat + 解析、todaysFiles 的同步 stat、sessions.js 每 3s 重读子 agent meta、buildOffline 每 3s stat 16 个 transcript。修复：git 通过 eval 的 worker_threads 启动（兼容 asar，最多并发 4）；today/history/oldestChange 改 fs.promises 并逐块让出事件循环；已完成子 agent meta、离线卡片（30s 或集合变化时重建）、网卡地址（30s）缓存；history 只解析需要的行，cwd 存在性缓存 5 分钟。<\/p>", "notes_html": []}, {"id": "C-038", "type": "change", "title": "0.8.6：修复输入卡顿；去掉通讯标签", "summary": "后台服务不再被 git/文件扫描阻塞；顶部标签只保留部队、活动终端、存档。", "detail": "", "status": "done", "files": ["web/app.js", "web/index.html", "server/collectors/*"], "tags": [], "sections": [], "refs": [], "created": "2026-11-03 10:38", "updated": "2026-11-03 10:38", "notes": [], "detail_html": "", "notes_html": []}, {"id": "M-018", "type": "milestone", "title": "发布 0.8.6（含 0.8.1-0.8.5）", "summary": "推送 main 与 v0.8.1-v0.8.6 标签，GitHub Release 0.8.6 已上传安装包。", "detail": "", "status": "done", "files": [], "tags": [], "sections": [], "refs": [], "created": "2026-11-03 10:38", "updated": "2026-11-03 10:38", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-039", "type": "change", "title": "0.8.7：普通终端入口（＞_ 终端）", "summary": "终端栏和顶部各有一个「＞_ 终端」按钮，在当前终端的项目目录打开普通 PowerShell 分屏（有 PowerShell 7 时优先用 7）。它不算 agent：不接收总指挥台的指令，不出现在活动终端页和全部结束里，也不写入阵容、重启后不恢复。", "detail": "", "status": "done", "files": ["server/agents.js", "server/index.js", "web/app.js", "web/index.html", "web/i18n.js", "web/style.css"], "tags": ["终端"], "sections": [], "refs": [], "created": "2026-11-03 11:05", "updated": "2026-11-03 11:05", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-040", "type": "change", "title": "0.8.8：语音输入（Windows 语音输入 Win+H）", "summary": "总指挥台输入框旁和每个终端标题栏有麦克风按钮：先把焦点放到输入框或该终端，再由桌面端按下 Win+H，调出 Windows 自带的语音输入，说的话直接打进去。只在桌面版显示。", "detail": "Electron 里 Web Speech API 不可用（需要 Google key），所以用系统的语音输入。Electron 不能发送系统级按键，desktop/voice.cjs 常驻一个隐藏的 PowerShell，通过 user32 keybd_event 按 Win+H；打开指挥中心时预热（Add-Type 编译约 0.4s），退出时结束。", "status": "done", "files": ["desktop/voice.cjs", "desktop/main.cjs", "web/app.js", "web/index.html", "web/i18n.js", "web/style.css"], "tags": ["语音", "输入"], "sections": [], "refs": [], "created": "2026-11-03 11:16", "updated": "2026-11-03 11:16", "notes": [], "detail_html": "<p>Electron 里 Web Speech API 不可用（需要 Google key），所以用系统的语音输入。Electron 不能发送系统级按键，desktop/voice.cjs 常驻一个隐藏的 PowerShell，通过 user32 keybd_event 按 Win+H；打开指挥中心时预热（Add-Type 编译约 0.4s），退出时结束。<\/p>", "notes_html": []}, {"id": "C-041", "type": "change", "title": "0.8.9：指令页（排队列表 + 指令记录）", "summary": "新增「指令」标签：上半部分按 agent 分组列出排队中的指令（序号、排队时间，可单条移除或清空）；下半部分是指令记录：每条指令的时间、状态（已发送 / 已排队 / 排队→已发出并显示等了多久 / 已移除）、发给哪个 agent 和项目、是否来自手机。记录写在 DATA_DIR/orders.jsonl，重启后保留（内存保留 500 条，状态里带最近 150 条）。", "detail": "", "status": "done", "files": ["server/orders.js", "server/queue.js", "server/index.js", "web/app.js", "web/index.html", "web/i18n.js", "web/style.css"], "tags": ["排队", "指令"], "sections": [], "refs": [], "created": "2026-11-03 11:31", "updated": "2026-11-03 11:31", "notes": [], "detail_html": "", "notes_html": []}, {"id": "C-042", "type": "change", "title": "保持唤醒（0.8.10）", "summary": "小窗菜单新增「保持唤醒」：有任务时 / 始终 / 关闭，可选屏幕也不熄灭；用 Electron powerSaveBlocker，生效时小窗显示 ☀", "detail": "有任务时 = 有 agent 作战、等授权或排队未发完（server fleetBusy()），结束 3 分钟后释放。默认只防休眠（prevent-app-suspension），勾选后改为 prevent-display-sleep。主进程每 10 秒检查一次。不能阻止手动睡眠、合盖或组策略。设置存在 widget.json（awakeMode/awakeScreen）。", "status": "done", "files": ["desktop/awake.cjs", "desktop/main.cjs", "server/index.js", "web/widget.html", "web/widget.js", "web/i18n.js"], "tags": ["desktop", "power"], "sections": [], "refs": [], "created": "2026-11-03 13:05", "updated": "2026-11-03 13:05", "notes": [], "detail_html": "<p>有任务时 = 有 agent 作战、等授权或排队未发完（server fleetBusy()），结束 3 分钟后释放。默认只防休眠（prevent-app-suspension），勾选后改为 prevent-display-sleep。主进程每 10 秒检查一次。不能阻止手动睡眠、合盖或组策略。设置存在 widget.json（awakeMode/awakeScreen）。<\/p>", "notes_html": []}, {"id": "C-043", "type": "change", "title": "主控终端（0.9.0）", "summary": "总指挥台可切换为「主控」：一个 Claude Code 终端，通过 fleet MCP 工具查看和指挥其他终端；原输入框保留，可随时切换", "detail": "server/fleet-mcp.cjs：零依赖 stdio MCP 服务器，经本地 HTTP 接口提供 fleet_status / fleet_read_screen / fleet_send（auto 时作战中的排队）/ fleet_answer / fleet_key / fleet_unqueue / fleet_projects / fleet_spawn。server/master.js：主控在 DATA_DIR/master 下运行（CLAUDE.md 写角色说明，用户可改），--mcp-config + --strict-mcp-config + --allowedTools（除 fleet_answer 外预授权，回应别人的授权要先问用户）。会话 id 存 master.json，重启自动接着上次；主控的会话不进部队、提醒、阵容和存档。新增接口 POST /api/master、GET /api/agents/screen。指令记录里来源显示「主控」。首次进入主控文件夹 Claude Code 会问一次是否信任。", "status": "done", "files": ["server/fleet-mcp.cjs", "server/master.js", "server/index.js", "server/agents.js", "web/index.html", "web/app.js", "web/style.css", "web/i18n.js"], "tags": ["master", "mcp"], "sections": [], "refs": [], "created": "2026-11-03 13:40", "updated": "2026-11-03 13:40", "notes": [], "detail_html": "<p>server/fleet-mcp.cjs：零依赖 stdio MCP 服务器，经本地 HTTP 接口提供 fleet_status / fleet_read_screen / fleet_send（auto 时作战中的排队）/ fleet_answer / fleet_key / fleet_unqueue / fleet_projects / fleet_spawn。server/master.js：主控在 DATA_DIR/master 下运行（CLAUDE.md 写角色说明，用户可改），--mcp-config + --strict-mcp-config + --allowedTools（除 fleet_answer 外预授权，回应别人的授权要先问用户）。会话 id 存 master.json，重启自动接着上次；主控的会话不进部队、提醒、阵容和存档。新增接口 POST /api/master、GET /api/agents/screen。指令记录里来源显示「主控」。首次进入主控文件夹 Claude Code 会问一次是否信任。<\/p>", "notes_html": []}, {"id": "C-044", "type": "change", "title": "主控操作指挥中心界面（0.9.1）", "summary": "主控新增 fleet_ui 工具：切标签页、翻页、选存档文件夹、在分屏里打开/关闭终端、切换分屏模式、搜索会话、打开审查改动、全屏/最大化/最小化、切换主控/输入框；每次返回界面当前显示内容", "detail": "服务端 POST /api/ui 把指令作为 SSE 命名事件 ui 发给指挥中心页面（/api/stream?main=1），页面执行后 POST /api/ui/done 回报 view；8 秒超时。没有打开的页面时由桌面端 setUiOpener 打开窗口，指令排队等页面连上（超过 8 秒的丢弃）。主控终端有焦点时，执行完把键盘焦点还给主控。主控 CLAUDE.md 默认内容更新（用户改过的不覆盖）。", "status": "done", "files": ["server/index.js", "server/fleet-mcp.cjs", "server/master.js", "desktop/main.cjs", "web/app.js"], "tags": ["master", "mcp"], "sections": [], "refs": [], "created": "2026-11-03 13:55", "updated": "2026-11-03 13:55", "notes": [], "detail_html": "<p>服务端 POST /api/ui 把指令作为 SSE 命名事件 ui 发给指挥中心页面（/api/stream?main=1），页面执行后 POST /api/ui/done 回报 view；8 秒超时。没有打开的页面时由桌面端 setUiOpener 打开窗口，指令排队等页面连上（超过 8 秒的丢弃）。主控终端有焦点时，执行完把键盘焦点还给主控。主控 CLAUDE.md 默认内容更新（用户改过的不覆盖）。<\/p>", "notes_html": []}, {"id": "C-045", "type": "change", "title": "主控里 @ 选终端（0.9.2）", "summary": "在主控终端按 @ 弹出正在运行的终端列表（作战中的在前，带状态，多于一个时有 @all），打字筛选、↑↓ 选、Enter/Tab 插入 @名字；Esc 输入普通 @，保留 Claude Code 自己的文件引用", "detail": "terminal.js 新增 onInput 钩子（返回 false 拦截按键）和 send/paste；选中项以 bracketed paste 插入，避免触发 Claude Code 的 @ 文件补全。fleet 工具认 @handle（名字小写、空格转-，重名带 id 前 4 位）和 @all。主控 CLAUDE.md 默认内容加入 @ 说明（用户改过的不覆盖）。另修：桌面端在服务器 start 之前注册 setUiOpener，启动期间的界面指令也能打开窗口。", "status": "done", "files": ["web/terminal.js", "web/app.js", "web/index.html", "web/style.css", "web/i18n.js", "server/fleet-mcp.cjs", "server/master.js", "desktop/main.cjs"], "tags": ["master"], "sections": [], "refs": [], "created": "2026-11-03 14:05", "updated": "2026-11-03 14:05", "notes": [], "detail_html": "<p>terminal.js 新增 onInput 钩子（返回 false 拦截按键）和 send/paste；选中项以 bracketed paste 插入，避免触发 Claude Code 的 @ 文件补全。fleet 工具认 @handle（名字小写、空格转-，重名带 id 前 4 位）和 @all。主控 CLAUDE.md 默认内容加入 @ 说明（用户改过的不覆盖）。另修：桌面端在服务器 start 之前注册 setUiOpener，启动期间的界面指令也能打开窗口。<\/p>", "notes_html": []}, {"id": "C-046", "type": "change", "title": "总指令台统计卡压成一行（0.9.3）", "summary": "左栏顶部四个统计卡从 2×2（约 200px 高）改为一行四格（约 49px），下面的主控终端/消息区相应变高；左栏宽度不变", "detail": "每格只留数字和名称（数字 22→18px，名称 12→11px，超长省略号），副标题和说明移到悬停提示，今日 token 悬停显示完整数值。应主控转达的用户要求（方案 B）。", "status": "done", "files": ["web/app.js", "web/style.css"], "tags": ["ui"], "sections": [], "refs": [], "created": "2026-11-03 14:19", "updated": "2026-11-03 14:19", "notes": [], "detail_html": "<p>每格只留数字和名称（数字 22→18px，名称 12→11px，超长省略号），副标题和说明移到悬停提示，今日 token 悬停显示完整数值。应主控转达的用户要求（方案 B）。<\/p>", "notes_html": []}, {"id": "C-047", "type": "change", "title": "子 agent 的提问自动回传主控（0.9.4）", "summary": "除授权框外，AskUserQuestion 选择框、计划确认等带光标的编号菜单也会被识别为 needs-answer；舰桥把问题全文和选项以【舰桥通知】消息直接发进主控会话，同一问题只发一次，回答后清除", "detail": "检测：agents.js questionPrompt()（menuOptions + 菜单上方到分隔线的文字），permissionPrompt 加 kind。index.js publish 里两者合并进 unit.permission（提醒、手机推送也随之覆盖选择框），收集 asks 调 master.js notifyMaster()。推送：sendText 到主控；用户 20 秒内在主控里打过字或主控输入行不为空（inputEmpty：❯ 行后只有空白或暗色占位符）时延后到下次刷新。去重：按 agent 记下问题 key，问题消失即清除。fleet_status 显示 needs-answer 及问题和选项，fleet_answer 按编号回答。主控 CLAUDE.md 说明【舰桥通知】来源。实测：asker 弹出 AskUserQuestion 后约 1 次刷新内主控收到通知并转告；fleet_answer 选 2 后 asker 回复「收到：先别操作」，状态回到 idle。注意：用户级 Warp 插件的 PermissionRequest hook 在 Windows 上报错时会让 AskUserQuestion 直接失败（框不弹出）。", "status": "done", "files": ["server/agents.js", "server/index.js", "server/master.js", "server/fleet-mcp.cjs"], "tags": ["master"], "sections": [], "refs": [], "created": "2026-11-03 14:29", "updated": "2026-11-03 14:29", "notes": [], "detail_html": "<p>检测：agents.js questionPrompt()（menuOptions + 菜单上方到分隔线的文字），permissionPrompt 加 kind。index.js publish 里两者合并进 unit.permission（提醒、手机推送也随之覆盖选择框），收集 asks 调 master.js notifyMaster()。推送：sendText 到主控；用户 20 秒内在主控里打过字或主控输入行不为空（inputEmpty：❯ 行后只有空白或暗色占位符）时延后到下次刷新。去重：按 agent 记下问题 key，问题消失即清除。fleet_status 显示 needs-answer 及问题和选项，fleet_answer 按编号回答。主控 CLAUDE.md 说明【舰桥通知】来源。实测：asker 弹出 AskUserQuestion 后约 1 次刷新内主控收到通知并转告；fleet_answer 选 2 后 asker 回复「收到：先别操作」，状态回到 idle。注意：用户级 Warp 插件的 PermissionRequest hook 在 Windows 上报错时会让 AskUserQuestion 直接失败（框不弹出）。<\/p>", "notes_html": []}, {"id": "C-048", "type": "change", "title": "手机 PIN 登录、手机页修复、前台不弹通知（0.9.5）", "summary": "手机访问改为 PIN 登录（默认 123456，可改，设备会话 30 天），连续输错锁定，只允许局域网/Tailscale；修好手机页断线不重连和终端难看的问题；指挥中心在前台有焦点时不弹系统通知", "detail": "PIN：server/phoneauth.js（scrypt 加盐存 PIN，会话 token 只存 SHA-256，30 天滑动有效；同一地址错 5 次锁 5 分钟、逐次翻倍到 1 小时，10 分钟内全局错 30 次全部锁 10 分钟；isPrivateAddress 只放行 10/8、172.16/12、192.168/16、169.254/16、100.64/10、回环和 IPv6 本地）。扫码链接保留，扫码直接登录；旧版配对的 cookie 继续有效直到重新生成二维码；改 PIN 或「让所有手机退出登录」会清掉全部会话。cookie 改为 SameSite=Lax（从推送通知点开时也带上）。指挥中心手机面板：改 PIN、默认 PIN 提醒、已登录设备数、电脑名地址。手机页：EventSource 出错关闭后自己重连、回到前台重连、会话失效回 PIN 页（原来会一直停在离线）；终端默认折行、整行分隔线缩成细线；下拉框/排队按钮 44px；/api/lang 不再 404。通知：getFocusedWindow 在最小化后仍返回窗口，改为只有指挥中心/弹出终端可见、未最小化且有焦点时才不弹。打不开的原因：IP 在公司域 Wi-Fi 上由 DHCP 变动导致收藏地址和配对失效；EventSource 断开后不重连；手机不在同一网络时需 Tailscale。", "status": "done", "files": ["server/phoneauth.js", "server/mobile.js", "web/m.js", "web/m.css", "web/m.html", "web/app.js", "web/index.html", "web/style.css", "web/i18n.js", "desktop/main.cjs", ".gitignore"], "tags": ["phone", "security", "notify"], "sections": [], "refs": [], "created": "2026-11-03 14:42", "updated": "2026-11-03 14:42", "notes": [], "detail_html": "<p>PIN：server/phoneauth.js（scrypt 加盐存 PIN，会话 token 只存 SHA-256，30 天滑动有效；同一地址错 5 次锁 5 分钟、逐次翻倍到 1 小时，10 分钟内全局错 30 次全部锁 10 分钟；isPrivateAddress 只放行 10/8、172.16/12、192.168/16、169.254/16、100.64/10、回环和 IPv6 本地）。扫码链接保留，扫码直接登录；旧版配对的 cookie 继续有效直到重新生成二维码；改 PIN 或「让所有手机退出登录」会清掉全部会话。cookie 改为 SameSite=Lax（从推送通知点开时也带上）。指挥中心手机面板：改 PIN、默认 PIN 提醒、已登录设备数、电脑名地址。手机页：EventSource 出错关闭后自己重连、回到前台重连、会话失效回 PIN 页（原来会一直停在离线）；终端默认折行、整行分隔线缩成细线；下拉框/排队按钮 44px；/api/lang 不再 404。通知：getFocusedWindow 在最小化后仍返回窗口，改为只有指挥中心/弹出终端可见、未最小化且有焦点时才不弹。打不开的原因：IP 在公司域 Wi-Fi 上由 DHCP 变动导致收藏地址和配对失效；EventSource 断开后不重连；手机不在同一网络时需 Tailscale。<\/p>", "notes_html": []}, {"id": "I-019", "type": "issue", "title": "部队页卡片里的仓库被裁掉（0.9.6 修复）", "summary": "窗口较矮或仓库较多时，卡片底部的仓库被直接裁掉且没有提示；另外每张卡片最多只列 4 个仓库", "detail": "原因：.unit 卡片高度固定为可用区域高度、overflow:hidden，.repos 也是 overflow:hidden，放不下的仓库被静默裁掉（1366×728 下一张有 4 个仓库的卡片只显示 2 个，溢出 126px）；unitCard 还把仓库截成前 4 个，其余只写「还有 N 个仓库…」。修复：仓库列表占卡片剩余高度、可在卡片内滚动（细滚动条放进卡片右内边距，行宽不变），列出全部仓库，标题行吸顶，下面还有内容时底部渐隐；卡片按 data-unit 记住列表滚动位置，3 秒一次的整页刷新后恢复；LOAD 标签放不下时省略号，数字不折行。验证 1366×728 / 1280×800 / 1600×900 / 1920×1032，卡片外无内容溢出；活动终端/指令/存档页与手机版不受影响（改动只限 .unit/.repos，手机页用 m.css）。", "status": "resolved", "files": ["web/app.js", "web/style.css"], "tags": ["ui", "units"], "sections": [], "refs": [], "created": "2026-11-04 08:37", "updated": "2026-11-04 08:37", "notes": [], "count": 1, "detail_html": "<p>原因：.unit 卡片高度固定为可用区域高度、overflow:hidden，.repos 也是 overflow:hidden，放不下的仓库被静默裁掉（1366×728 下 one-project 的 4 个仓库只显示 2 个，溢出 126px）；unitCard 还把仓库截成前 4 个，其余只写「还有 N 个仓库…」。修复：仓库列表占卡片剩余高度、可在卡片内滚动（细滚动条放进卡片右内边距，行宽不变），列出全部仓库，标题行吸顶，下面还有内容时底部渐隐；卡片按 data-unit 记住列表滚动位置，3 秒一次的整页刷新后恢复；LOAD 标签放不下时省略号，数字不折行。验证 1366×728 / 1280×800 / 1600×900 / 1920×1032，卡片外无内容溢出；活动终端/指令/存档页与手机版不受影响（改动只限 .unit/.repos，手机页用 m.css）。<\/p>", "notes_html": []}, {"id": "I-020", "type": "issue", "title": "终端最后一行和右边缘被裁掉（0.9.7 修复）", "summary": "主控终端和分屏终端都比容器多算了约一行、几列：底部状态行被挡住一部分，最右边几列在滚动条下面；换到缩放比例不同的显示器后尺寸不再恢复", "detail": "原因：xterm 的 FitAddon 用父元素的 CSS 宽高计算行列，宿主元素有内边距且为 border-box，读到的尺寸包含内边距（主控 +10px 高 / +12px 宽，分屏 +12px / +14px）。实测主控画布 480×547 放在 483×537 的区域里，滚动条 10px。修复（web/terminal.js）：xterm 挂在无内边距的内层 .term-fit 上，ResizeObserver 观察它；字体加载完成后重新适配；devicePixelRatio 变化（跨显示器）时重建 WebGL 渲染器并重新适配（原来模拟 1.25→1→1.25 后画布卡在 504×630 不再恢复）。修复后主控 467×533、分屏 900×593 都在区域内并给滚动条留了位置，缩放变化后仍正确；中日文框线表格对齐正常。另：主控里的乱码是用户级 Warp 插件 hook 在 Windows 上的日文报错，不是渲染问题。", "status": "resolved", "files": ["web/terminal.js"], "tags": ["terminal", "ui"], "sections": [], "refs": [], "created": "2026-11-04 08:42", "updated": "2026-11-04 08:42", "notes": [], "count": 1, "detail_html": "<p>原因：xterm 的 FitAddon 用父元素的 CSS 宽高计算行列，宿主元素有内边距且为 border-box，读到的尺寸包含内边距（主控 +10px 高 / +12px 宽，分屏 +12px / +14px）。实测主控画布 480×547 放在 483×537 的区域里，滚动条 10px。修复（web/terminal.js）：xterm 挂在无内边距的内层 .term-fit 上，ResizeObserver 观察它；字体加载完成后重新适配；devicePixelRatio 变化（跨显示器）时重建 WebGL 渲染器并重新适配（原来模拟 1.25→1→1.25 后画布卡在 504×630 不再恢复）。修复后主控 467×533、分屏 900×593 都在区域内并给滚动条留了位置，缩放变化后仍正确；中日文框线表格对齐正常。另：主控里的乱码是用户级 Warp 插件 hook 在 Windows 上的日文报错，不是渲染问题。<\/p>", "notes_html": []}]}</script>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tc = t => `var(--c-${t})`;
const byTime = (a,b) => (b.updated||'').localeCompare(a.updated||'');
const PRANK = {P0:0,P1:1,P2:2};
const byPrio = (a,b) => (PRANK[a.priority]??3) - (PRANK[b.priority]??3) || byTime(a,b);
const EMAP = Object.fromEntries(E.map(e=>[e.id,e]));
const toDate = s => new Date((s||'').replace(' ','T'));
const genAt = toDate(D.generated);
const staleDays = e => {
  if(e.type!=='todo' || e.status!=='open') return 0;
  const n = Math.floor((genAt - toDate(e.updated)) / 86400000);
  return n >= (D.stale_days||30) ? n : 0;
};
const isOpenTodo = e => e.type==='todo' && (e.status==='open'||e.status==='doing');
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';

/* ---------- views ---------- */
const prioTag = e => e.priority ? `<span class="prio ${e.priority}">${e.priority}</span>` : '';

function entryCard(e, q, open){
  const hl = s => q ? esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<span class="hl">${m}</span>`) : esc(s);
  const st = e.status ? `<span class="status ${e.status}">${L.status[e.status]||esc(e.status)}</span>` : '';
  const hits = e.type==='issue' && (e.count||1)>1 ? `<span class="hits">${L.hits(e.count)}</span>` : '';
  const sd = staleDays(e), stale = sd ? `<span class="stale">⏳ ${L.stale(sd)}</span>` : '';
  const secs = (e.sections||[]).map(id=>{const s=S.find(x=>x.id===id);return `<a href="#/doc/${id}">📄 ${esc(s?s.title:id)}</a>`}).join('');
  const nn = (e.notes_html||[]).length;
  const detail = e.detail_html || nn ? `<details ${q||open?'open':''}><summary>${L.detail}${nn?L.notes(nn):''}</summary><div class="doc">${e.detail_html||''}${(e.notes_html||[]).map(n=>`<div class="note"><span class="d">${esc(n.time)}</span>${n.html}</div>`).join('')}</div></details>` : '';
  return `<div class="entry ${e.type==='todo'&&!isOpenTodo(e)?'done-todo':''}" style="--tc:${tc(e.type)}" id="${e.id}">
    <div class="e-head"><span class="badge">${T[e.type]}</span>${prioTag(e)}<a class="eid" href="#/entry/${e.id}">${e.id}</a><span class="e-title">${hl(e.title)}</span>${st}${hits}${stale}
    <span class="e-time" title="${L.created} ${esc(e.created)}">${esc(e.updated)}</span></div>
    ${e.summary?`<div class="e-sum">${hl(e.summary)}</div>`:''}
    ${detail}
    <div class="e-foot">${(e.refs||[]).map(r=>`<span class="ref">@${esc(r)}</span>`).join('')}${(e.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}${(e.files||[]).map(f=>`<span class="file">${esc(f)}</span>`).join('')}${secs}</div>
  </div>`;
}

function viewHome(){

  const ov = S.find(s=>s.id==='overview');

  const box = (title, href, rows) => `<div class="box"><h3>${title}${href?`<a href="${href}">${L.viewAll} →</a>`:''}</h3>${rows||`<div class="meta-sm">${L.none}</div>`}</div>`;

    ${stat('#/timeline', tc('milestone'), ms.length, L.statMs)}
    ${stat('#/log/change', tc('change'), cnt('change'), L.statChange)}

    ${box(L.boxIssue, '#/log/issue', issues.slice(0,6).map(e=>mini(e,(e.count||1)>1?`<span class="hits">×${e.count}</span>`:'')).join(''))}
    ${box(L.boxMs, '#/timeline', ms.slice(0,6).map(e=>mini(e)).join(''))}
  </div>

function viewDoc(id){

function viewLog(type){
  crumb([L.records, type?T[type]:L.all]);
  const base = E.filter(e=>!type||e.type===type);
  let list = base;
  if(state.status) list = list.filter(e=>e.status===state.status);
  if(state.tag) list = list.filter(e=>(e.tags||[]).includes(state.tag));
  if(state.prio) list = list.filter(e=>(e.priority||'-')===state.prio);
  const statuses = [...new Set(base.map(e=>e.status).filter(Boolean))];
  const tags = [...new Set(base.flatMap(e=>e.tags||[]))];
  const prios = [...new Set(base.map(e=>e.priority).filter(Boolean))].sort();
  const chip = (k,v,label) => `<button class="chip ${state[k]===v?'on':''}" data-k="${k}" data-v="${esc(v??'')}">${esc(label)}</button>`;
  const gap = '<span class="gap"></span>';
  let body;
  if(type==='todo'){                // TODO 按 未完成(P0→P2) / 已关闭 分组
    const groups = [['P0','P0'],['P1','P1'],['P2','P2'],['-',L.noPrio]];
    const open = list.filter(isOpenTodo), closed = list.filter(e=>!isOpenTodo(e)).sort(byTime);
    body = groups.map(([p,label])=>{
      const g = open.filter(e=>(e.priority||'-')===p).sort(byTime);
      return g.length ? `<div class="group-h">${p==='-'?esc(label):`<span class="prio ${p}">${p}</span>`}<span class="cnt">${g.length}</span></div>${g.map(e=>entryCard(e)).join('')}` : '';
    }).join('') + (closed.length ? `<div class="group-h">${L.closed}<span class="cnt">${closed.length}</span></div>${closed.map(e=>entryCard(e)).join('')}` : '');
  } else {
    body = list.sort(byTime).map(e=>entryCard(e)).join('');
  }
  return `<div class="doc"><h1>${type?T[type]:L.all}</h1></div>
  <div class="filters">${chip('status',null,L.allStatus)}${statuses.map(s=>chip('status',s,L.status[s]||s)).join('')}
  ${prios.length?gap+chip('prio',null,L.allPrio)+prios.map(p=>chip('prio',p,p)).join(''):''}
  ${tags.length?gap+chip('tag',null,L.allTags)+tags.map(t=>chip('tag',t,'#'+t)).join(''):''}</div>
  ${body||`<div class="meta-sm">${L.noRecords}</div>`}`;
}

/* ---------- toc + scrollspy ---------- */
let spyHeads = [];
function toc(){
  const body = $('#docBody'); if(!body) return '';
  const hs = [...body.querySelectorAll('h2,h3')]; if(hs.length<2) return '';
  spyHeads = hs;
  return `<nav class="toc" id="toc"><b>${L.toc}</b>${hs.map(h=>`<a class="l${h.tagName[1]}" href="javascript:void(0)" data-to="${h.id}">${esc(h.textContent)}</a>`).join('')}</nav>`;
}
function spy(){
  const tocEl = $('#toc'); if(!tocEl || !spyHeads.length) return;
  let cur = spyHeads[0];
  for(const h of spyHeads){ if(h.getBoundingClientRect().top < 110) cur = h; else break; }
  if(innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = spyHeads[spyHeads.length-1];
  tocEl.querySelectorAll('a').forEach(a => {
    const on = a.dataset.to === cur.id;
    if(on && !a.classList.contains('on')){
      const r = a.getBoundingClientRect(), tr = tocEl.getBoundingClientRect();
      if(r.top < tr.top || r.bottom > tr.bottom) tocEl.scrollTop += r.top - tr.top - tr.height/3;
    }
    a.classList.toggle('on', on);
  });
}
let spyRaf = 0;
addEventListener('scroll', () => {
  $('#toTop').classList.toggle('show', scrollY > 600);
  if(!spyRaf) spyRaf = requestAnimationFrame(() => { spyRaf = 0; spy(); });
}, {passive:true});

/* ---------- auto-link C-001 / D-003 … (skip code/pre/a) ---------- */
const ID_RE = /\b([CMITD]-\d{3,})\b/g, ID_TEST = /\b[CMITD]-\d{3,}\b/;
function linkIds(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('code,pre,a,.eid,.mm-err,script') || !ID_TEST.test(n.nodeValue)
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(ID_RE, id => {
      const e = EMAP[id];
      return e ? `<a class="eref" href="#/entry/${id}" title="${esc(T[e.type]+' · '+e.title)}">${id}</a>`
               : `<a class="eref missing" title="?">${id}</a>`;
    });
    n.replaceWith(...span.childNodes);
  });
}

/* ---------- code blocks: language label + copy ---------- */
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  return new Promise((res,rej)=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy') ? res() : rej(); }catch(e){ rej(e); } ta.remove(); });
}
function enhanceCode(root){
  root.querySelectorAll('pre:not(.mermaid)').forEach(pre => {
    if(pre.parentElement.classList.contains('codeblock')) return;
    const w = document.createElement('div'); w.className = 'codeblock';
    const lang = ((pre.querySelector('code')||{}).className||'').replace(/^lang-/,'');
    pre.replaceWith(w); w.appendChild(pre);
    w.insertAdjacentHTML('afterbegin', `${lang?`<span class="lang">${esc(lang)}</span>`:''}<button class="copy">${L.copy}</button>`);
    if(!lang) pre.style.paddingTop = '14px';
  });
}

/* ---------- mermaid ---------- */
const MERMAID_SRC = ['assets/mermaid.min.js',
  'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
  'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js'];
let mermaidReady = null, mermaidSeq = 0, renderGen = 0;
function loadMermaid(){
  if(window.mermaid) return Promise.resolve(true);
  if(!mermaidReady) mermaidReady = new Promise(res => {
    const tryAt = i => {
      if(i >= MERMAID_SRC.length) return res(false);
      const s = document.createElement('script'); s.src = MERMAID_SRC[i];
      s.onload = () => res(true); s.onerror = () => { s.remove(); tryAt(i+1); };
      document.head.appendChild(s);
    };
    tryAt(0);
  });
  return mermaidReady;
}
async function runMermaid(){
  const gen = renderGen;
  const nodes = [...document.querySelectorAll('pre.mermaid:not([data-done])')]; if(!nodes.length) return;
  const ok = await loadMermaid();
  if(gen !== renderGen) return;
  if(!ok){ nodes.forEach(n => n.insertAdjacentHTML('beforebegin',`<div class="mm-err">${esc(L.mmFail)}</div>`)); return; }
  mermaid.initialize({startOnLoad:false, theme: isDark()?'dark':'default', securityLevel:'loose'});
  for(const n of nodes){           // 逐张渲染：单张语法错误不影响其他图
    if(gen !== renderGen || !n.isConnected) return;
    n.dataset.done = '1';
    const src = n.textContent;
    try{
      const { svg } = await mermaid.render('mm-' + (++mermaidSeq), src);
      n.innerHTML = svg; n.classList.add('mm-ok'); n.dataset.hint = L.zoomHint;
    }catch(e){
      document.getElementById('dmm-' + mermaidSeq)?.remove();
      n.insertAdjacentHTML('beforebegin', `<div class="mm-err">${esc(L.mmErr)}${esc(String(e && (e.message||e)).split('\n').slice(0,3).join(' '))}</div>`);
    }
  }
  spy();
}

/* ---------- lightbox: zoom / pan diagrams ---------- */
const LB = { s:1, x:0, y:0, w:0, h:0 };
function lbApply(){ $('#lbInner').style.transform = `translate(${LB.x}px,${LB.y}px) scale(${LB.s})`; $('#lbPct').textContent = Math.round(LB.s*100)+'%'; }
function lbFit(){
  const st = $('#lbStage').getBoundingClientRect(), pad = 40;
  LB.s = Math.min((st.width-pad*2)/LB.w, (st.height-pad*2)/LB.h, 4);
  LB.x = (st.width - LB.w*LB.s)/2; LB.y = Math.max(pad, (st.height - LB.h*LB.s)/2); lbApply();
}
function lbZoomAt(f, cx, cy){
  const ns = Math.min(8, Math.max(.1, LB.s*f));
  LB.x = cx - (cx - LB.x) * ns/LB.s; LB.y = cy - (cy - LB.y) * ns/LB.s; LB.s = ns; lbApply();
}
function openLightbox(pre){
  const svg = pre.querySelector('svg'); if(!svg) return;
  const vb = (svg.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
  const r = svg.getBoundingClientRect();
  LB.w = vb[2] || r.width; LB.h = vb[3] || r.height;
  const c = svg.cloneNode(true);
  c.removeAttribute('style'); c.setAttribute('width', LB.w); c.setAttribute('height', LB.h);
  $('#lbInner').replaceChildren(c);
  let h = pre.previousElementSibling; while(h && !/^H[1-4]$/.test(h.tagName)) h = h.previousElementSibling;
  $('#lbTitle').textContent = h ? h.textContent : L.diagram;
  $('#lb').classList.add('open'); document.body.style.overflow = 'hidden';
  lbFit();
}
function closeLightbox(){ $('#lb').classList.remove('open'); document.body.style.overflow = ''; $('#lbInner').replaceChildren(); }
$('#lbFit').textContent = L.fit; $('#lbHelp').textContent = L.lbHelp;
document.querySelectorAll('.lb-bar [data-z]').forEach(b => b.onclick = () => {
  const z = b.dataset.z, st = $('#lbStage').getBoundingClientRect();
  if(z==='x') return closeLightbox();
  if(z==='fit') return lbFit();
  if(z==='1'){ lbZoomAt(1/LB.s, st.width/2, st.height/2); return; }
  lbZoomAt(z==='+'?1.25:0.8, st.width/2, st.height/2);
});
(function(){
  const st = $('#lbStage'); let drag = null;
  st.addEventListener('wheel', ev => { ev.preventDefault(); const r = st.getBoundingClientRect();
    lbZoomAt(ev.deltaY < 0 ? 1.12 : 1/1.12, ev.clientX - r.left, ev.clientY - r.top); }, {passive:false});
  st.addEventListener('pointerdown', ev => { drag = {x:ev.clientX, y:ev.clientY, ox:LB.x, oy:LB.y}; st.setPointerCapture(ev.pointerId); st.classList.add('drag'); });
  st.addEventListener('pointermove', ev => { if(!drag) return; LB.x = drag.ox + ev.clientX - drag.x; LB.y = drag.oy + ev.clientY - drag.y; lbApply(); });
  const end = () => { drag = null; st.classList.remove('drag'); };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  addEventListener('resize', () => { if($('#lb').classList.contains('open')) lbFit(); });
})();

/* ---------- router ---------- */
function renderRoute(keepScroll){
  renderGen++;
  const r = (location.hash||'#/').slice(1);
  const q = $('#q').value.trim();
  const v = $('#view'); let h, full = true;
  spyHeads = [];
  if(q){ h = viewSearch(q); }
  else if(r.startsWith('/doc/')){ h = viewDoc(decodeURIComponent(r.slice(5))); full = false; }
  else if(r.startsWith('/entry/')){ h = viewEntry(r.slice(7)); }
  else if(r==='/timeline'){ h = viewTimeline(); }
  else if(r.startsWith('/log')){ h = viewLog(r.split('/')[2]||null); }
  else { h = viewHome(); }
  const y = scrollY;
  v.className = 'wrap' + (full?' full':'');
  v.innerHTML = `<div>${h}</div>`;
  if(!full){ const t = toc(); if(t) v.insertAdjacentHTML('beforeend', t); else v.className='wrap full'; }
  v.querySelectorAll('.doc').forEach(el => { linkIds(el); enhanceCode(el); });
  nav(); runMermaid(); spy();
  if(keepScroll) scrollTo(0, y);
}

document.addEventListener('click', ev => {
  const c = ev.target.closest('.chip');
  if(c){ const k=c.dataset.k; state[k] = c.dataset.v || null; renderRoute(true); return; }
  const t = ev.target.closest('[data-to]');
  if(t){ document.getElementById(t.dataset.to)?.scrollIntoView({behavior:'smooth'}); return; }
  const cp = ev.target.closest('.codeblock .copy');
  if(cp){ copyText(cp.parentElement.querySelector('pre').innerText).then(()=>{ cp.textContent=L.copied; cp.classList.add('ok');
    setTimeout(()=>{ cp.textContent=L.copy; cp.classList.remove('ok'); }, 1500); }).catch(()=>{}); return; }
  const mm = ev.target.closest('pre.mermaid.mm-ok');
  if(mm){ openLightbox(mm); return; }
  if(ev.target.closest('.nav a')) closeNav();
});
$('#toTop').onclick = () => scrollTo({top:0, behavior:'smooth'});
addEventListener('keydown', ev => {
  if(ev.key==='Escape'){
    if($('#lb').classList.contains('open')) return closeLightbox();
    if(document.body.classList.contains('nav-open')) return closeNav();
    if(document.activeElement===$('#q')){ $('#q').value=''; $('#q').blur(); renderRoute(); }
    return;
  }
  if(ev.key==='/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    ev.preventDefault(); if(innerWidth<=900) document.body.classList.add('nav-open'); $('#q').focus();
  }
  if(ev.key==='Enter' && document.activeElement===$('#q')) closeNav();
});
addEventListener('hashchange', () => { state = {status:null,tag:null,prio:null}; $('#q').value=''; closeNav(); renderRoute(); scrollTo(0,0); });
let qt; $('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => renderRoute(), 150); });
renderRoute();
</script>
